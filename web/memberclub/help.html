<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="help.pageTitle">Help Centre · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 data-i18n="help.title"></h1>
    <p class="muted" data-i18n="help.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <input id="helpSearch" class="help-search" type="search" data-i18n-ph="help.searchPh" autocomplete="off">

    <div class="tabs" id="helpTabs">
      <button data-tab="club" class="active" data-i18n="help.tabClub"></button>
      <button data-tab="store" data-i18n="help.tabStore"></button>
    </div>

    <div class="card">
      <div id="helpCats" class="filter-chips"></div>
      <div id="helpList" class="faq-list"><p class="empty" data-i18n="common.loading"></p></div>
      <div id="helpPager" class="pager hidden"></div>
    </div>

    <!-- 联系我们 -->
    <div class="card contact-card hidden" id="contactCard">
      <div class="contact-head">
        <div>
          <h2 data-i18n="help.contactTitle"></h2>
          <p class="muted" data-i18n="help.contactSub"></p>
        </div>
      </div>
      <div class="contact-tiles" id="contactBtns"></div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, getDocs, getDoc, doc
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { requireMember, renderNav, esc, t, lang } from "./js/common.js";
    import { clubFaq } from "./js/faq.js";

    const $ = id => document.getElementById(id);
    renderNav("help");

    // 商店帮助的分类（和后台 storehelp.html 的 STORE_CATS 一致）
    const STORE_CATS = ["order", "shipping", "payment", "return", "product", "live", "contact"];

    let tab = "club", cat = "all", page = 0;
    const PER = 8;   // 超过 8 题就分页
    let club = [], store = [], contacts = {};

    // 网址带 #club-redeem、#store 之类，直接打开对应分类
    const hash = location.hash.slice(1);
    if (hash.startsWith("store")) tab = "store";
    if (hash.startsWith("club-")) cat = hash.slice(5);
    else if (hash && !hash.startsWith("store")) cat = hash;   // help.html#points 也可以

    const norm = x => String(x || "").toLowerCase();
    const strip = html => String(html || "").replace(/<[^>]+>/g, " ");

    function items() {
      if (tab === "club") return club.flatMap(g => g.items.map(i => ({ ...i, cat: g.sec, html: true })));
      return store.map(x => ({ q: x.q, a: x.a, cat: x.cat, html: false }));
    }

    const tile = (cls, href, icon, title, sub) => `
      <a class="contact-tile ${cls}" href="${esc(href)}" target="_blank" rel="noopener">
        <span class="ci">${icon}</span>
        <span class="ct"><b>${esc(title)}</b><small>${esc(sub)}</small></span>
        <span class="go" aria-hidden="true">➔</span>
      </a>`;

    // 💬 联系按钮：俱乐部分页显示「俱乐部技术支援」，商店分页显示「客服 + Shopee + TikTok」
    function renderContacts(both) {
      const c = contacts;
      const safe = u => /^https:\/\//i.test(u || "") ? u : "";
      const label = (obj, key) => (obj && (obj[lang] || obj.zh)) || t(key);
      const wa = (num, obj, key) => {
        num = String(num || "").replace(/\D/g, "");
        return num ? tile("wa", `https://wa.me/${num}`, "💬", label(obj, key), "WhatsApp") : "";
      };
      const clubBtns = [wa(c.waClub, c.waClubLabel, "help.waClub")];
      const storeBtns = [
        wa(c.waStore ?? c.whatsapp, c.waStoreLabel, "help.waStore"),
        safe(c.shopee) ? tile("shopee", c.shopee, "🛍️", "Shopee", t("help.chatShop")) : "",
        safe(c.tiktok) ? tile("tiktok", c.tiktok, "🎵", "TikTok Shop", t("help.chatShop")) : "",
      ];
      const btns = (both ? [...clubBtns, ...storeBtns] : tab === "club" ? clubBtns : storeBtns).filter(Boolean);
      $("contactBtns").innerHTML = btns.join("");
      $("contactCard").classList.toggle("hidden", !btns.length);
    }

    function render() {
      document.querySelectorAll("#helpTabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const q = norm($("helpSearch").value.trim());
      renderContacts(!!q);

      // 搜索：两边一起找
      if (q) {
        $("helpCats").innerHTML = "";
        const all = [
          ...club.flatMap(g => g.items.map(i => ({ ...i, html: true, where: t("help.tabClub") }))),
          ...store.map(x => ({ q: x.q, a: x.a, html: false, where: t("help.tabStore") })),
        ].filter(i => norm(i.q).includes(q) || norm(i.html ? strip(i.a) : i.a).includes(q));
        showPage(all, true, t("help.noResult"));
        return;
      }

      const cats = tab === "club" ? club.map(g => g.sec) : STORE_CATS.filter(c => store.some(x => x.cat === c));
      if (cat !== "all" && !cats.includes(cat)) cat = "all";
      $("helpCats").innerHTML = cats.length > 1
        ? [`<button type="button" data-k="all" class="${cat === "all" ? "active" : ""}">${t("pts.kind.all")}</button>`,
           ...cats.map(c => `<button type="button" data-k="${esc(c)}" class="${c === cat ? "active" : ""}">${t((tab === "club" ? "help.club." : "help.store.") + c)}</button>`)].join("")
        : "";
      const list = items().filter(i => cat === "all" || i.cat === cat);
      showPage(list, false, t(tab === "store" ? "help.storeEmpty" : "help.noResult"));
    }

    // 📄 每页 10 题
    function showPage(list, showWhere, emptyText) {
      const pages = Math.ceil(list.length / PER);
      if (page >= pages) page = Math.max(0, pages - 1);
      $("helpList").innerHTML = list.length
        ? list.slice(page * PER, page * PER + PER).map(i => itemHTML(i, showWhere)).join("")
        : `<p class="empty">${emptyText}</p>`;
      const pg = $("helpPager");
      pg.classList.toggle("hidden", pages < 2);
      if (pages < 2) { pg.innerHTML = ""; return; }
      const nums = [...Array(pages).keys()].map(i =>
        `<button type="button" data-p="${i}" class="${i === page ? "active" : ""}">${i + 1}</button>`).join("");
      pg.innerHTML = `
        <button type="button" data-p="${page - 1}" ${page === 0 ? "disabled" : ""} aria-label="prev">‹</button>
        ${nums}
        <button type="button" data-p="${page + 1}" ${page === pages - 1 ? "disabled" : ""} aria-label="next">›</button>
        <span class="pager-info">${t("help.pageInfo", { a: page * PER + 1, b: Math.min(list.length, page * PER + PER), n: list.length })}</span>`;
    }

    function itemHTML(i, showWhere) {
      return `
        <details class="faq-item">
          <summary>${showWhere ? `<span class="help-where">${esc(i.where)}</span> ` : ""}${esc(i.q)}</summary>
          <div class="faq-a">${i.html ? i.a : `<div class="pre">${esc(i.a)}</div>`}</div>
        </details>`;
    }

    $("helpTabs").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      tab = b.dataset.tab; cat = "all"; page = 0;
      $("helpSearch").value = "";
      render();
    });
    $("helpCats").addEventListener("click", e => {
      const b = e.target.closest("[data-k]");
      if (!b) return;
      cat = b.dataset.k; page = 0;
      render();
    });
    $("helpSearch").addEventListener("input", () => { page = 0; render(); });
    $("helpPager").addEventListener("click", e => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      page = Number(b.dataset.p);
      render();
      const top = $("helpTabs").getBoundingClientRect().top + window.scrollY - 70;
      if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
    });

    requireMember(async () => {
      club = clubFaq();
      render();
      try {
        const [fs, hs] = await Promise.all([getDocs(collection(db, "storeFaq")), getDoc(doc(db, "settings", "help"))]);
        store = fs.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(x => x.active !== false && !x.draft)
          .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999))
          .map(x => {
            const loc = (x.i18n && x.i18n[lang]) || {};
            return { q: loc.q || x.q || "", a: loc.a || x.a || "", cat: x.cat || "order" };
          });
        contacts = hs.exists() ? hs.data() : {};
        render();
      } catch (e) {
        console.warn("store help", e);
      }
    });
  </script>
</body>
</html>
