<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="bind.pageTitle">Link Accounts · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 data-i18n="bind.title"></h1>
    <p class="muted" data-i18n="bind.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <div class="card">
      <h2 data-i18n="bind.new"></h2>
      <form id="bindForm">
        <label><span data-i18n="bind.orderLabel"></span>
          <input id="orderNo" required autocomplete="off" data-i18n-ph="bind.orderPh">
          <div id="platformHint" class="platform-hint muted"></div>
        </label>
        <label><span data-i18n="bind.userLabel"></span>
          <input id="username" required autocomplete="off" data-i18n-ph="bind.userPh">
          <small class="muted" data-i18n="bind.userHint"></small>
        </label>
        <button type="submit" class="btn btn-primary" id="bindSubmit" data-i18n="bind.submit"></button>
      </form>
      <p id="bindMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2 data-i18n="acc.bound"></h2>
      <p class="muted bind-summary" id="bindSummary"></p>
      <ul id="bindList" class="list acct-list"><li class="empty" data-i18n="common.loading"></li></ul>
      <div id="removedBox" class="hidden">
        <h3 class="removed-title" data-i18n="bind.removedTitle"></h3>
        <ul id="removedList" class="list acct-list removed"></ul>
      </div>
    </div>

    <div class="card faq-card hidden" id="faqBind"></div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, query, where, getDocs, doc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, esc, toDate, fmtDate, platformTag, platformLabel,
      detectPlatform, normalizeOrderNo, normalizeUsername, t, claimBonuses, toastBonuses,
      accountStats, maskOrderNo, fmtMoney
    } from "./js/common.js";
    import { renderFaq } from "./js/faq.js";

    const $ = id => document.getElementById(id);
    renderNav("bind");

    function setMsg(text, type) {
      $("bindMsg").textContent = text;
      $("bindMsg").className = "msg" + (type ? " " + type : "");
    }

    // 输入单号时自动判断平台
    $("orderNo").addEventListener("input", () => {
      const no = normalizeOrderNo($("orderNo").value);
      const p = detectPlatform(no);
      $("platformHint").innerHTML = !no ? "" :
        p ? t("bind.detected", { tag: platformTag(p) }) : esc(t("bind.badFormat"));
    });

    requireMember(async user => {
      renderFaq($("faqBind"), "bind");
      async function loadBindings() {
        const mine = c => getDocs(query(collection(db, c), where("uid", "==", user.uid)));
        const [bSnap, oSnap, logs] = await Promise.all([
          mine("bindings"), mine("orders"),
          mine("bindingLogs").then(s => s.docs.map(d => d.data())).catch(() => [])
        ]);
        const rows = bSnap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (toDate(a.createdAt) || 0) - (toDate(b.createdAt) || 0));
        const stats = accountStats(oSnap.docs.map(d => d.data()));
        const empty = { orders: 0, spend: 0, points: 0, last: null };

        const tot = rows.reduce((s, b) => {
          const st = stats[b.id] || empty;
          return { o: s.o + st.orders, p: s.p + st.points };
        }, { o: 0, p: 0 });
        $("bindSummary").textContent = rows.length
          ? t("bind.summary", { n: rows.length, o: tot.o, p: tot.p.toLocaleString() }) : "";

        $("bindList").innerHTML = rows.length ? rows.map(b => {
          const st = stats[b.id] || empty;
          const how = b.verifyOrder === "admin" ? t("bind.viaAdmin") : t("bind.viaOrder", { no: maskOrderNo(b.verifyOrder) });
          return `
          <li>
            <div class="main">
              <div class="title">${platformTag(b.platform)} ${esc(b.username)}</div>
              <div class="meta">${t("bind.linkedOn", { d: fmtDate(toDate(b.createdAt), true) })} · ${esc(how)}</div>
              <div class="acct-stats">${st.orders
                ? esc(t("bind.stats", { o: st.orders, s: fmtMoney(st.spend), p: st.points.toLocaleString() }))
                  + (st.last ? " · " + esc(t("bind.lastOrder", { d: fmtDate(st.last) })) : "")
                : esc(t("bind.noOrders"))}</div>
            </div>
            <div class="right"><span class="tag tag-ok">${t("bind.verified")}</span></div>
          </li>`;
        }).join("") : `<li class="empty">${t("bind.none")}</li>`;

        // 已解除的账号（客服解除时留下的记录）
        const active = new Set(rows.map(b => b.id));
        const removed = logs.filter(l => l.action === "unbind" && !active.has(l.bindingId))
          .sort((a, b) => (toDate(b.at) || 0) - (toDate(a.at) || 0));
        $("removedBox").classList.toggle("hidden", !removed.length);
        $("removedList").innerHTML = removed.map(l => `
          <li>
            <div class="main">
              <div class="title">${platformTag(l.platform)} ${esc(l.username)}</div>
              <div class="meta">${t("bind.linkedOn", { d: fmtDate(toDate(l.boundAt)) })} · ${t("bind.removedOn", { d: fmtDate(toDate(l.at)) })}</div>
            </div>
            <div class="right"><span class="tag tag-bad">${t("bind.removed")}</span></div>
          </li>`).join("");
      }

      try { await loadBindings(); }
      catch (e) { $("bindList").innerHTML = `<li class="empty">${esc(t("common.loadFail") + e.message)}</li>`; }

      $("bindForm").addEventListener("submit", async e => {
        e.preventDefault();
        const orderNo = normalizeOrderNo($("orderNo").value);
        const username = normalizeUsername($("username").value);
        const platform = detectPlatform(orderNo);

        if (!platform) { setMsg(t("bind.badFormat"), "err"); return; }
        if (!username) { setMsg(t("bind.needUser"), "err"); return; }
        if (username.includes("/")) { setMsg(t("bind.badUser"), "err"); return; }

        $("bindSubmit").disabled = true;
        setMsg(t("bind.verifying"));
        try {
          await setDoc(doc(db, "bindings", platform + "_" + username), {
            uid: user.uid,
            platform,
            username,
            verifyOrder: orderNo,
            createdAt: serverTimestamp()
          });
          setMsg(t("bind.success", { platform: platformLabel(platform), user: username }), "ok");
          $("bindForm").reset();
          $("platformHint").textContent = "";
          await loadBindings();
          // 绑定后马上领欢迎礼 / 第二平台奖励
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
        } catch (err) {
          if (err.code === "permission-denied") setMsg(t("bind.denied"), "err");
          else setMsg(t("bind.fail") + err.message, "err");
        } finally {
          $("bindSubmit").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
