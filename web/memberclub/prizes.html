<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="pzp.pageTitle">My Prizes · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 data-i18n="pzp.title"></h1>
    <p class="muted" data-i18n="pzp.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <!-- 🎉 已在得奖名单、绑定了中奖订单，但奖品还没放进来 -->
    <div class="card pz-pending hidden" id="pzPending">
      <h2 data-i18n="pzp.pendingTitle"></h2>
      <ul id="pzPendingList" class="pz-pending-list"></ul>
      <p class="muted small" data-i18n="pzp.pendingNote"></p>
    </div>

    <!-- 🏆 中奖领取（后台「中奖奖品」添加后才出现） -->
    <div class="card prize-card hidden" id="prizes">
      <h2 class="dash-head" data-i18n="pz.title"></h2>
      <p class="muted pz-sub" data-i18n="pz.sub"></p>
      <ul id="prizeList" class="list"></ul>
      <details id="prizePast" class="pz-past hidden"><summary></summary><ul class="list"></ul></details>
    </div>

    <!-- 🍀 没有待领取的奖品 -->
    <div class="card pz-empty hidden" id="pzEmpty">
      <div class="pz-empty-ico" aria-hidden="true">🍀</div>
      <h2 id="pzEmptyTitle"></h2>
      <p class="muted" data-i18n="pzp.emptySub"></p>
      <p class="muted small" data-i18n="pzp.howTo"></p>
      <div class="pz-empty-btns">
        <a class="btn btn-primary btn-inline" href="/monthly-draw/" target="_blank" rel="noopener" data-i18n="pzp.seePrizes"></a>
        <a class="btn btn-ghost btn-inline" href="/live-stream/" target="_blank" rel="noopener" data-i18n="pzp.watchLive"></a>
      </div>
    </div>

    <!-- 🎁 本月抽奖的奖品（读取网站 Monthly Draw 页面的资料） -->
    <div class="card hidden" id="drawCard">
      <div class="card-head"><h2 id="drawTitle"></h2><a class="head-go" id="drawGo" href="/monthly-draw/" target="_blank" rel="noopener" aria-label="Monthly Draw">➔</a></div>
      <p class="muted small" id="drawState"></p>
      <div class="shop-grid" id="drawPrizes"></div>
      <a class="btn btn-ghost pz-draw-btn" id="drawBtn" href="/monthly-draw/" target="_blank" rel="noopener"></a>
    </div>

    <!-- ❓ 中奖领奖常见问题 -->
    <div class="card faq-card hidden" id="faqBox"></div>

    <!-- 💬 还有关于中奖的问题？（和帮助中心的俱乐部联系按钮同一份设定） -->
    <div class="card contact-card hidden" id="pzContact">
      <div class="contact-head">
        <div>
          <h2 data-i18n="pzp.askTitle"></h2>
          <p class="muted" data-i18n="pzp.askSub"></p>
        </div>
      </div>
      <div class="contact-tiles" id="pzContactBtns"></div>
      <a class="pz-more-help" href="help.html#club-prize" data-i18n="pzp.moreHelp"></a>
    </div>
  </main>

  <!-- 🎁 领取中奖奖品 / 修改地址 -->
  <div id="pzModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 data-i18n="pz.claimTitle"></h2>
      <div id="pzInfo"></div>
      <div id="pzAddr" class="hidden">
        <p class="muted" style="font-size:.85rem;margin:10px 0" data-i18n="pz.claimSeparate"></p>
        <ul id="pzBook" class="addr-list"></ul>
        <div id="pzFields"></div>
      </div>
      <p id="pzWithOrder" class="muted hidden" style="font-size:.85rem;margin:10px 0 14px" data-i18n="pz.claimWithOrder"></p>
      <p id="pzMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="pzSubmit" data-i18n="pz.claimBtn"></button>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      doc, getDoc, updateDoc, collection, serverTimestamp, query, where, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
    import {
      requireMember, renderNav, esc, fmtDate, t, toDate, prizeDeadline, PRIZE_AUTO_COMPLETE_DAYS,
      addressHTML, redeemCode, toast, lang, SOCIAL_ICONS
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, addressCardHTML } from "./js/address.js";
    import { renderFaq } from "./js/faq.js";

    const $ = id => document.getElementById(id);
    renderNav("prizes");

    document.querySelectorAll(".modal").forEach(m => {
      m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.classList.add("hidden"); });
    });

    // ---------- 🎁 本月抽奖的奖品：和网站 Monthly Draw 页面同一份资料（公开，只读） ----------
    const drawDb = getDatabase(initializeApp({
      apiKey: "AIzaSyDJrsKAjWqz0AmjEtBzz4CeswiskdQqASw",
      authDomain: "admin-status-c3bdb.firebaseapp.com",
      databaseURL: "https://admin-status-c3bdb-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "admin-status-c3bdb",
    }, "draw"));
    const isImg = s => typeof s === "string" && /^(data:image\/|https:\/\/)/.test(s);
    let drawPeriods = null;   // Monthly Draw 的期数（新的在前）
    async function loadDraw() {
      try {
        const idx = (await get(ref(drawDb, "homepage/drawIndex"))).val();
        const periods = (Array.isArray(idx) ? idx : Object.values(idx || {})).filter(x => x && x.id && typeof x.month === "string" && x.month.trim());
        if (!periods.length) return;
        drawPeriods = periods;
        const p = periods[0];
        const d = (await get(ref(drawDb, "homepage/drawData/" + p.id))).val() || {};
        let items = Array.isArray(d.prizeItems) ? d.prizeItems : Object.values(d.prizeItems || {});
        items = items.filter(x => x && typeof x.n === "string" && x.n.trim()).map(x => {
          let name = x.n.trim(), q = Number(x.q) || 0;
          if (!q) { const m = name.match(/^(.*?)\s*[x×]\s*(\d+)\s*$/i); if (m && m[1]) { name = m[1]; q = Number(m[2]); } }
          return { name, q, img: isImg(x.i) ? x.i : "", big: isImg(x.b) ? x.b : "" };
        });
        const announced = [d.w1, d.w2, d.w3, d.winners].some(w => String(w || "").trim());
        const url = "/monthly-draw/#" + encodeURIComponent(p.month.trim());
        $("drawTitle").textContent = t("pzp.drawTitle", { m: p.month.trim() });
        $("drawState").textContent = announced ? "🎉 " + t("pzp.winnersOut") : t("pzp.drawSoon");
        $("drawPrizes").innerHTML = items.map(x => `
          <div class="shop-item">
            <div class="ph">${x.img ? `<img src="${esc(x.img)}" data-full="${esc(x.big || x.img)}" alt="" loading="lazy" data-zoom>` : "🎁"}</div>
            <div class="info"><div class="name">${esc(x.name)}</div>${x.q > 1 ? `<div class="cost">×${x.q}</div>` : ""}</div>
          </div>`).join("");
        $("drawPrizes").classList.toggle("hidden", !items.length);
        $("drawBtn").textContent = t(announced ? "pzp.seeWinners" : "pzp.seePrizes");
        $("drawBtn").href = url; $("drawGo").href = url;
        $("drawCard").classList.remove("hidden");
      } catch (e) { console.warn("draw", e); }
    }
    const drawReady = loadDraw();

    requireMember((user, member) => {
      const book = Array.isArray(member.addresses) ? member.addresses : [];
      renderFaq($("faqBox"), "prize");

      // 「负责处理」：按逗号 / 顿号拆成小标签，每一项完整换行
      const noteHTML = txt => {
        const items = String(txt || "").split(/[,，、;；]+/).map(x => x.trim()).filter(Boolean);
        if (!items.length) return "";
        return `<span class="cn">${items.map(x => `<span class="cn-tag">${esc(x)}</span>`).join("")}</span>`;
      };
      // 💬 俱乐部 WhatsApp（后台「商店帮助 › 联系我们按钮」设定）
      getDoc(doc(db, "settings", "help")).then(hs => {
        const c = hs.exists() ? hs.data() : {};
        const num = String(c.waClub || "").replace(/\D/g, "");
        if (!num) return;
        const pick = o => (o && (o[lang] || o.zh)) || "";
        const note = pick(c.waClubNote);
        $("pzContactBtns").innerHTML = `
          <a class="contact-tile wa" href="https://wa.me/${esc(num)}" target="_blank" rel="noopener">
            <span class="ci">${SOCIAL_ICONS.whatsapp}</span>
            <span class="ct"><b>${esc(pick(c.waClubLabel) || t("help.waClub"))}</b><small>WhatsApp</small>${noteHTML(note)}</span>
            <span class="go" aria-hidden="true">➔</span>
          </a>`;
        $("pzContact").classList.remove("hidden");
      }).catch(e => console.warn("help contacts", e));

      // ---------- 🎉 得奖名单上有我的订单，但奖品还没放进俱乐部 ----------
      const PENDING_PERIODS = 3;   // 只看最近几期（和后台 admin-common.js 的 READY_PERIODS 一致）
      const normNo = x => String(x || "").replace(/\s/g, "").toUpperCase();
      let pendingWins = [];
      async function loadPending() {
        try {
          await drawReady;
          if (!drawPeriods) return;
          const oSnap = await getDocs(query(collection(db, "orders"), where("uid", "==", user.uid)));
          const mine = new Set(oSnap.docs.map(d => normNo(d.id)));
          if (!mine.size) return;
          const rowsOf = text => String(text || "").split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
            const c = l.split(/\s*\|\s*|\t+/).map(x => x.trim());
            return c.length > 1 ? { prize: c[0], order: normNo(c[2]) } : null;
          }).filter(Boolean);
          for (const per of drawPeriods.slice(0, PENDING_PERIODS)) {
            const d = (await get(ref(drawDb, "homepage/drawData/" + per.id))).val() || {};
            [d.w1, d.w2, d.w3, d.winners].flatMap(rowsOf)
              .filter(r => r.order && mine.has(r.order))
              .forEach(r => pendingWins.push({ prize: r.prize.replace(/\s*[x×]\s*\d+\s*$/i, ""), month: per.month.trim(), order: r.order }));
          }
        } catch (e) { console.warn("pending wins", e); }
        renderPending();
      }
      function renderPending() {
        const added = new Set(prizes.map(p => normNo(p.orderNo)).filter(Boolean));
        const list = pendingWins.filter(w => !added.has(w.order));
        $("pzPendingList").innerHTML = list.map(w => `
          <li><span class="pz-pending-ico">🏆</span><div><b>${esc(w.prize || t("pzp.pendingPrize"))}</b>
            <div class="muted small">${esc(t("pz.from", { m: w.month }))} · ${esc("••••" + w.order.slice(-4))}</div></div></li>`).join("");
        $("pzPending").classList.toggle("hidden", !list.length);
        if (list.length) $("pzEmpty").classList.add("hidden");
      }

      // ---------- 🏆 中奖领取 ----------
      const PZ_STEPS = ["won", "claimed", "approved", "shipped", "received"];
      const PZ_STEP = { unclaimed: 0, claimed: 1, approved: 2, shipped: 3, completed: 4 };
      const PZ_TAG = { unclaimed: "tag-pending", claimed: "tag-pending", approved: "tag-ship", shipped: "tag-ship", completed: "tag-ok", cancelled: "" };
      let prizes = [];

      // 即时更新：后台审核、发货后，这一页不用重新整理就会变
      let prizeSub = null;
      function loadPrizes() {
        if (prizeSub) return;
        prizeSub = onSnapshot(query(collection(db, "prizeWins"), where("uid", "==", user.uid)), s => {
          prizes = s.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
          renderPrizes();
        }, e => { console.warn("prizeWins", e); prizes = []; renderPrizes(); });
      }
      // 已经在这一页时点铃铛通知（只改了 #prizes）：捲到中奖框
      window.addEventListener("hashchange", () => {
        if (location.hash !== "#prizes") return;
        if (prizes.length) $("prizes").scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", location.pathname);
      });

      function prizeLi(p) {
        const step = PZ_STEP[p.status] ?? 0;
        const sh = p.shipping || {};
        const url = /^https:\/\//i.test(sh.trackingUrl || "") ? sh.trackingUrl : "";
        const dates = [p.createdAt, p.claimedAt, p.approvedAt, p.shippedAt, p.completedAt].map(toDate);
        const bar = p.status !== "unclaimed" && p.status !== "cancelled" ? `
          <div class="gift-steps">
            ${PZ_STEPS.map((k, i) => `
              <div class="gstep${i <= step ? " done" : ""}${i === step ? " now" : ""}">
                <span class="dot"></span>
                <span class="lbl">${t("pz.step." + k)}</span>
                <span class="dt">${i <= step && dates[i] ? fmtDate(dates[i]).slice(0, 5) : ""}</span>
              </div>`).join("")}
          </div>` : "";
        const dlv = p.delivery === "separate" ? "separate" : "withOrder";
        const deadline = prizeDeadline(p);
        const left = deadline ? (deadline - Date.now()) / 86400000 : 99;
        return `
          <li id="p-${esc(p.id)}" class="redeem-li gift-item pz-item pz-${esc(p.status)}">
            <div class="redeem-row">
              ${p.prizeImage ? `<img class="redeem-thumb" src="${esc(p.prizeImage)}" alt="" loading="lazy" data-zoom>` : `<span class="redeem-thumb">🏆</span>`}
              <div class="redeem-body">
                <div class="redeem-top">
                  <div class="title">${esc(p.prizeName)} <span class="tag ${PZ_TAG[p.status] || ""}">${t("pz.st." + p.status)}</span></div>
                  <span class="redeem-no">${redeemCode(p.id)}</span>
                </div>
                <div class="meta">${p.drawMonth ? esc(t("pz.from", { m: p.drawMonth })) + " · " : ""}${fmtDate(toDate(p.createdAt))}</div>
                ${p.note ? `<div class="meta">💬 ${esc(p.note)}</div>` : ""}
              </div>
            </div>
            ${bar}
            <div class="pz-dlv">
              <span class="pz-dlv-ico">${dlv === "separate" ? "🚚" : "📦"}</span>
              <div><b>${t("pz.dlv." + dlv)}</b><div class="muted">${t("pz.dlv." + dlv + "Sub")}</div></div>
            </div>
            ${(sh.trackingNo || (sh.photos || []).length) && p.status !== "cancelled" ? `
              <div class="gift-ship">
                ${sh.trackingNo ? `<div class="ship-line">🚚 <b>${esc(sh.carrierName || t("pz.tracking"))}</b>
                  <span class="mono small-break">${esc(sh.trackingNo)}</span>
                  <button class="btn btn-ghost btn-inline btn-xs" data-copy="${esc(sh.trackingNo)}">${t("rw.copy")}</button></div>` : ""}
                ${url && p.status !== "completed" ? `<a class="track-link" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${t("gift.track")}</a>` : ""}
                ${(sh.photos || []).length ? `<div class="gift-photos">${sh.photos.map(x => `<img src="${esc(x)}" alt="" loading="lazy" data-zoom>`).join("")}</div>` : ""}
              </div>` : ""}
            ${p.address && p.status !== "cancelled" ? `<div class="gift-addr">📍 ${addressHTML(p.address)}
              ${dlv === "separate" && (p.status === "claimed" || p.status === "approved") ? `<div><button class="btn btn-ghost btn-inline btn-xs" data-pzaddr="${esc(p.id)}">${t("addr.edit")}</button></div>` : ""}</div>` : ""}
            ${p.status === "unclaimed" && deadline ? `<div class="pz-deadline${left <= 7 ? " soon" : ""}">⏰ ${esc(t("pz.deadline", { d: fmtDate(deadline) }))}</div>` : ""}
            ${p.status === "shipped" && toDate(p.shippedAt) ? `<div class="muted gift-auto">${esc(t("pz.autoNote", { d: fmtDate(new Date(toDate(p.shippedAt).getTime() + PRIZE_AUTO_COMPLETE_DAYS * 86400000)) }))}</div>` : ""}
            ${p.status === "completed" && p.autoCompleted ? `<div class="muted gift-auto">✅ ${esc(t("gift.autoDone"))}</div>` : ""}
            ${p.status === "cancelled" ? (p.autoExpired ? `<div class="meta">⏰ ${esc(t("pz.expiredNote"))}</div>` : p.cancelNote ? `<div class="meta">${esc(p.cancelNote)}</div>` : "") : ""}
            ${p.status === "unclaimed" ? `<button class="btn btn-primary gift-confirm pz-claim" data-claim="${esc(p.id)}">${t("pz.claim")}</button>` : ""}
            ${p.status === "shipped" ? `<button class="btn btn-primary gift-confirm" data-got="${esc(p.id)}">${t("pz.receivedBtn")}</button>` : ""}
          </li>`;
      }

      function renderPrizes() {
        const active = prizes.filter(p => ["unclaimed", "claimed", "approved", "shipped"].includes(p.status));
        const past = prizes.filter(p => p.status === "completed" || p.status === "cancelled");
        $("prizes").classList.toggle("hidden", !prizes.length);
        $("prizes").classList.toggle("has-todo", active.some(p => p.status === "unclaimed"));
        // 没有进行中的奖品：中奖框只留「以往的奖品」，上面显示鼓励 + 去看抽奖
        $("prizes").querySelector("h2").textContent = t(active.length ? "pz.title" : "pzp.history");
        $("prizes").querySelector(".pz-sub").classList.toggle("hidden", !active.length);
        $("prizePast").open = !active.length;
        $("pzEmpty").classList.toggle("hidden", active.length > 0);
        $("pzEmptyTitle").textContent = t(prizes.length ? "pzp.emptyTitleNone" : "pzp.emptyTitle");
        renderPending();
        $("prizeList").innerHTML = active.map(prizeLi).join("");
        $("prizeList").classList.toggle("hidden", !active.length);
        $("prizePast").classList.toggle("hidden", !past.length);
        $("prizePast").querySelector("summary").textContent = t("pz.past", { n: past.length });
        $("prizePast").querySelector("ul").innerHTML = past.map(prizeLi).join("");
        if (location.hash === "#prizes" && prizes.length) {
          setTimeout(() => $("prizes").scrollIntoView({ behavior: "smooth", block: "start" }), 200);
          history.replaceState(null, "", location.pathname);
        }
      }

      $("prizes").addEventListener("click", async e => {
        const b = e.target.closest("button");
        if (!b) return;
        const { claim, got, copy: code, pzaddr } = b.dataset;
        if (pzaddr) openClaim(pzaddr, true);
        if (code) {
          try { await navigator.clipboard.writeText(code); b.textContent = t("rw.copied"); setTimeout(() => b.textContent = t("rw.copy"), 1500); }
          catch { prompt(t("rw.copyPrompt"), code); }
        }
        if (claim) openClaim(claim);
        if (got) {
          const p = prizes.find(x => x.id === got);
          if (!p || !confirm(t("pz.receivedConfirm", { name: p.prizeName }))) return;
          b.disabled = true;
          try {
            await updateDoc(doc(db, "prizeWins", got), { status: "completed", completedAt: serverTimestamp() });
          } catch (err) { alert(t("pz.fail") + err.message); b.disabled = false; }
        }
      });

      // 领取：随单发送直接确认；单独包裹要选收货地址
      let pzId = null, pzEdit = false;
      $("pzFields").innerHTML = addressFormHTML();
      bindAddressForm($("pzFields"));
      const pzMsg = (x, ty) => { $("pzMsg").textContent = x; $("pzMsg").className = "msg" + (ty ? " " + ty : ""); };
      function openClaim(id, edit = false) {
        const p = prizes.find(x => x.id === id);
        if (!p) return;
        pzId = id; pzEdit = edit;
        // 修改地址也用同一个视窗（标题、按钮换字）
        $("pzModal").querySelector("h2").textContent = t(edit ? "gift.editAddr" : "pz.claimTitle");
        $("pzSubmit").textContent = t(edit ? "prof.save" : "pz.claimBtn");
        const sep = p.delivery === "separate";
        $("pzInfo").innerHTML = `
          <div class="redeem-row" style="margin-top:6px">
            ${p.prizeImage ? `<img class="redeem-thumb" src="${esc(p.prizeImage)}" alt="">` : `<span class="redeem-thumb">🏆</span>`}
            <div class="redeem-body"><div class="title">${esc(p.prizeName)}</div>
              <div class="meta">${t("pz.dlv." + (sep ? "separate" : "withOrder"))}</div></div>
          </div>`;
        $("pzAddr").classList.toggle("hidden", !sep);
        $("pzWithOrder").classList.toggle("hidden", sep);
        if (sep) {
          fillAddressForm($("pzFields"), (edit && p.address) || book[0] || {});
          $("pzBook").innerHTML = book.map((a, i) => addressCardHTML(a, i, {})).join("");
          $("pzBook").classList.toggle("hidden", !book.length);
        }
        pzMsg("");
        $("pzModal").classList.remove("hidden");
      }
      $("pzBook").addEventListener("click", e => {
        const li = e.target.closest(".addr-item");
        if (li) fillAddressForm($("pzFields"), book[+li.dataset.i]);
      });
      $("pzSubmit").addEventListener("click", async () => {
        const p = prizes.find(x => x.id === pzId);
        if (!p) return;
        const data = pzEdit ? { addressUpdatedAt: serverTimestamp() } : { status: "claimed", claimedAt: serverTimestamp() };
        if (p.delivery === "separate") {
          const v = validateAddressForm($("pzFields"));
          if (v.error) { pzMsg(v.error, "err"); return; }
          data.address = v.address;
        }
        $("pzSubmit").disabled = true;
        try {
          await updateDoc(doc(db, "prizeWins", pzId), data);
          $("pzModal").classList.add("hidden");
          if (!pzEdit) toast(t("pz.claimed"));
        } catch (err) { pzMsg(t("pz.fail") + err.message, "err"); }
        finally { $("pzSubmit").disabled = false; }
      });


      loadPrizes();
      loadPending();
    });
  </script>
  <!-- 🔍 看大图（照片是存在资料库里的 data 网址，不能开新分页，否则手机浏览器会当掉） -->
  <div id="zoomBox" class="zoom-box hidden" role="dialog" aria-modal="true">
    <button type="button" class="zoom-close" aria-label="close">✕</button>
    <img id="zoomImg" alt="">
  </div>
  <script>
    (() => {
      const box = document.getElementById("zoomBox"), img = document.getElementById("zoomImg");
      const close = () => { box.classList.add("hidden"); img.removeAttribute("src"); document.body.style.overflow = ""; };
      document.addEventListener("click", e => {
        const z = e.target.closest("img[data-zoom]");
        if (z) {
          e.preventDefault();
          img.src = z.dataset.full || z.currentSrc || z.src;
          box.classList.remove("hidden");
          document.body.style.overflow = "hidden";
        } else if (!box.classList.contains("hidden") && box.contains(e.target)) close();
      });
      document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.classList.contains("hidden")) close(); });
    })();
  </script>
</body>
</html>
