<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="shop.pageTitle">Rewards Mall · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
  <script src="js/theme-init.js"></script>
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <p id="pageError" class="msg err hidden"></p>

    <div class="shop-head">
      <div>
        <h1 data-i18n="shop.title"></h1>
        <p class="muted" data-i18n="rw.sub"></p>
      </div>
      <div class="shop-mypts"><span data-i18n="acc.available"></span><b id="myPts">-</b></div>
    </div>

    <div class="cat-chips" id="cats"></div>
    <div id="rewardGrid" class="shop-grid mall-grid"><p class="empty" data-i18n="common.loading"></p></div>
    <p id="redeemMsg" class="msg"></p>
  </main>

  <!-- 📦 兑换实体奖品：确认收货地址 -->
  <div id="addrModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" id="amClose" aria-label="close">✕</button>
      <h2 data-i18n="addr.pickTitle"></h2>
      <p class="muted" id="amReward" style="font-size:.85rem;margin-bottom:10px"></p>
      <ul id="amList" class="addr-list"></ul>
      <button type="button" class="btn btn-ghost btn-inline" id="amNew" data-i18n="addr.add"></button>
      <div id="amForm" class="hidden" style="margin-top:10px">
        <div id="amFields"></div>
        <label class="check"><input type="checkbox" id="amSave" checked> <span data-i18n="addr.saveToBook"></span></label>
      </div>
      <p class="muted" style="font-size:.78rem;margin-top:8px" data-i18n="addr.freeShip"></p>
      <p id="amMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="amSubmit"></button>
    </div>
  </div>
  <!-- 🛍️ 商品详情 -->
  <div id="dtModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card dt-card">
      <button type="button" class="modal-x" id="dtClose" aria-label="close">✕</button>
      <div id="dtBody"></div>
    </div>
  </div>
  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, query, where, getDocs, addDoc, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, esc, t, loadShopCats, catOf, catName, endState, fmtDate, MAX_ADDRESSES,
      lockState, lockOverlayHTML, startLockTicker, offShelf, showInShop, OFF_SHELF_DAYS, toDate
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, saveAddresses, addressCardHTML } from "./js/address.js";

    const $ = id => document.getElementById(id);
    renderNav("shop");

    // 奖品类型（后台「奖品管理」的类型）
    const TYPE = {
      coupon: { icon: "🎫", key: "rw.coupon" },
      gift: { icon: "🎁", key: "rw.gift" },
    };
    let currentCat = "all";

    function setMsg(text, type) {
      $("redeemMsg").textContent = text;
      $("redeemMsg").className = "msg" + (type ? " " + type : "");
    }

    requireMember((user, member) => {
      let rewards = [];
      let shopCats = [];
      let bal = null;


      async function load() {
        try {
          const cutoff = Timestamp.fromDate(new Date(Date.now() - OFF_SHELF_DAYS * 86400000));
          const [b, rSnap, offSnap, cs] = await Promise.all([
            loadBalance(user.uid),
            getDocs(query(collection(db, "rewards"), where("active", "==", true))),
            // ⛔ 最近 30 天内下架的：显示灰色「已下架」
            getDocs(query(collection(db, "rewards"), where("delistedAt", ">=", cutoff))).catch(() => ({ docs: [] })),
            loadShopCats()
          ]);
          bal = b;
          shopCats = cs;
          const seen = new Map();
          [...rSnap.docs, ...offSnap.docs].forEach(d => seen.set(d.id, { id: d.id, ...d.data() }));
          rewards = [...seen.values()]
            .filter(r => showInShop(r))
            .sort((a, b) => (offShelf(a) ? 1 : 0) - (offShelf(b) ? 1 : 0)   // 已下架排最后
              || (a.sortOrder ?? 999) - (b.sortOrder ?? 999) || a.cost - b.cost);
          render();
          openFromHash();
        } catch (e) {
          $("pageError").textContent = t("common.loadFail") + e.message;
          $("pageError").classList.remove("hidden");
        }
      }

      // 🎨 款式（后台「商城奖品」设定）：照顺序排好
      const varsOf = r => r.type === "coupon" ? [] : Object.entries(r.variants || {}).map(([id, v]) => ({ id, ...v }))
        .filter(v => v.name).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      // 滑动时更新 1/5；左右箭头（电脑用）
      document.addEventListener("scroll", e => {
        const tr = e.target.closest && e.target.closest(".vtrack");
        if (!tr) return;
        const sl = tr.parentElement, n = tr.children.length;
        const i = Math.max(0, Math.min(n - 1, Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth))));
        sl.dataset.idx = i;
        sl.querySelector(".vcount").textContent = `${i + 1}/${n}`;
      }, true);
      function slideTo(sl, dir) {
        const tr = sl.querySelector(".vtrack");
        tr.scrollBy({ left: dir * tr.clientWidth, behavior: "smooth" });
      }

      // 🔁 每位会员限兑次数：这一期（换新码之后）已经兑换几次，拒绝和取消的不算
      function usedOf(r) {
        const since = toDate(r.roundSince);
        return bal.redemptions.filter(x => x.rewardId === r.id && !["rejected", "cancelled"].includes(x.status)
          && (!since || !x.createdAt || x.createdAt >= since)).length;
      }
      const limitOf = r => typeof r.perMember === "number" && r.perMember > 0 ? r.perMember : null;

            // 一张卡的状态：按钮、剩余份数、即将下架、限兑次数（卡片和详情共用）
      function cardState(r) {
        const ty = TYPE[r.type] || TYPE.gift;
        const off = offShelf(r);
        const es = off ? null : endState(r);
        const soldOut = typeof r.stock === "number" && r.stock <= 0;
        const short = r.cost - bal.spendable;
        const locked = off || !!lockState(r);
        const max = limitOf(r), used = max ? usedOf(r) : 0, full = !!max && used >= max;
        let btn;
        if (locked) btn = `<button class="btn btn-primary" disabled>${t("rw.redeem")}</button>`;   // 未开放 / 已下架：灰色、按不下去
        else if (full) btn = `<button class="btn btn-ghost" disabled>${t("rw.limitDone", { used, max })}</button>`;
        else if (soldOut) btn = `<button class="btn btn-ghost" disabled>${t("rw.soldOut")}</button>`;
        else if (short > 0) btn = `<button class="btn btn-ghost" disabled>${t("rw.short", { n: short })}</button>`;
        else btn = `<button class="btn btn-primary" data-redeem="${esc(r.id)}">${t("rw.redeem")}</button>`;
              const subs = `
          <div class="sub">${t(ty.key)}${typeof r.stock === "number" ? " · " + t("rw.left", { n: Math.max(r.stock, 0) }) : ""}</div>
          ${es ? `<div class="ending-line">${esc(t("shop.endingSoon"))} · ${esc(t("shop.endsOn", { d: fmtDate(es.end, true) }))}</div>` : ""}`;
        // 🔁 限兑次数：只在详情里显示
        const limitLine = max ? `<div class="sub">${esc(full && r.type === "coupon" ? t("rw.limitNext") : t("rw.limitLine", { max, used }))}</div>` : "";
        const vs = varsOf(r);
        // 🎨 有款式：主图 + 每一款图片可以左右滑动，下面显示 1/5、2/5…
        const one = (img, alt) => img ? `<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy">` : ty.icon;
        const pic = `${vs.length ? `<div class="vslider" data-vs="${esc(r.id)}" data-idx="0">
            <div class="vtrack">${[{ image: r.image, name: "" }, ...vs].map((v, i) => `<div class="vslide">${one(v.image || (i ? "" : r.image), v.name || r.name)}${i ? `<span class="vname">${esc(v.name)}${typeof v.stock === "number" && v.stock <= 0 ? " · " + esc(t("rw.soldOut")) : ""}</span>` : ""}</div>`).join("")}</div>
            <button type="button" class="vnav prev" data-vnav="-1" aria-label="prev">‹</button><button type="button" class="vnav next" data-vnav="1" aria-label="next">›</button>
            <span class="vcount">1/${vs.length + 1}</span></div>` : one(r.image, r.name)}
          ${lockOverlayHTML(r)}
          ${es ? `<span class="ending-badge">⏰ ${esc(es.label)}</span>` : ""}`;
        return { kind: r.type === "coupon" ? "coupon" : "gift", soldOut, locked, btn, subs, limitLine, pic };
      }

      function render() {
        $("myPts").textContent = bal.spendable.toLocaleString();

        // 分类：只显示有奖品的分类
        const used = new Set(rewards.map(r => catOf(r, shopCats)));
        const cats = shopCats.filter(c => used.has(c.id));
        if (currentCat !== "all" && !cats.some(c => c.id === currentCat)) currentCat = "all";
        $("cats").classList.toggle("hidden", cats.length < 2);
        $("cats").innerHTML =
          `<button type="button" data-cat="all" class="${currentCat === "all" ? "active" : ""}">${t("shop.cat.all")}</button>` +
          cats.map(c => `<button type="button" data-cat="${esc(c.id)}" class="${c.id === currentCat ? "active" : ""}">${esc((c.icon ? c.icon + " " : "") + catName(c))}</button>`).join("");

        const list = rewards.filter(r => currentCat === "all" || catOf(r, shopCats) === currentCat);
        $("rewardGrid").innerHTML = list.length ? list.map(r => {
          const s = cardState(r), id = esc(r.id);
          return `
            <div class="shop-item mall-item type-${s.kind}${s.soldOut ? " sold-out" : ""}${s.locked ? " locked" : ""}">
              <div class="ph" data-detail="${id}">${s.pic}</div>
              <div class="info">
                <div class="name" data-detail="${id}">${esc(r.name)}</div>
                ${r.shortDesc ? `<div class="desc" data-detail="${id}">${esc(r.shortDesc)}</div>` : ""}
                ${s.subs}
                <div class="cost">${t("unit.pts", { n: Number(r.cost).toLocaleString() })}</div>
                ${s.btn}
              </div>
            </div>`;
        }).join("") : `<p class="empty">${t("rw.none")}</p>`;
        if (dtId) openDetail(dtId);   // 详情开着的话也一起更新
        startLockTicker(id => rewards.find(x => x.id === id), render);   // 倒数，时间到自动开放
      }

           // ---------- 🛍️ 商品详情：图片、短说明、详细说明、兑换按钮 ----------
      // 点哪里都能关闭（「兑换」按钮除外）；手机按「返回」只会关掉详情，不会离开商城
      let dtId = null;
      function openDetail(id) {
        const r = rewards.find(x => x.id === id);
        if (!r) { closeDetail(); return; }
        if (!dtId) history.pushState({ dt: 1 }, "");   // 多记一步，让「返回」先关详情
        dtId = id;
        const s = cardState(r);
        $("dtBody").innerHTML = `
          <div class="dt-ph type-${s.kind}${s.locked ? " locked" : ""}">${s.pic}</div>
          <div class="dt-info">
            <h2>${esc(r.name)}</h2>
            ${r.shortDesc ? `<div class="dt-short">${esc(r.shortDesc)}</div>` : ""}
            ${r.description ? `<div class="dt-long">${esc(r.description)}</div>` : ""}
            ${s.subs}${s.limitLine}
            <div class="cost">${t("unit.pts", { n: Number(r.cost).toLocaleString() })}</div>
            ${s.btn}
          </div>`;
        $("dtModal").classList.remove("hidden");
        document.body.classList.add("modal-open");
      }
      function closeDetail(fromBack = false) {
        if (!dtId) return;
        dtId = null;
        $("dtModal").classList.add("hidden");
        document.body.classList.remove("modal-open");
        if (!fromBack && history.state && history.state.dt) history.back();   // 把多记的那一步拿掉
      }
      window.addEventListener("popstate", () => closeDetail(true));
      $("dtModal").addEventListener("click", e => {
        if (!e.target.closest("[data-redeem]")) closeDetail();
      });
      // 🏠 从首页点商品进来（shop.html#i-奖品ID）：切到「全部」、捲到那个商品、打开详情
      function openFromHash() {
        const m = location.hash.match(/^#i-([\w-]+)$/);
        if (!m) return;
        history.replaceState(null, "", location.pathname + location.search);   // 拿掉 #i-，按「返回」才不会又打开
        const r = rewards.find(x => x.id === m[1]);
        if (!r || offShelf(r)) return;   // 已下架或找不到：只打开商城
        if (currentCat !== "all") { currentCat = "all"; render(); }
        const card = $("rewardGrid").querySelector(`[data-detail="${CSS.escape(r.id)}"]`);
        if (card) card.closest(".shop-item").scrollIntoView({ block: "center" });
        openDetail(r.id);
      }

      // 分类按钮：切换分类
      $("cats").addEventListener("click", e => {
        const b = e.target.closest("[data-cat]");
        if (!b) return;
        currentCat = b.dataset.cat;
        render();
      });
      // 兑换
      async function submitRedeem(r, address, variant) {
        const data = {
          uid: user.uid,
          rewardId: r.id,
          rewardName: r.name,
          cost: r.cost,
          status: "pending",
          kind: r.type === "coupon" ? "coupon" : "gift",
          createdAt: serverTimestamp()
        };
        if (data.kind === "gift") data.delivery = "withOrder";   // 预设随单寄送；要单独寄出由管理员在审核时改
        if (address) data.address = address;
        if (variant) { data.variantId = variant.id; data.variantName = variant.name; }
        const ref = await addDoc(collection(db, "redemptions"), data);
        return ref.id;
      }

           async function startRedeem(r, btn, slide = 0) {
        if (!r || lockState(r) || offShelf(r)) return;   // 未开放 / 已下架
        if (limitOf(r) && usedOf(r) >= limitOf(r)) return;   // 本期已换满
        const gift = r.type !== "coupon";   // 实体奖品：随单寄送，不用先填地址
        // 🎨 有款式：一定先选款式（见 pickVariant）
        const vs = varsOf(r);
        let variant = null;
        if (vs.length) {
          // 不管在主图还是某一款的图片上按兑换，都先开「要兑换哪一款？」（正在看的那一款先选好）
          variant = await pickVariant(r, slide - 1);
          if (!variant) return;   // 视窗里按「确认兑换」= 已确认，不再跳确认小视窗
        } else if (!confirm(t(gift ? "rw.confirmGift" : "rw.confirm", { name: r.name, cost: r.cost }))) return;
        btn.disabled = true;
        setMsg(t("rw.submitting"));
        try {
          const newId = await submitRedeem(r, null, variant);
          setMsg(t(gift ? "rw.submittedGift" : "rw.submitted", { name: r.name }), "ok");
          location.href = "rewards.html#r-" + newId;   // 自动跳到兑换记录
        } catch (err) {
          setMsg(err.code === "permission-denied" ? t("rw.denied") : t("rw.fail") + err.message, "err");
          btn.disabled = false;
        }
      }

      // 卡片：按「兑换」直接兑换；点图片 / 名称 / 短说明打开详情
      $("rewardGrid").addEventListener("click", e => {
        const nv = e.target.closest("[data-vnav]");
        if (nv) { e.stopPropagation(); slideTo(nv.closest(".vslider"), +nv.dataset.vnav); return; }
        const b = e.target.closest("[data-redeem]");
        if (b) { startRedeem(rewards.find(x => x.id === b.dataset.redeem), b, slideIdx(b.closest(".shop-item"))); return; }
        const d = e.target.closest("[data-detail]");
        if (d) openDetail(d.dataset.detail);
      });
      // 详情里的「兑换」
      $("dtBody").addEventListener("click", e => {
        const nv = e.target.closest("[data-vnav]");
        if (nv) { e.stopPropagation(); slideTo(nv.closest(".vslider"), +nv.dataset.vnav); return; }
        const b = e.target.closest("[data-redeem]");
        if (!b) return;
        const r = rewards.find(x => x.id === b.dataset.redeem);
        const idx = slideIdx($("dtBody"));
        closeDetail();
        startRedeem(r, b, idx);
      });
      const slideIdx = root => { const sl = root && root.querySelector(".vslider"); return sl ? +sl.dataset.idx || 0 : 0; };

      // 🎨 选款式：有款式的商品，按兑换一定先开这个视窗（正在看哪一款就先帮忙选好）
      //    点选一款（粉色框）→ 下面按「确认兑换」，不再另外跳确认小视窗
      function pickVariant(r, pre = -1) {
        return new Promise(resolve => {
          let m = document.getElementById("vpModal");
          if (!m) {
            document.body.insertAdjacentHTML("beforeend", `<div id="vpModal" class="modal hidden" role="dialog" aria-modal="true">
              <div class="modal-card"><button type="button" class="modal-x" data-vp="x" aria-label="close">✕</button>
              <h2>${esc(t("rw.pickVariant"))}</h2><p class="muted" id="vpName" style="font-size:.85rem;margin-bottom:10px"></p>
              <div class="vp-grid" id="vpGrid"></div>
              <div class="vp-foot"><span class="muted" id="vpNote"></span><button type="button" class="btn btn-primary" data-vp="ok" id="vpOk"></button></div>
              </div></div>`);
            m = document.getElementById("vpModal");
          }
          const vs = varsOf(r);
          const out = v => typeof v.stock === "number" && v.stock <= 0;
          let sel = pre >= 0 && vs[pre] && !out(vs[pre]) ? pre : -1;
          $("vpName").textContent = r.name;
          $("vpNote").textContent = t(r.type === "coupon" ? "rw.vpCouponNote" : "rw.vpGiftNote");
          $("vpOk").textContent = t("rw.vpConfirm", { cost: Number(r.cost).toLocaleString() });
          const paint = () => {
            $("vpGrid").innerHTML = vs.map((v, i) => `<button type="button" class="vp-item${i === sel ? " on" : ""}" data-vp="${i}" ${out(v) ? "disabled" : ""}>
              ${v.image || r.image ? `<img src="${esc(v.image || r.image)}" alt="">` : `<span class="vp-ph">🎁</span>`}
              <span>${esc(v.name)}${out(v) ? `<small>${esc(t("rw.soldOut"))}</small>` : ""}</span></button>`).join("");
            $("vpOk").disabled = sel < 0;
          };
          paint();
          const done = v => { m.classList.add("hidden"); m.onclick = null; resolve(v); };
          m.onclick = e => {
            if (e.target === m) return done(null);
            const b = e.target.closest("[data-vp]");
            if (!b || b.disabled) return;
            if (b.dataset.vp === "x") return done(null);
            if (b.dataset.vp === "ok") { if (sel >= 0) done(vs[sel]); return; }
            sel = +b.dataset.vp; paint();
          };
          m.classList.remove("hidden");
        });
      }

      // ---------- 📦 选收货地址 ----------
      let addresses = Array.isArray(member.addresses) ? member.addresses.slice() : [];
      let modalReward = null, pick = 0;
      $("amFields").innerHTML = addressFormHTML();
      bindAddressForm($("amFields"));
      const amMsg = (text, type) => { $("amMsg").textContent = text; $("amMsg").className = "msg" + (type ? " " + type : ""); };
      function renderPick() {
        const usingNew = pick === -1;
        $("amList").innerHTML = addresses.map((a, i) => addressCardHTML(a, i, { radio: true, selected: i === pick })).join("");
        $("amForm").classList.toggle("hidden", !usingNew);
        $("amNew").classList.toggle("hidden", usingNew || addresses.length >= MAX_ADDRESSES);
      }
      function openAddrModal(r) {
        modalReward = r;
        pick = addresses.length ? 0 : -1;
        fillAddressForm($("amFields"), { name: member.name || "", phone: member.phone || "" });
        $("amSave").checked = true;
        $("amReward").textContent = t("addr.pickFor", { name: r.name, cost: r.cost });
        $("amSubmit").textContent = t("addr.confirmRedeem", { cost: r.cost });
        $("amSubmit").disabled = false;
        amMsg("");
        renderPick();
        $("addrModal").classList.remove("hidden");
      }
      const closeModal = () => $("addrModal").classList.add("hidden");
      $("amClose").addEventListener("click", closeModal);
      $("addrModal").addEventListener("click", e => { if (e.target.id === "addrModal") closeModal(); });
      $("amList").addEventListener("change", e => { if (e.target.name === "addrPick") { pick = +e.target.value; renderPick(); } });
      $("amList").addEventListener("click", e => {
        const li = e.target.closest(".addr-item");
        if (li && pick !== +li.dataset.i) { pick = +li.dataset.i; renderPick(); }
      });
      $("amNew").addEventListener("click", () => { pick = -1; renderPick(); });
      $("amSubmit").addEventListener("click", async () => {
        const r = modalReward;
        if (!r) return;
        let address;
        if (pick === -1) {
          const v = validateAddressForm($("amFields"));
          if (v.error) { amMsg(v.error, "err"); return; }
          address = v.address;
        } else address = addresses[pick];
        $("amSubmit").disabled = true;
        amMsg(t("rw.submitting"));
        try {
          if (pick === -1 && $("amSave").checked && addresses.length < MAX_ADDRESSES) {
            const next = [...addresses, address];
            await saveAddresses(user.uid, next);
            addresses = next;
          }
          const newId = await submitRedeem(r, address);
          closeModal();
          setMsg(t("rw.submittedGift", { name: r.name }), "ok");
          location.href = "rewards.html#r-" + newId;   // 自动跳到兑换记录
        } catch (err) {
          amMsg(err.code === "permission-denied" ? t("rw.denied") : t("rw.fail") + err.message, "err");
          $("amSubmit").disabled = false;
        }
      });

      load();
    });
  </script>
</body>
</html>
