<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="shop.pageTitle">Rewards Mall · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <p id="pageError" class="msg err hidden"></p>

    <!-- 会员卡：积分与等级 -->
    <div class="shop-hero">
      <img src="img/member.jpg" alt="">
      <div style="flex:1;min-width:0">
        <div class="sub" id="heroHello"></div>
        <div class="pts-big" id="heroPoints">-</div>
        <div class="sub" id="heroTier">&nbsp;</div>
      </div>
      <a href="account.html" data-i18n="shop.myPoints"></a>
    </div>

    <!-- 兑换商城（框架：商品之后再制定） -->
    <h1 data-i18n="shop.title"></h1>
    <p class="muted" data-i18n="shop.sub"></p>

    <div class="cat-chips" id="cats"></div>
    <div class="shop-grid" id="shopGrid"></div>
    <p class="muted center" style="margin:14px 0 26px;font-size:.85rem" data-i18n="shop.soonNote"></p>

    <!-- 目前可兑换的奖品（来自「积分兑换」） -->
    <div class="card">
      <h2 data-i18n="shop.nowAvailable"></h2>
      <div class="shop-grid" id="rewardPreview"><p class="empty" data-i18n="common.loading"></p></div>
      <a href="rewards.html" class="btn btn-primary" style="margin-top:14px" data-i18n="shop.goRewards"></a>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, tierProgress, tierLabel, esc, t
    } from "./js/common.js";

    const $ = id => document.getElementById(id);
    renderNav("shop");

    // ---------- 商城分类（之后可增减） ----------
    const CATS = [
      ["all", "shop.cat.all"],
      ["coupon", "shop.cat.coupon"],
      ["bracelet", "shop.cat.bracelet"],
      ["blindbox", "shop.cat.blindbox"],
    ];

    // ---------- 商城商品（框架示范，之后改成从后台读取） ----------
    const SHOP_ITEMS = [
      { cat: "coupon",   icon: "🎫" },
      { cat: "bracelet", icon: "📿" },
      { cat: "blindbox", icon: "🎁" },
      { cat: "bracelet", icon: "💎" },
    ];

    let currentCat = "all";

    function renderCats() {
      $("cats").innerHTML = CATS.map(([k, key]) =>
        `<button type="button" data-cat="${k}" class="${k === currentCat ? "active" : ""}">${t(key)}</button>`).join("");
    }

    function renderShop() {
      const items = SHOP_ITEMS.filter(x => currentCat === "all" || x.cat === currentCat);
      $("shopGrid").innerHTML = items.map(x => `
        <div class="shop-item soon">
          <div class="ph">${x.icon}</div>
          <div class="info">
            <div class="name">${t("shop.cat." + x.cat)}</div>
            <div class="cost"><span class="tag tag-pending">${t("shop.soon")}</span></div>
          </div>
        </div>`).join("");
    }

    $("cats").addEventListener("click", e => {
      const c = e.target.dataset.cat;
      if (!c) return;
      currentCat = c;
      renderCats();
      renderShop();
    });

    renderCats();
    renderShop();

    requireMember(async (user, member) => {
      $("heroHello").textContent = t("acc.hello", { name: member.name || t("acc.member") });
      const tp = tierProgress(member);
      $("heroTier").textContent = `${tp.tier.icon ? tp.tier.icon + " " : ""}${tierLabel(tp.tier)}`;

      try {
        const [bal, rSnap] = await Promise.all([
          loadBalance(user.uid),
          getDocs(query(collection(db, "rewards"), where("active", "==", true)))
        ]);
        $("heroPoints").textContent = t("unit.pts", { n: bal.spendable.toLocaleString() });

        const rewards = rSnap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999) || a.cost - b.cost)
          .slice(0, 4);
        $("rewardPreview").innerHTML = rewards.length ? rewards.map(r => `
          <a class="shop-item" href="rewards.html" style="color:inherit;text-decoration:none">
            <div class="ph">${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">` : (r.type === "coupon" ? "🎫" : "🎁")}</div>
            <div class="info">
              <div class="name">${esc(r.name)}</div>
              <div class="cost">${t("unit.pts", { n: Number(r.cost).toLocaleString() })}</div>
            </div>
          </a>`).join("") : `<p class="empty">${t("rw.none")}</p>`;
      } catch (e) {
        $("pageError").textContent = t("common.loadFail") + e.message;
        $("pageError").classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
