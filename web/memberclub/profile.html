<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 📲 Mochii App (PWA) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b1020">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mochii Club">
  <script src="/assets/js/pwa.js?v=__V__" defer></script>
  <title data-i18n-title="prof.pageTitle">Profile · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
  <script src="js/theme-init.js"></script>
  <style>
    /* 📁 文件夹式分页 */
    .folder { margin-bottom: 16px; }
    .folder-tabs { display: flex; gap: 4px; padding: 0 8px; position: relative; z-index: 1; }
    .folder-tab { flex: 1; max-width: 200px; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 12px; font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--muted);
      background: var(--card2); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0;
      transform: translateY(4px); transition: transform .15s, color .15s; }
    .folder-tab:hover { color: var(--text); }
    .folder-tab.active { background: var(--card); color: var(--text); transform: none; box-shadow: inset 0 3px 0 var(--accent); margin-bottom: -1px; padding-bottom: 11px; }
    .folder-body { background: var(--card); border: 1px solid var(--line); border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 20px; }
    .folder-sub { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
    .folder-sub h3 { font-size: .95rem; margin-bottom: 8px; }
    .bday-locked { font-size: 1.05rem; font-weight: 700; }
    /* 🔗 关联平台 */
    .bind-once { background: rgba(255,111,174,.08); border: 1px solid rgba(255,111,174,.3); border-radius: 12px; padding: 10px 14px; font-size: .84rem; line-height: 1.55; margin: 12px 0 14px; }
    .bind-new { margin-top: 16px; border: 1px dashed var(--line); border-radius: 12px; padding: 0 14px; }
    .bind-new[open] { border-style: solid; padding-bottom: 14px; }
    .bind-new summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 0; font-weight: 800; font-size: .92rem; }
    .bind-new summary::-webkit-details-marker { display: none; }
    .bind-new .plus { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: .9rem; }
    .bind-new .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
    .bind-new[open] .chev { transform: rotate(180deg); }
    .bind-once b { color: var(--accent); }
    .acct-sum { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: center; }
    .acct-sum div { padding: 10px 4px; }
    .acct-sum div + div { border-left: 1px solid var(--line); }
    .acct-sum b { display: block; font-size: 1.15rem; }
    .acct-sum span { color: var(--muted); font-size: .72rem; }
    .acct-plats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .acct-plats:empty { display: none; }
    .acct-cards { list-style: none; display: grid; gap: 8px; margin-top: 12px; }
    .acct-cards > li.empty { color: var(--muted); font-size: .88rem; padding: 10px 0; }
    .acct-card { position: relative; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 16px; overflow: hidden; }
    .acct-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
    .acct-card.p-shopee::before { background: #ee4d2d; }
    .acct-card.p-tiktok::before { background: linear-gradient(#25f4ee, #fe2c55); }
    .acct-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .acct-user { font-weight: 800; font-size: .98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
    .acct-ok { color: var(--ok); font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .acct-line { margin-top: 6px; font-size: .86rem; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .acct-line b { font-weight: 800; }
    .acct-line .money { font-size: .78rem; color: var(--muted); }
    .acct-line .dot { color: var(--muted); }
    .acct-meta { color: var(--muted); font-size: .72rem; margin-top: 4px; }
    .removed-box { margin-top: 14px; }
    .removed-box summary { cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 700; }
    .acct-cards.removed .acct-card { opacity: .6; }
    .acct-cards.removed .acct-card::before { background: var(--muted); }
    @media (max-width: 480px) { .folder-tabs { padding: 0 4px; } .folder-tab { max-width: none; font-size: .82rem; padding: 9px 6px; } .folder-body { padding: 16px; } }
  </style>
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1><span data-i18n="prof.title"></span> <span id="internalTag" class="tag tag-internal hidden" data-i18n="tag.internal"></span></h1>
    <p class="muted" data-i18n="prof.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <!-- 📁 文件夹式分页：个人资料 · 收货地址 -->
    <div class="folder">
      <div class="folder-tabs" role="tablist">
        <button type="button" role="tab" class="folder-tab active" data-tab="info"><span>👤</span><span data-i18n="prof.basic"></span></button>
        <button type="button" role="tab" class="folder-tab" data-tab="bind"><span>🔗</span><span data-i18n="prof.tabBind"></span></button>
        <button type="button" role="tab" class="folder-tab" data-tab="addr"><span data-i18n="addr.title"></span></button>
      </div>

      <!-- ① 个人资料（含生日） -->
      <div class="folder-body" id="tab-info">
        <form id="nameForm">
          <label><span data-i18n="idx.email"></span>
            <input id="email" readonly>
          </label>
          <label><span data-i18n="idx.name"></span>
            <input id="name" required maxlength="40">
            <small class="muted" id="nameHint"></small>
          </label>
          <label><span data-i18n="idx.phone"></span>
            <input type="tel" id="phone" required inputmode="tel" autocomplete="tel" data-i18n-ph="idx.phonePh">
            <small class="muted" data-i18n="idx.phoneHint"></small>
          </label>
          <label class="check">
            <input type="checkbox" id="waOptIn">
            <span data-i18n="idx.waOptIn"></span>
          </label>
          <p class="bonus-hint" id="waBonusHint"></p>
          <button type="submit" class="btn btn-primary" id="nameSubmit" data-i18n="prof.save"></button>
        </form>
        <p id="nameMsg" class="msg"></p>

        <div class="folder-sub">
          <h3 data-i18n="prof.bday"></h3>
          <div id="birthdayLocked" class="hidden">
            <p class="bday-locked"><span id="birthdayText"></span> 🔒</p>
            <p class="muted" style="font-size:.8rem;margin-top:4px" data-i18n="prof.bdayLocked"></p>
          </div>
          <form id="birthdayForm" class="hidden">
            <label><span data-i18n="prof.setBday"></span>
              <input type="date" id="birthday" required>
              <small data-i18n="prof.bdayHint"></small>
            </label>
            <p class="bonus-hint" id="bdayBonusHint"></p>
            <button type="submit" class="btn btn-primary" id="birthdaySubmit" data-i18n="prof.bdaySubmit"></button>
          </form>
          <p id="birthdayMsg" class="msg"></p>
        </div>
      </div>

      <!-- ② 账号绑定（原本的 bind.html） -->
      <div class="folder-body hidden" id="tab-bind">
        <div class="acct-sum">
          <div><b id="sumAcc">–</b><span data-i18n="bind.statAccounts"></span></div>
          <div><b id="sumOrd">–</b><span data-i18n="bind.statOrders"></span></div>
          <div><b id="sumPts">–</b><span data-i18n="bind.statPoints"></span></div>
        </div>
        <div class="acct-plats" id="bindPlatforms"></div>
        <ul id="bindList" class="acct-cards"><li class="empty" data-i18n="common.loading"></li></ul>
        <details id="removedBox" class="removed-box hidden">
          <summary><span data-i18n="bind.removedTitle"></span> (<span id="removedCount">0</span>)</summary>
          <ul id="removedList" class="acct-cards removed"></ul>
        </details>

        <!-- ＋ 关联新的平台账号：默认收起（还没绑定任何账号时自动展开） -->
        <details class="bind-new" id="bindNewBox">
          <summary><span class="plus">＋</span><span data-i18n="bind.newTitle"></span><span class="chev">▾</span></summary>
          <div class="bind-once" data-i18n-html="bind.once"></div>
          <form id="bindForm">
            <label><span data-i18n="bind.orderLabel"></span>
              <input id="orderNo" required autocomplete="off" data-i18n-ph="bind.orderPh">
              <small class="muted" data-i18n-html="bind.anyOrder"></small>
              <div id="platformHint" class="platform-hint muted"></div>
            </label>
            <label><span data-i18n="bind.userLabel"></span>
              <input id="username" required autocomplete="off" data-i18n-ph="bind.userPh">
              <small class="muted" data-i18n="bind.userHint"></small>
            </label>
            <button type="submit" class="btn btn-primary" id="bindSubmit" data-i18n="bind.submit"></button>
          </form>
          <p id="bindMsg" class="msg"></p>
        </details>
        <a class="help-link" href="help.html#bind" style="margin:16px 0 0"><span>❓</span><span data-i18n="help.linkMore"></span><span class="go">➔</span></a>
      </div>

      <!-- ③ 收货地址（兑换实体奖品用） -->
      <div class="folder-body hidden" id="tab-addr">
        <div id="addr">
          <p class="muted" style="font-size:.85rem;margin:0 0 10px" data-i18n="addr.sub"></p>
          <ul id="addrList" class="addr-list"></ul>
          <button type="button" class="btn btn-ghost btn-inline" id="addrAdd" data-i18n="addr.add"></button>
          <form id="addrForm" class="hidden" style="margin-top:12px">
            <div id="addrFields"></div>
            <div class="actions-row">
              <button type="submit" class="btn btn-primary btn-inline" id="addrSave" data-i18n="prof.save"></button>
              <button type="button" class="btn btn-ghost btn-inline" id="addrCancel" data-i18n="addr.cancel"></button>
            </div>
          </form>
          <p id="addrMsg" class="msg"></p>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="small-link" style="margin:0 0 14px">
        <a href="terms.html" data-i18n="common.terms"></a> ·
        <a href="privacy.html" data-i18n="common.privacy"></a>
      </p>
      <button id="logoutBtn" class="btn btn-ghost" type="button" data-i18n="prof.logout"></button>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, updateDoc, serverTimestamp, collection, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, logout, t, normalizePhone, isValidPhone,
      claimBonuses, toastBonuses, bonusPoints, bonusActive, isInternalMember,
      toDate, fmtDate, invalidateMemberCache,
      esc, platformTag, platformLabel, detectPlatform, normalizeOrderNo, normalizeUsername,
      accountStats, maskOrderNo, fmtMoney
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, saveAddresses, addressCardHTML } from "./js/address.js";
    import { MAX_ADDRESSES } from "./js/common.js";
    import * as NM from "./js/newmember.js";   // 🎉 新会员奖励

    const $ = id => document.getElementById(id);
    renderNav("profile");

    // 📁 文件夹分页
    function openTab(k) {
      document.querySelectorAll(".folder-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === k));
      ["info", "bind", "addr"].forEach(x => $("tab-" + x).classList.toggle("hidden", x !== k));
    }
    document.querySelectorAll(".folder-tab").forEach(b => b.addEventListener("click", () => {
      openTab(b.dataset.tab);
      history.replaceState(null, "", location.pathname + (b.dataset.tab === "info" ? "" : "#" + b.dataset.tab));
    }));
    const tabFromHash = () => location.hash === "#addr" ? "addr" : location.hash === "#bind" ? "bind" : "info";
    openTab(tabFromHash());
    window.addEventListener("hashchange", () => openTab(tabFromHash()));

    // ---------- 🔗 账号绑定 ----------
    function bindMsg(text, type) {
      $("bindMsg").textContent = text;
      $("bindMsg").className = "msg" + (type ? " " + type : "");
    }
    // 输入单号时自动判断平台
    $("orderNo").addEventListener("input", () => {
      const no = normalizeOrderNo($("orderNo").value);
      const p = detectPlatform(no);
      $("platformHint").innerHTML = !no ? "" :
        p ? t("bind.detected", { tag: platformTag(p) }) : esc(t("bind.badFormat"));
    });

    function initBind(user, member = {}) {
      async function loadBindings() {
        const mine = c => getDocs(query(collection(db, c), where("uid", "==", user.uid)));
        const [bSnap, oSnap, logs] = await Promise.all([
          mine("bindings"), mine("orders"),
          mine("bindingLogs").then(s => s.docs.map(d => d.data())).catch(() => [])
        ]);
        // 同一个平台排在一起，再按绑定时间
        const rows = bSnap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(a.platform).localeCompare(String(b.platform)) || (toDate(a.createdAt) || 0) - (toDate(b.createdAt) || 0));
        const stats = accountStats(oSnap.docs.map(d => d.data()));
        const empty = { orders: 0, spend: 0, points: 0, last: null };

        const tot = rows.reduce((s, b) => {
          const st = stats[b.id] || empty;
          return { o: s.o + st.orders, p: s.p + st.points };
        }, { o: 0, p: 0 });
        $("sumAcc").textContent = rows.length;
        if (!rows.length) $("bindNewBox").open = true;
        $("sumOrd").textContent = tot.o.toLocaleString();
        $("sumPts").textContent = tot.p.toLocaleString();
        const per = {};
        rows.forEach(b => { per[b.platform] = (per[b.platform] || 0) + 1; });
        $("bindPlatforms").innerHTML = Object.entries(per).map(([p, n]) => `${platformTag(p).replace("</span>", " " + n + "</span>")}`).join("");

        $("bindList").innerHTML = rows.length ? rows.map(b => {
          const st = stats[b.id] || empty;
          const how = b.verifyOrder === "admin" ? t("bind.viaAdmin") : t("bind.viaOrder", { no: maskOrderNo(b.verifyOrder) });
          const meta = [t("bind.linkedOn", { d: fmtDate(toDate(b.createdAt)) }), st.last ? t("bind.lastOrder", { d: fmtDate(st.last) }) : ""].filter(Boolean).join(" · ");
          return `
          <li class="acct-card p-${esc(b.platform)}" title="${esc(how)}">
            <div class="acct-top">${platformTag(b.platform)}<span class="acct-user">${esc(b.username)}</span><span class="acct-ok">✓ ${t("bind.verified")}</span></div>
            <div class="acct-line">${st.orders
              ? `🧾 <b>${esc(t("bind.chipOrders", { n: st.orders }))}</b><span class="dot">·</span>⭐ <b>${esc(t("bind.chipPoints", { n: st.points.toLocaleString() }))}</b>`
              : `<span class="muted" style="font-size:.8rem">${esc(t("bind.noOrders"))}</span>`}</div>
            <div class="acct-meta">${esc(meta)}</div>
          </li>`;
        }).join("") : `<li class="empty">${t("bind.none")}</li>`;

        // 已解除的账号（客服解除时留下的记录）：收起来
        const active = new Set(rows.map(b => b.id));
        const removed = logs.filter(l => l.action === "unbind" && !active.has(l.bindingId))
          .sort((a, b) => (toDate(b.at) || 0) - (toDate(a.at) || 0));
        $("removedBox").classList.toggle("hidden", !removed.length);
        $("removedCount").textContent = removed.length;
        $("removedList").innerHTML = removed.map(l => `
          <li class="acct-card">
            <div class="acct-top">${platformTag(l.platform)}<span class="acct-user">${esc(l.username)}</span><span class="acct-ok" style="color:var(--bad)">${t("bind.removed")}</span></div>
            <div class="acct-meta">${t("bind.linkedOn", { d: fmtDate(toDate(l.boundAt)) })} · ${t("bind.removedOn", { d: fmtDate(toDate(l.at)) })}</div>
          </li>`).join("");
      }

      loadBindings().catch(e => { $("bindList").innerHTML = `<li class="empty">${esc(t("common.loadFail") + e.message)}</li>`; });

      $("bindForm").addEventListener("submit", async e => {
        e.preventDefault();
        const orderNo = normalizeOrderNo($("orderNo").value);
        const username = normalizeUsername($("username").value);
        const platform = detectPlatform(orderNo);

        if (!platform) { bindMsg(t("bind.badFormat"), "err"); return; }
        if (!username) { bindMsg(t("bind.needUser"), "err"); return; }
        if (username.includes("/")) { bindMsg(t("bind.badUser"), "err"); return; }

        $("bindSubmit").disabled = true;
        bindMsg(t("bind.verifying"));
        try {
          await setDoc(doc(db, "bindings", platform + "_" + username), {
            uid: user.uid,
            platform,
            username,
            verifyOrder: orderNo,
            createdAt: serverTimestamp()
          });
          bindMsg(t("bind.success", { platform: platformLabel(platform), user: username }), "ok");
          $("bindForm").reset();
          $("platformHint").textContent = "";
          await loadBindings();
          // 绑定后马上领欢迎礼 / 第二平台奖励
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
          // 🎉 新会员奖励：还没兑换的新会员，提示可以去兑换商城
          try {
            await NM.loadSettings();
            if (NM.stateOf(member).kind === "offer") {
              $("bindMsg").insertAdjacentHTML("beforeend",
                `<br><a class="nm-bind-go" href="shop.html#nm">${esc(NM.nt("bindDone"))} ${esc(NM.nt("bindDoneGo"))}</a>`);
            }
          } catch (e3) { console.warn(e3); }
        } catch (err) {
          if (err.code === "permission-denied") bindMsg(t("bind.denied"), "err");
          else bindMsg(t("bind.fail") + err.message, "err");
        } finally {
          $("bindSubmit").disabled = false;
        }
      });
    }
    $("logoutBtn").addEventListener("click", logout);

    function setMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg" + (type ? " " + type : "");
    }

    function showBirthday(b) {
      if (b) {
        const [y, m, d] = b.split("-");
        $("birthdayText").textContent = `${d}/${m}/${y}`;
        $("birthdayLocked").classList.remove("hidden");
        $("birthdayForm").classList.add("hidden");
      } else {
        $("birthdayLocked").classList.add("hidden");
        $("birthdayForm").classList.remove("hidden");
      }
    }

    requireMember((user, member) => {
      initBind(user, member);
      const ref = doc(db, "members", user.uid);
      $("internalTag").classList.toggle("hidden", !isInternalMember(member));
      $("email").value = member.email || user.email || "";
      $("name").value = member.name || "";
      // 昵称 30 天内只能改一次
      let nameChangedAt = toDate(member.nameChangedAt);
      const NAME_DAYS = 30;
      function nameLock() {
        const until = nameChangedAt ? new Date(nameChangedAt.getTime() + NAME_DAYS * 86400000) : null;
        const locked = !!until && until > new Date();
        $("name").readOnly = locked;
        $("name").classList.toggle("locked", locked);
        $("nameHint").textContent = locked ? t("prof.nameLocked", { d: fmtDate(until) }) : t("prof.nameRule", { n: NAME_DAYS });
        return locked;
      }
      nameLock();
      $("phone").value = member.phone || "";
      $("waOptIn").checked = !!member.waOptIn;
      showBirthday(member.birthday);
      $("waBonusHint").textContent = bonusActive("whatsapp") ? t("prof.waBonus", { n: bonusPoints("whatsapp") }) : "";
      $("bdayBonusHint").textContent = bonusActive("birthday") ? t("prof.bdayBonus", { n: bonusPoints("birthday") }) : "";

      // 从「补充手机号码」提示点进来时，直接聚焦手机栏
      if (location.hash === "#phone") setTimeout(() => $("phone").focus(), 300);

      // ---------- 📦 收货地址 ----------
      let addresses = Array.isArray(member.addresses) ? member.addresses.slice() : [];
      let editing = -1;   // -1 = 新增
      $("addrFields").innerHTML = addressFormHTML();
      bindAddressForm($("addrFields"));
      function renderAddr() {
        $("addrList").innerHTML = addresses.length
          ? addresses.map((a, i) => addressCardHTML(a, i, { actions: true })).join("")
          : `<li class="empty">${t("addr.none")}</li>`;
        $("addrAdd").classList.toggle("hidden", addresses.length >= MAX_ADDRESSES);
      }
      function openAddr(i) {
        editing = i;
        fillAddressForm($("addrFields"), i >= 0 ? addresses[i] : { name: member.name || "", phone: member.phone || "" });
        $("addrForm").classList.remove("hidden");
        $("addrAdd").classList.add("hidden");
        setMsg($("addrMsg"), "");
      }
      function closeAddr() {
        $("addrForm").classList.add("hidden");
        renderAddr();
      }
      async function persist(next, okText) {
        try {
          await saveAddresses(user.uid, next);
          addresses = next;
          closeAddr();
          setMsg($("addrMsg"), okText, "ok");
        } catch (err) { setMsg($("addrMsg"), t("idx.saveFail") + err.message, "err"); }
      }
      renderAddr();
      $("addrAdd").addEventListener("click", () => openAddr(-1));
      $("addrCancel").addEventListener("click", closeAddr);
      $("addrForm").addEventListener("submit", async e => {
        e.preventDefault();
        const r = validateAddressForm($("addrFields"));
        if (r.error) { setMsg($("addrMsg"), r.error, "err"); return; }
        const next = addresses.slice();
        if (editing >= 0) next[editing] = r.address; else next.push(r.address);
        $("addrSave").disabled = true;
        await persist(next, t("prof.saved"));
        $("addrSave").disabled = false;
      });
      $("addrList").addEventListener("click", async e => {
        const b = e.target.closest("[data-addr]");
        if (!b) return;
        const i = +b.closest(".addr-item").dataset.i;
        if (b.dataset.addr === "edit") { openAddr(i); return; }
        const next = addresses.slice();
        if (b.dataset.addr === "default") next.unshift(next.splice(i, 1)[0]);
        if (b.dataset.addr === "del") {
          if (!confirm(t("addr.delConfirm"))) return;
          next.splice(i, 1);
        }
        await persist(next, t("prof.saved"));
      });

      $("nameForm").addEventListener("submit", async e => {
        e.preventDefault();
        const phone = normalizePhone($("phone").value);
        if (!isValidPhone(phone)) { setMsg($("nameMsg"), t("idx.phoneBad"), "err"); $("phone").focus(); return; }
        $("nameSubmit").disabled = true;
        try {
          const newName = $("name").value.trim();
          const data = { phone, waOptIn: $("waOptIn").checked };
          if (newName !== (member.name || "")) {
            if (nameLock()) { $("name").value = member.name || ""; setMsg($("nameMsg"), $("nameHint").textContent, "err"); return; }
            if (!newName) { setMsg($("nameMsg"), t("prof.nameEmpty"), "err"); return; }
            if (!confirm(t("prof.nameConfirm", { name: newName, n: NAME_DAYS }))) return;
            data.name = newName;
            data.nameChangedAt = serverTimestamp();
          }
          await updateDoc(ref, data);
          if (data.name) { member.name = data.name; nameChangedAt = new Date(); nameLock(); }
          invalidateMemberCache();
          $("phone").value = phone;
          setMsg($("nameMsg"), t("prof.saved"), "ok");
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
        } catch (err) {
          setMsg($("nameMsg"), t("idx.saveFail") + err.message, "err");
        } finally {
          $("nameSubmit").disabled = false;
        }
      });

      $("birthdayForm").addEventListener("submit", async e => {
        e.preventDefault();
        const b = $("birthday").value;
        if (!b) return;
        if (!confirm(t("idx.bdayConfirm", { b }))) return;
        $("birthdaySubmit").disabled = true;
        try {
          await updateDoc(ref, { birthday: b });
          invalidateMemberCache();
          showBirthday(b);
          setMsg($("birthdayMsg"), t("prof.bdaySet"), "ok");
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
        } catch (err) {
          setMsg($("birthdayMsg"), t("prof.setFail") + err.message, "err");
          $("birthdaySubmit").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
