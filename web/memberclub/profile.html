<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="prof.pageTitle">Profile · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1><span data-i18n="prof.title"></span> <span id="internalTag" class="tag tag-internal hidden" data-i18n="tag.internal"></span></h1>
    <p class="muted" data-i18n="prof.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <div class="card">
      <h2 data-i18n="prof.basic"></h2>
      <form id="nameForm">
        <label><span data-i18n="idx.email"></span>
          <input id="email" readonly>
        </label>
        <label><span data-i18n="idx.name"></span>
          <input id="name" required maxlength="40">
        </label>
        <label><span data-i18n="idx.phone"></span>
          <input type="tel" id="phone" required inputmode="tel" autocomplete="tel" data-i18n-ph="idx.phonePh">
          <small class="muted" data-i18n="idx.phoneHint"></small>
        </label>
        <label class="check">
          <input type="checkbox" id="waOptIn">
          <span data-i18n="idx.waOptIn"></span>
        </label>
        <p class="bonus-hint" id="waBonusHint"></p>
        <button type="submit" class="btn btn-primary" id="nameSubmit" data-i18n="prof.save"></button>
      </form>
      <p id="nameMsg" class="msg"></p>
    </div>

    <!-- 📦 收货地址（兑换实体奖品用） -->
    <div class="card" id="addr">
      <h2 data-i18n="addr.title"></h2>
      <p class="muted" style="font-size:.85rem;margin:-6px 0 10px" data-i18n="addr.sub"></p>
      <ul id="addrList" class="addr-list"></ul>
      <button type="button" class="btn btn-ghost btn-inline" id="addrAdd" data-i18n="addr.add"></button>
      <form id="addrForm" class="hidden" style="margin-top:12px">
        <div id="addrFields"></div>
        <div class="actions-row">
          <button type="submit" class="btn btn-primary btn-inline" id="addrSave" data-i18n="prof.save"></button>
          <button type="button" class="btn btn-ghost btn-inline" id="addrCancel" data-i18n="addr.cancel"></button>
        </div>
      </form>
      <p id="addrMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2 data-i18n="prof.bday"></h2>
      <div id="birthdayLocked" class="hidden">
        <p style="font-size:1.2rem;font-weight:700" id="birthdayText"></p>
        <p class="muted" style="font-size:.85rem;margin-top:6px" data-i18n="prof.bdayLocked"></p>
      </div>
      <form id="birthdayForm" class="hidden">
        <label><span data-i18n="prof.setBday"></span>
          <input type="date" id="birthday" required>
          <small data-i18n="prof.bdayHint"></small>
        </label>
        <p class="bonus-hint" id="bdayBonusHint"></p>
        <button type="submit" class="btn btn-primary" id="birthdaySubmit" data-i18n="prof.bdaySubmit"></button>
      </form>
      <p id="birthdayMsg" class="msg"></p>
    </div>

    <div class="card">
      <p class="small-link" style="margin:0 0 14px">
        <a href="terms.html" data-i18n="common.terms"></a> ·
        <a href="privacy.html" data-i18n="common.privacy"></a>
      </p>
      <button id="logoutBtn" class="btn btn-ghost" type="button" data-i18n="prof.logout"></button>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, logout, t, normalizePhone, isValidPhone,
      claimBonuses, toastBonuses, bonusPoints, bonusActive, isInternalMember
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, saveAddresses, addressCardHTML } from "./js/address.js";
    import { MAX_ADDRESSES } from "./js/common.js";

    const $ = id => document.getElementById(id);
    renderNav("profile");
    $("logoutBtn").addEventListener("click", logout);

    function setMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg" + (type ? " " + type : "");
    }

    function showBirthday(b) {
      if (b) {
        const [y, m, d] = b.split("-");
        $("birthdayText").textContent = `${d}/${m}/${y}`;
        $("birthdayLocked").classList.remove("hidden");
        $("birthdayForm").classList.add("hidden");
      } else {
        $("birthdayLocked").classList.add("hidden");
        $("birthdayForm").classList.remove("hidden");
      }
    }

    requireMember((user, member) => {
      const ref = doc(db, "members", user.uid);
      $("internalTag").classList.toggle("hidden", !isInternalMember(member));
      $("email").value = member.email || user.email || "";
      $("name").value = member.name || "";
      $("phone").value = member.phone || "";
      $("waOptIn").checked = !!member.waOptIn;
      showBirthday(member.birthday);
      $("waBonusHint").textContent = bonusActive("whatsapp") ? t("prof.waBonus", { n: bonusPoints("whatsapp") }) : "";
      $("bdayBonusHint").textContent = bonusActive("birthday") ? t("prof.bdayBonus", { n: bonusPoints("birthday") }) : "";

      // 从「补充手机号码」提示点进来时，直接聚焦手机栏
      if (location.hash === "#phone") setTimeout(() => $("phone").focus(), 300);

      // ---------- 📦 收货地址 ----------
      let addresses = Array.isArray(member.addresses) ? member.addresses.slice() : [];
      let editing = -1;   // -1 = 新增
      $("addrFields").innerHTML = addressFormHTML();
      bindAddressForm($("addrFields"));
      function renderAddr() {
        $("addrList").innerHTML = addresses.length
          ? addresses.map((a, i) => addressCardHTML(a, i, { actions: true })).join("")
          : `<li class="empty">${t("addr.none")}</li>`;
        $("addrAdd").classList.toggle("hidden", addresses.length >= MAX_ADDRESSES);
      }
      function openAddr(i) {
        editing = i;
        fillAddressForm($("addrFields"), i >= 0 ? addresses[i] : { name: member.name || "", phone: member.phone || "" });
        $("addrForm").classList.remove("hidden");
        $("addrAdd").classList.add("hidden");
        setMsg($("addrMsg"), "");
      }
      function closeAddr() {
        $("addrForm").classList.add("hidden");
        renderAddr();
      }
      async function persist(next, okText) {
        try {
          await saveAddresses(user.uid, next);
          addresses = next;
          closeAddr();
          setMsg($("addrMsg"), okText, "ok");
        } catch (err) { setMsg($("addrMsg"), t("idx.saveFail") + err.message, "err"); }
      }
      renderAddr();
      if (location.hash === "#addr") setTimeout(() => $("addr").scrollIntoView({ behavior: "smooth" }), 300);
      $("addrAdd").addEventListener("click", () => openAddr(-1));
      $("addrCancel").addEventListener("click", closeAddr);
      $("addrForm").addEventListener("submit", async e => {
        e.preventDefault();
        const r = validateAddressForm($("addrFields"));
        if (r.error) { setMsg($("addrMsg"), r.error, "err"); return; }
        const next = addresses.slice();
        if (editing >= 0) next[editing] = r.address; else next.push(r.address);
        $("addrSave").disabled = true;
        await persist(next, t("prof.saved"));
        $("addrSave").disabled = false;
      });
      $("addrList").addEventListener("click", async e => {
        const b = e.target.closest("[data-addr]");
        if (!b) return;
        const i = +b.closest(".addr-item").dataset.i;
        if (b.dataset.addr === "edit") { openAddr(i); return; }
        const next = addresses.slice();
        if (b.dataset.addr === "default") next.unshift(next.splice(i, 1)[0]);
        if (b.dataset.addr === "del") {
          if (!confirm(t("addr.delConfirm"))) return;
          next.splice(i, 1);
        }
        await persist(next, t("prof.saved"));
      });

      $("nameForm").addEventListener("submit", async e => {
        e.preventDefault();
        const phone = normalizePhone($("phone").value);
        if (!isValidPhone(phone)) { setMsg($("nameMsg"), t("idx.phoneBad"), "err"); $("phone").focus(); return; }
        $("nameSubmit").disabled = true;
        try {
          await updateDoc(ref, { name: $("name").value.trim(), phone, waOptIn: $("waOptIn").checked });
          $("phone").value = phone;
          setMsg($("nameMsg"), t("prof.saved"), "ok");
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
        } catch (err) {
          setMsg($("nameMsg"), t("idx.saveFail") + err.message, "err");
        } finally {
          $("nameSubmit").disabled = false;
        }
      });

      $("birthdayForm").addEventListener("submit", async e => {
        e.preventDefault();
        const b = $("birthday").value;
        if (!b) return;
        if (!confirm(t("idx.bdayConfirm", { b }))) return;
        $("birthdaySubmit").disabled = true;
        try {
          await updateDoc(ref, { birthday: b });
          showBirthday(b);
          setMsg($("birthdayMsg"), t("prof.bdaySet"), "ok");
          try { toastBonuses((await claimBonuses(user.uid)).claimed); } catch (e2) { console.warn(e2); }
        } catch (err) {
          setMsg($("birthdayMsg"), t("prof.setFail") + err.message, "err");
          $("birthdaySubmit").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
