<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="acc.pageTitle">Member Tier · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 id="hello"></h1>
    <p class="muted" data-i18n="acc.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <!-- 还没填手机号码的提示（早期注册的会员） -->
    <div id="phoneCallout" class="callout hidden">
      <p data-i18n="acc.phoneCallout"></p>
      <a href="profile.html#phone" class="btn btn-primary btn-inline" data-i18n="acc.addPhone"></a>
    </div>

    <!-- 尚未绑定时的提示 -->
    <div id="bindCallout" class="callout hidden">
      <p data-i18n="acc.bindCallout"></p>
      <p class="welcome-line" id="welcomeLine"></p>
      <a href="bind.html" class="btn btn-primary btn-inline" data-i18n="acc.goBind"></a>
    </div>

    <!-- 会员等级 -->
    <div class="card tier-card" id="tierCard">
      <div class="tier-head">
        <div class="tier-icon" id="tierIcon"></div>        <div>
          <div class="tier-name" id="tierName">-</div>
          <div class="tier-perk" id="tierPerk"></div>
        </div>
      </div>
      <div class="bar"><div id="tierBar" style="width:0%"></div></div>
      <div class="muted" style="font-size:.85rem" id="tierNext"></div>
      <details>
        <summary data-i18n="tier.explain"></summary>
        <table class="tier-table" id="tierTable"></table>
        <p class="muted" style="font-size:.78rem;margin-top:8px" data-i18n="tier.note"></p>
      </details>
    </div>

    <!-- 积分摘要 -->
    <div class="stats">
      <div class="stat main">
        <div class="label" data-i18n="acc.available"></div>
        <div class="value" id="spendable">-</div>
        <div class="sub" id="reservedNote"><a href="shop.html" data-i18n="acc.goRedeem"></a></div>
      </div>
      <div class="stat">
        <div class="label" data-i18n="acc.pending"></div>
        <div class="value" id="pending">-</div>
        <div class="sub" id="nextUnlock">&nbsp;</div>
      </div>
    </div>

    <p class="expiry-note" id="expiryNote"></p>
    <a href="points.html" class="detail-link" data-i18n="acc.toDetail"></a>

    <!-- 🎁 额外福利：欢迎礼 + 完善资料奖励（之后改成后台可设定） -->
    <div class="card task-card hidden" id="taskCard">
      <h2 data-i18n="task.title"></h2>
      <p class="muted task-sub" data-i18n="task.sub"></p>
      <ul class="task-list" id="taskList"></ul>
    </div>

    <!-- 积分奖励常见问题：内容待全部功能确认后再补（暂时隐藏） -->
    <div class="card faq-card hidden" id="faqTier"></div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, toDate, fmtDate, fmtMoney, esc, platformTag,
      TIERS, tierProgress, tierLabel, tierIconHTML, t, translateReason,
      BONUSES, bonusPoints, bonusActive, activeBonuses, customPerks, EXPIRY_MONTHS, isInternalMember
    } from "./js/common.js";
    import { renderFaq } from "./js/faq.js";

    const $ = id => document.getElementById(id);
    renderNav("account");

    requireMember(async (user, member) => {
      renderFaq($("faqTier"), "tier");
      $("hello").textContent = t("acc.hello", { name: member.name || t("acc.member") });
      $("phoneCallout").classList.toggle("hidden", !!member.phone);

      // ---------- 会员等级 ----------
      const tp = tierProgress(member);
      $("tierCard").classList.add("tier-" + tp.tier.id);
      $("tierIcon").innerHTML = tierIconHTML(tp.tier);      $("tierName").textContent = tierLabel(tp.tier);
      $("tierPerk").textContent = t("tier.perk", { m: tp.tier.multiplier, b: tp.tier.birthday, s: fmtMoney(tp.spend) });
      $("tierBar").style.width = tp.pct + "%";
      $("tierNext").textContent = tp.next
        ? t("tier.next", { need: fmtMoney(tp.need), icon: tp.next.icon, label: tierLabel(tp.next), m: tp.next.multiplier })
        : t("tier.max");
      $("tierTable").innerHTML = `
        <tr><th>${t("tier.colTier")}</th><th>${t("tier.colSpend")}</th><th>${t("tier.colMult")}</th><th>${t("tier.colBday")}</th></tr>
        ${TIERS.map(x => `
          <tr class="${x.id === tp.tier.id ? "current" : ""}">
            <td><span class="tier-cell"><span class="ti">${tierIconHTML(x)}</span><span>${tierLabel(x)}</span></span></td>            <td>${x.minSpend ? t("tier.minSpend", { n: x.minSpend }) : t("tier.free")}</td>
            <td>×${x.multiplier}</td>
            <td>${t("unit.pts", { n: x.birthday })}</td>
          </tr>`).join("")}`;

      const mine = c => getDocs(query(collection(db, c), where("uid", "==", user.uid)));
      let bal, bindSnap;
      try {
        [bal, bindSnap] = await Promise.all([loadBalance(user.uid), mine("bindings")]);
      } catch (e) {
        $("pageError").textContent = t("common.loadFail") + e.message;
        $("pageError").classList.remove("hidden");
        return;
      }

      const now = new Date();

      // ---------- 已绑定账号 ----------
      const bindings = bindSnap.docs.map(d => d.data());
      const internal = isInternalMember(member);
      $("bindCallout").classList.toggle("hidden", bindings.length > 0 || internal);

      // ---------- 积分摘要 ----------
      $("spendable").textContent = bal.spendable.toLocaleString();
      if (bal.reserved > 0) {
        $("reservedNote").innerHTML = `${esc(t("acc.reserved", { n: bal.reserved }))} · <a href="rewards.html">${t("acc.view")}</a>`;
      }
      $("pending").textContent = bal.pending.toLocaleString();
      $("nextUnlock").textContent = bal.nextUnlock ? t("acc.nextUnlock", { d: fmtDate(bal.nextUnlock) }) : " ";

      // ---------- ⏳ 积分有效期 ----------
      if (bal.expiring.length) {
        $("expiryNote").innerHTML = bal.expiring.map(x =>
          `<span class="expiry-soon">⏳ ${esc(t("acc.expiring", { n: x.amount.toLocaleString(), d: fmtDate(x.date) }))}</span>`
        ).join("") + ` <a href="shop.html">${t("acc.useNow")}</a>`;
      } else {
        $("expiryNote").textContent = t("acc.expiryRule", { m: EXPIRY_MONTHS });
      }

      // ---------- 🎁 额外福利（后台可设定） ----------
      const got = new Set(bal.ledger.map(x => (BONUSES.find(b => b.reason === x.reason) || {}).key).filter(Boolean));
      const HREF = { welcome: "bind.html", birthday: "profile.html", whatsapp: "profile.html#phone", platform2: "bind.html" };
      const tasks = activeBonuses().map(b => ({ key: b.key, href: HREF[b.key], ok: got.has(b.key) }));
      $("welcomeLine").textContent = bonusActive("welcome") ? t("acc.welcomeBonus", { n: bonusPoints("welcome") }) : "";
      const custom = customPerks();
      const perkLink = u => /^https:\/\//i.test(u || "") || /^[a-z0-9_-]+\.html(#[\w-]*)?$/i.test(u || "") ? u : "";
      if (tasks.length || custom.length) {
        $("taskCard").classList.remove("hidden");
        $("taskList").innerHTML = tasks.map(x => `
          <li class="${x.ok ? "done" : ""}">
            <span class="task-check">${x.ok ? "✓" : ""}</span>
            <span class="task-text">${t("task." + x.key)}${!x.ok && !bindings.length && !internal && x.key !== "welcome" ? ` <small class="muted">${t("task.needBind")}</small>` : ""}</span>
            ${x.ok
              ? `<span class="task-pts muted">${t("notif.plus", { n: bonusPoints(x.key) })}</span>`
              : `<a class="task-pts" href="${x.href}">${t("notif.plus", { n: bonusPoints(x.key) })} ➔</a>`}
          </li>`).join("") + custom.map(p => `
          <li class="custom-perk">
            <span class="task-check star">★</span>
            <span class="task-text">${esc(p.title)}
              ${p.desc ? `<small class="perk-desc">${esc(p.desc)}</small>` : ""}
              <small class="muted">${t("task.manual")}</small></span>
            ${perkLink(p.link)
              ? `<a class="task-pts" href="${esc(perkLink(p.link))}">${p.points ? t("notif.plus", { n: p.points }) : t("notif.open")} ➔</a>`
              : `<span class="task-pts">${p.points ? t("notif.plus", { n: p.points }) : ""}</span>`}
          </li>`).join("");
      }
    });
  </script>
</body>
</html>
