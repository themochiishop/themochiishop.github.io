<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <title>Mochii Feed · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
  <style>
    /* ===== 沿用原本 Feed 的瀑布流卡片布局 ===== */
    .feed-page { max-width: 860px; margin: 0 auto; padding: 14px 6px 90px; }
    .feed-head { text-align: center; margin: 4px 4px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .feed-head h1 { font-size: 1.2rem; margin: 0; }
    .feed-head p { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .feed-waterfall { column-count: 2; column-gap: 6px; width: 100%; }
    @media (min-width: 768px) { .feed-waterfall { column-count: 3; column-gap: 10px; } }

    .xhs-card {
      background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.04);
      display: flex; flex-direction: column; border: 1px solid #eee; cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 6px; color: #333;
    }
    .xhs-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .slider-wrap { position: relative; }
    .slider-container { width: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; position: relative; }
    .slider-container::-webkit-scrollbar { display: none; }
    .slider-img { width: 100%; flex-shrink: 0; scroll-snap-align: start; height: auto; display: block; background: #f7f7f7; }
    .pic-count { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: .62rem;
      font-weight: 700; padding: 1px 7px; border-radius: 999px; pointer-events: none; letter-spacing: .3px; }
    .xhs-content { padding: 8px 10px; font-size: .88rem; font-weight: 500; color: #222; line-height: 1.45;
      white-space: pre-wrap; word-break: break-word; }
    .xhs-footer { padding: 6px 8px; display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid #fafafa; gap: 6px; }
    .xhs-author { display: flex; align-items: center; gap: 5px; flex: 0 1 auto; min-width: 0; cursor: pointer; }   /* 不撑满：空白处点了是打开帖子，不是进会员主页 */
    .xhs-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .xhs-author-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .xhs-card, .xhs-card .xhs-content { color: #222; }
    .xhs-name { font-size: .72rem; color: #333; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .xhs-time { font-size: .56rem; color: #aaa; letter-spacing: -.2px; white-space: nowrap; }
    .xhs-like-btn { background: #fff0f2; border: none; cursor: pointer; display: flex; align-items: center; gap: 2px;
      font-size: .72rem; color: #e63946; padding: 3px 6px; border-radius: 12px; font-weight: bold; flex-shrink: 0;
      transition: transform .15s ease; }
    .xhs-like-btn:active { transform: scale(1.15); }
    .pagination-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 20px 0 30px; padding: 10px 0; }
    .page-btn { padding: 6px 14px; background: #fff; border: 1px solid #ddd; border-radius: 20px; cursor: pointer;
      font-size: .8rem; font-weight: 600; color: #333; box-shadow: 0 2px 4px rgba(0,0,0,.03); transition: all .2s ease; }
    .page-btn:hover:not(:disabled) { background: #f0f4f9; border-color: #0066cc; color: #0066cc; }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .page-info { font-size: .82rem; color: var(--muted); font-weight: 500; }

    /* ===== 卡片底部：两行（名字＋等级 / 头衔＋时间） ===== */
    .xhs-like-btn.liked { background: #e63946; color: #fff; }
    .xhs-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .xhs-cmt { font-size: .68rem; color: #888; font-weight: 600; }
    @media (max-width: 600px) { .xhs-cmt { display: none; } }
    .name-row { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .sub-row { display: flex; align-items: center; gap: 4px; min-width: 0; margin-top: 1px; }
    .tier-mark { font-size: .66rem; line-height: 1; flex-shrink: 0; }
    .ttl { display: inline-block; font-size: .56rem; font-weight: 700; padding: 0 4px; border-radius: 3px; color: #fff;
      line-height: 1.5; flex-shrink: 0; white-space: nowrap; }

    /* 头像：名字字母 / 预设 */
    .av { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center;
      justify-content: center; color: #fff; font-size: .64rem; font-weight: 800; line-height: 1; overflow: hidden;
      background: linear-gradient(135deg, #ff6fae, #7c5cff); }
    .av.t-silver { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .av.t-gold { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .av.t-diamond { background: linear-gradient(135deg, #22d3ee, #6366f1); }
    .av.t-black { background: linear-gradient(135deg, #111827, #4b5563); }
    .av.preset { font-size: .78rem; }

    .lock-box { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: linear-gradient(135deg, #fde2ef, #e4defd); }
    .lock-box img { width: 100%; height: 100%; object-fit: cover; filter: blur(14px); transform: scale(1.2); }
    .lock-box .lock-on { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.45); background: rgba(15,23,42,.18); text-align: center; padding: 8px; }
    .lock-on b { font-size: .82rem; }
    .lock-on span { font-size: .68rem; opacity: .95; }
    .lock-on .ic { font-size: 1.4rem; }

    .feed-hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 0 4px 12px; font-size: .85rem; }
    .feed-hint .btn { width: auto; padding: 6px 14px; font-size: .8rem; }
    .my-posts { margin: 0 4px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .85rem; }
    .my-posts summary { cursor: pointer; font-weight: 700; }
    .my-post { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .my-post:first-of-type { margin-top: 8px; }
    .my-post .txt { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }

    /* 会员主页：等级封面图 + 头像外框跟着等级变色；电脑左右排、手机置中 */
    .prof-back { display: inline-block; margin: 0 4px 10px; font-size: .85rem; color: var(--muted); cursor: pointer; background: none; border: 0; }
    .prof-back:hover { color: var(--text); }
    .prof { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin: 0 4px 18px; text-align: center; padding-bottom: 18px;
      --ring: #ff6fae; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .prof.t-silver { --ring: #e2e8f0; } .prof.t-gold { --ring: #f5c542; } .prof.t-diamond { --ring: #67e8f9; }
    .prof.t-black { --ring: #d4af37; } .prof.t-shop { --ring: #fff; }
    .prof-cover { aspect-ratio: 12 / 5; position: relative; background: #7c5cff var(--cover-m) center / cover no-repeat; }   /* 手机：手机版封面，字标在左、猫咪在右 */
    .prof-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(19,26,46,.55)); }
    .prof-tier { position: absolute; right: 14px; top: 12px; z-index: 1; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); background: rgba(0,0,0,.18); padding: 3px 10px; border-radius: 999px; backdrop-filter: blur(4px); }
    .prof-main { position: relative; padding: 0 16px; display: flow-root; }   /* flow-root：头像往上压封面时，整块不会跟着往上跑 */
    .prof-av { display: flex; justify-content: center; margin-top: -50px; position: relative; z-index: 1; }
    .prof-av > .av, .prof-av > .xhs-avatar { width: 100px; height: 100px; font-size: 2.2rem; border: 4px solid var(--ring);
      box-shadow: 0 0 0 4px var(--card), 0 10px 26px rgba(0,0,0,.4); }
    .prof-av > .av.preset { font-size: 3rem; }
    .prof-name { font-size: 1.3rem; font-weight: 800; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
    .prof-name .ttl { font-size: .7rem; padding: 1px 8px; border-radius: 5px; }
    .prof-line { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .tier-pill { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 800; padding: 3px 11px; border-radius: 999px;
      border: 1px solid var(--ring); color: var(--text); background: rgba(255,255,255,.04); }
    .tier-pill.best { border-color: rgba(212,175,55,.6); color: #f3d27a; font-weight: 700; }
    .bio-lbl { color: var(--muted); font-size: .76rem; font-weight: 700; margin-right: 4px; }
    .prof-bio { font-size: .9rem; margin: 12px auto 0; max-width: 460px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .prof-bio.empty { color: var(--muted); font-style: italic; cursor: pointer; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; display: inline-block; }
    .prof-bio.empty:hover { border-color: var(--accent); color: var(--text); }
    .prof-stats { text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px auto 0; max-width: 460px; background: var(--card2);
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .prof-stats div { padding: 10px 4px; }
    .prof-stats div + div { border-left: 1px solid var(--line); }
    .prof-stats b { display: block; font-size: 1.15rem; line-height: 1.3; }
    .prof-stats span { color: var(--muted); font-size: .74rem; }
    .prof-acts { display: none; gap: 8px; justify-content: center; margin-top: 14px; }
    .prof-icons { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; z-index: 2; }
    .prof-icons button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2);
      color: var(--text); font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .prof-icons button:hover { border-color: var(--accent); }
    .prof-acts .btn { width: auto; flex: 1; max-width: 200px; padding: 9px 12px; font-size: .84rem; }
    .posts-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 12px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .posts-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    @media (min-width: 720px) {
      .prof-cover { aspect-ratio: auto; height: 210px; background-image: var(--cover); }
      .prof { text-align: left; padding-bottom: 22px; }
      .prof-main { display: grid; grid-template-columns: 1fr 270px; gap: 0 26px; align-items: start; padding: 0 26px; }
      /* 头像对准封面右边的猫咪头，像被猫咪框住 */
      .prof-main { position: static; }
      .prof-av { position: absolute; top: 96px; left: calc(68.3% - 64px); margin: 0; justify-content: center; }
      .prof-av > .av, .prof-av > .xhs-avatar { width: 128px; height: 128px; font-size: 2.6rem; }
      .prof-av > .av.preset { font-size: 3.6rem; }
      .prof-info { padding-top: 18px; min-width: 0; grid-column: 1; grid-row: 1; }
      .prof-name, .prof-line { justify-content: flex-start; }
      .prof-name { margin-top: 0; font-size: 1.45rem; }
      .prof-bio { margin: 12px 0 0; max-width: none; }
      .prof-side { padding-top: 46px; grid-column: 2; grid-row: 1; }
      .prof-stats { margin: 0; max-width: none; }
      .prof-acts { display: flex; }
      .prof-acts .btn { max-width: none; }
      .prof-icons { display: none; }
    }

    /* 分享卡 */
    .share-card { padding: 0; overflow: hidden; text-align: center; max-width: 380px; }
    .share-card .sc-cover { aspect-ratio: 12 / 5; background: #7c5cff center / cover no-repeat; }
    .share-card .sc-av { display: flex; justify-content: center; margin-top: -40px; }
    .share-card .sc-av > .av, .share-card .sc-av > .xhs-avatar { width: 80px; height: 80px; font-size: 1.8rem; border: 3px solid var(--ring, #ff6fae); box-shadow: 0 0 0 3px var(--card); }
    .share-card .sc-av > .av.preset { font-size: 2.4rem; }
    .share-card .sc-body { padding: 10px 18px 20px; }
    .share-card .sc-name { font-weight: 800; font-size: 1.1rem; display: flex; justify-content: center; gap: 6px; align-items: center; flex-wrap: wrap; }
    .share-card .sc-link { margin: 14px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line);
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .86rem; word-break: break-all; color: var(--accent); user-select: all; }
    .share-card .sc-acts { display: flex; gap: 8px; }
    .share-card .prof-line { justify-content: center !important; margin-top: 6px; }
    .share-card .sc-acts .btn { flex: 1; }

    .fab { position: fixed; right: 18px; bottom: 22px; z-index: 20; border: 0; border-radius: 999px; padding: 12px 18px;
      font-weight: 800; font-size: .95rem; color: #fff; cursor: pointer; box-shadow: 0 8px 22px rgba(255,111,174,.35);
      background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    /* 详情窗、发帖窗、编辑窗 */
    .modal-card.wide { max-width: 560px; padding: 0; }
    .detail-body { padding: 16px 18px 18px; }
    .detail-text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; margin: 10px 0 12px; }
    .detail-slider .slider-img { max-height: 70vh; object-fit: contain; background: #000; }
    .modal-card .pic-count { top: 10px; right: auto; left: 10px; font-size: .72rem; }
    .detail-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .detail-meta .who { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
    .detail-meta .xhs-avatar, .detail-meta .av { width: 34px; height: 34px; font-size: .85rem; }
    .detail-meta .av.preset { font-size: 1.1rem; }
    .detail-meta .nm { font-weight: 700; font-size: .9rem; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .detail-meta .tm { font-size: .72rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .detail-meta .ttl { font-size: .64rem; padding: 0 6px; }
    .cmt-head { font-weight: 700; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
    .cmt { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .cmt:last-child { border-bottom: 0; }
    .cmt { scroll-margin-bottom: 120px; }   /* 捲动时留位置给下面的回复输入框 */
    /* 从铃铛点进来的那一条回复 */
    .cmt.cmt-focus { background: rgba(255,111,174,.14); border-radius: 10px; padding-left: 8px; padding-right: 8px; transition: background 1.2s ease; }
    .cmt .av, .cmt .xhs-avatar { width: 26px; height: 26px; font-size: .68rem; margin-top: 2px; cursor: pointer; }
    .cmt .av.preset { font-size: .85rem; }
    .cmt-main { flex: 1; min-width: 0; }
    .cmt-name { font-size: .8rem; font-weight: 700; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .cmt-who { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }   /* 只有名字和头像能点进会员主页，空白处不会 */
    .cmt-text { font-size: .88rem; white-space: pre-wrap; word-break: break-word; }
    .cmt-text .at { color: var(--accent); }
    .cmt-foot { display: flex; gap: 12px; font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .cmt-foot button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .72rem; padding: 0; }
    .cmt-foot button:hover { color: var(--text); }
    .reply-box { position: sticky; bottom: 0; background: var(--card); padding: 10px 0 2px; margin-top: 6px; }
    /* 平常只显示一条「写留言」，点了才展开输入框 */
    .reply-pill { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: text;
      background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px;
      color: var(--muted); font-size: .86rem; }
    .reply-pill:hover { border-color: var(--accent); }
    .reply-pill .dr { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-close { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .76rem; margin-left: auto; }
    .cmt-hidden { font-size: .84rem; color: var(--muted); font-style: italic; }
    .report-reasons { display: grid; gap: 6px; margin: 10px 0; }
    .report-reasons label { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 10px; cursor: pointer; font-size: .9rem; }
    .report-reasons input { width: auto; margin: 0; accent-color: var(--accent); }
    .report-reasons label:has(input:checked) { border-color: var(--accent); background: rgba(255,111,174,.08); }
    .reply-to { font-size: .76rem; color: var(--accent); margin-bottom: 4px; display: flex; gap: 8px; }
    .reply-to button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .76rem; }
    .reply-row { display: flex; gap: 8px; align-items: flex-end; }
    .reply-row textarea { flex: 1; min-height: 42px; margin: 0; }
    .reply-row .btn { width: auto; padding: 10px 16px; }
    .cant { font-size: .82rem; color: var(--muted); text-align: center; padding: 10px 0 4px; }
    .post-pics { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
    .post-pic { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .post-pic img { width: 100%; height: 100%; object-fit: cover; }
    .post-pic button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0;
      background: rgba(0,0,0,.65); color: #fff; cursor: pointer; font-size: .7rem; }
    .post-add { width: 84px; height: 84px; border-radius: 10px; border: 2px dashed var(--line); background: transparent;
      color: var(--muted); cursor: pointer; font-size: .8rem; }
    .del-link { border: 0; background: none; color: var(--bad); cursor: pointer; font-size: .78rem; }
    /* ⋯ 选单：编辑 / 删除（收起来，避免误触） */
    .more-wrap { position: relative; display: inline-flex; }
    .more-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 8px; border-radius: 8px; }
    .more-btn:hover { background: var(--card2); color: var(--text); }
    .cmt-foot .more-btn { font-size: .9rem; padding: 0 6px; }
    .more-menu { position: absolute; right: 0; top: 100%; z-index: 5; min-width: 120px; background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .more-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); cursor: pointer;
      font-size: .84rem; padding: 8px 10px; border-radius: 7px; }
    .more-menu button:hover { background: var(--card2); }
    .more-menu button.danger { color: var(--bad); }
    .edited-tag { color: var(--muted); font-size: .72rem; }
    .edit-box textarea { width: 100%; min-height: 90px; resize: vertical; }
    .edit-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .edit-row .btn { padding: 6px 14px; font-size: .84rem; }

    .av-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 10px 0 12px; }
    .av-pick button { border: 2px solid transparent; background: none; padding: 2px; border-radius: 50%; cursor: pointer; aspect-ratio: 1; }
    .av-pick button.on { border-color: var(--accent); }
    .av-pick .av { width: 100%; height: 100%; font-size: 1.3rem; }
    .av-now { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
    .av-now .av, .av-now .xhs-avatar { width: 56px; height: 56px; font-size: 1.4rem; }
    .av-now .av.preset { font-size: 1.8rem; }
    .av-now .btn { width: auto; padding: 7px 12px; font-size: .8rem; }
    .bio-count { text-align: right; font-size: .72rem; color: var(--muted); margin-top: -10px; margin-bottom: 8px; }

    /* ===== 📱 手机：帖子、发帖、编辑资料从底部滑上来 ===== */
    @media (max-width: 600px) {
      .modal.sheet { align-items: flex-end; padding: 0; }
      .modal.sheet > .modal-card {
        width: 100%; max-width: 100%; max-height: 92vh; max-height: 92dvh;
        border-radius: 18px 18px 0 0; border-bottom: 0;
        animation: sheetUp .24s ease-out; overscroll-behavior: contain;
      }
      .modal.sheet > .modal-card:not(.wide) { padding-top: 26px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
      /* 顶部小横杠：按住往下拉可以收起 */
      .modal.sheet > .modal-card::before {
        content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; z-index: 3;
        border-radius: 999px; background: rgba(255,255,255,.65); box-shadow: 0 0 4px rgba(0,0,0,.35);
      }
      .modal.sheet .modal-x { display: none; }
      .modal.sheet #detailInner > .detail-body:first-child { padding-top: 24px; }   /* 没有图片的帖子：留位置给小横杠 */
      .modal.sheet .detail-slider .slider-img { max-height: 55vh; }                  /* 图片不要占满，下面的文字看得到 */
      .modal.sheet .reply-box { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    }
    @keyframes sheetUp { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .modal.sheet > .modal-card { animation: none; } }
  </style>
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="feed-page">
    <div class="feed-head" id="fHead"><h1 id="fTitle"></h1><p id="fSub"></p></div>
    <div id="profileHead"></div>
    <div id="hint"></div>
    <div id="myPosts"></div>

    <div id="social-feed" class="feed-waterfall">
      <div style="column-span: all; color: var(--muted); text-align: center; padding: 30px;" id="loadingText"></div>
    </div>

    <div class="pagination-bar" id="paginationControls" style="display: none;">
      <button id="prevPageBtn" class="page-btn"></button>
      <span id="pageIndicator" class="page-info"></span>
      <button id="nextPageBtn" class="page-btn"></button>
    </div>
  </main>

  <button type="button" id="fab" class="fab hidden"></button>

  <!-- 帖子详情（手机：从底部滑上来） -->
  <div id="detail" class="modal sheet hidden" role="dialog" aria-modal="true">
    <div class="modal-card wide">
      <button type="button" class="modal-x" data-close aria-label="close" style="z-index:2">✕</button>
      <div id="detailInner"></div>
    </div>
  </div>

  <!-- 发帖（手机：从底部滑上来） -->
  <div id="composer" class="modal sheet hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 id="cTitle"></h2>
      <textarea id="cText" rows="5" maxlength="2000"></textarea>
      <div class="post-pics" id="cPics"></div>
      <input type="file" id="cFile" accept="image/*" multiple class="hidden">
      <p class="muted" style="font-size:.76rem" id="cPicNote"></p>
      <p class="muted" style="font-size:.8rem;margin:10px 0" id="cNote"></p>
      <button type="button" class="btn btn-primary" id="cSend"></button>
      <p id="cMsg" class="msg"></p>
    </div>
  </div>

  <!-- 分享主页 -->
  <!-- 🚩 检举 -->
  <div id="reporter" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <div id="reportInner"></div>
    </div>
  </div>

  <div id="sharer" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card share-card" id="shareCard">
      <button type="button" class="modal-x" data-close aria-label="close" style="z-index:2">✕</button>
      <div id="shareInner"></div>
    </div>
  </div>

  <!-- 我的头像与简介（手机：从底部滑上来） -->
  <div id="editor" class="modal sheet hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 id="eTitle"></h2>
      <div class="av-now">
        <span id="eNow"></span>
        <div>
          <button type="button" class="btn btn-ghost" id="eUpload"></button>
          <button type="button" class="btn btn-ghost" id="eLetter"></button>
          <p class="muted hidden" style="font-size:.74rem;margin-top:4px" id="eNeedBind"></p>
        </div>
      </div>
      <input type="file" id="eFile" accept="image/*" class="hidden">
      <p class="muted" style="font-size:.82rem;margin-top:10px" id="ePickLbl"></p>
      <div class="av-pick" id="ePick"></div>
      <label><span id="eBioLbl"></span>
        <textarea id="eBio" rows="2" maxlength="60"></textarea>
      </label>
      <div class="bio-count" id="eBioCount"></div>
      <button type="button" class="btn btn-primary" id="eSave"></button>
      <p id="eMsg" class="msg"></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      collection, collectionGroup, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter,
      getCountFromServer, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { renderNav, initBell, esc, toDate, toast, compressImage, isInternalMember, t, lang, BLACK_CROWN } from "./js/common.js";
    import { applyI18n, langSwitchHTML, bindLangSwitch } from "./js/i18n.js";
    import { ft } from "./js/feed-i18n.js";

    const $ = id => document.getElementById(id);
    const PAGE_SIZE = 10;
    const MAX_PICS = 3;
    const CLUB_LOGO = "img/member.jpg";
    // 等级数字（要和 Firestore 规则的 fdRankOf 一致）
    const RANK = { mochii: 0, silver: 1, gold: 2, diamond: 3, black: 4 };
    const TIER_MARK = { silver: "🥈", gold: "🥇", diamond: "💎", black: BLACK_CROWN };
    const tierName = r => r === 4 ? "Black Elite" : t("tier." + (Object.keys(RANK).find(k => RANK[k] === r) || "mochii"));
    // 预设头像（存成 p:0 ~ p:11）
    const PRESETS = [
      ["🐰", "#ffd1e8", "#ff8fc1"], ["🐱", "#ffe7c2", "#ffb36b"], ["🐻", "#f3d9c4", "#c08457"], ["🐼", "#e5e7eb", "#94a3b8"],
      ["🦊", "#ffd8b8", "#ff8a4c"], ["🐥", "#fff3b0", "#ffcf3f"], ["🌸", "#ffe0ef", "#f472b6"], ["⭐", "#e0e7ff", "#818cf8"],
      ["🍡", "#fde2f3", "#c084fc"], ["🧸", "#fde6cf", "#e2a46b"], ["🎀", "#ffd6e0", "#fb7185"], ["☁️", "#dbeafe", "#60a5fa"],
    ];

    // 目前这个人
    const me = { user: null, member: null, rank: -1, bound: false, internal: false, admin: false, title: "", perm: "none", feed: null };
    let cfg = {};
    const profiles = {};   // 会员ID → memberFeed 资料（头像、简介、最新名字）

    // ---------- 文字 ----------
    document.title = ft("pageTitle");
    $("fTitle").textContent = ft("title");
    $("fSub").textContent = ft("latest");
    $("loadingText").textContent = ft("loading");
    $("prevPageBtn").textContent = ft("prev");
    $("nextPageBtn").textContent = ft("next");
    $("fab").textContent = "＋ " + ft("newPost");
    $("cTitle").textContent = ft("postTitle");
    $("cText").placeholder = ft("postPh");
    $("cPicNote").textContent = ft("picNote");
    $("cSend").textContent = ft("postBtn");
    $("eTitle").textContent = ft("editTitle");
    $("eUpload").textContent = ft("upload");
    $("eLetter").textContent = ft("useLetter");
    $("eNeedBind").textContent = ft("uploadNeedBind");
    $("ePickLbl").textContent = ft("pickAvatar");
    $("eBioLbl").textContent = ft("bio");
    $("eBio").placeholder = ft("bioPh");
    $("eSave").textContent = ft("save");

    // ---------- 小工具 ----------
    function fmtTime(ts) {
      const d = toDate(ts);
      if (!d) return "";
      const p = n => String(n).padStart(2, "0");
      return p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    const safeImg = u => /^data:image\/(png|jpe?g|webp|gif);base64,/i.test(u || "") || /^https:\/\//i.test(u || "") ? u : "";
    function titleTag(id) {
      const tt = (cfg.titles || {})[id];
      if (!tt) return "";
      return `<span class="ttl" style="background:${esc(/^#[0-9a-f]{6}$/i.test(tt.color || "") ? tt.color : "#64748b")}">${esc(tt[lang] || tt.zh || id)}</span>`;
    }
    const isShop = p => !p.authorTier;   // 店铺帖子（后台发的）没有等级
    // 作者的资料：会员以会员资料（memberFeed）为准，没有的话用帖子上的
    function who(p) {
      if (isShop(p)) return { name: p.authorName || cfg.shopName || "The Mochii Shop", tier: "", title: p.authorTitle || "", avatar: p.avatar || cfg.shopAvatar || "", shop: true };
      const f = profiles[p.authorUid] || {};
      return { name: f.name || p.authorName || "", tier: f.tier || p.authorTier || "mochii", title: f.title ?? p.authorTitle ?? "", avatar: f.avatar || "", bio: f.bio || "" };
    }
    function avatarOf(w) {
      const a = w.avatar || "";
      const m = a.match(/^p:(\d{1,2})$/);
      if (m && PRESETS[+m[1]]) {
        const [e, c1, c2] = PRESETS[+m[1]];
        return `<span class="av preset" style="background:linear-gradient(135deg,${c1},${c2})">${e}</span>`;
      }
      if (safeImg(a)) return `<img class="xhs-avatar" src="${esc(a)}" alt="">`;
      if (w.shop) return `<img class="xhs-avatar" src="${CLUB_LOGO}" alt="">`;
      const ch = Array.from(String(w.name || "?").trim())[0] || "?";
      return `<span class="av t-${esc(w.tier || "mochii")}">${esc(ch.toUpperCase())}</span>`;
    }
    const tierMark = w => TIER_MARK[w.tier] ? `<span class="tier-mark">${TIER_MARK[w.tier]}</span>` : "";
    const authorKey = p => isShop(p) ? "shop" : "u-" + p.authorUid;
    const canSee = p => me.rank >= (p.minRank ?? 0);
    const isMod = () => me.admin || me.perm === "mod";
    const canReply = () => !!me.member && !!me.member.name && (me.perm !== "none" || me.internal || me.bound) && me.rank >= (cfg.replyRank ?? 0);
    const canPost = () => !!me.member && !!me.member.name && (me.perm !== "none" || ((me.internal || me.bound) && me.rank >= (cfg.postRank ?? 1)));
    const canUpload = () => me.admin || me.internal || me.bound || me.perm !== "none";
    const autoPublish = () => me.admin || me.perm !== "none" || me.rank >= (cfg.autoRank ?? 2);
    function sliderHTML(images, cls = "") {
      const imgs = (images || []).map(safeImg).filter(Boolean).slice(0, 3);
      if (!imgs.length) return "";
      return `<div class="slider-wrap"><div class="slider-container ${cls}">${imgs.map(u => `<img src="${esc(u)}" class="slider-img" alt="">`).join("")}</div>`
        + (imgs.length > 1 ? `<span class="pic-count">1/${imgs.length}</span>` : "") + `</div>`;
    }
    // 滑动图片时更新「1/3」
    document.addEventListener("scroll", e => {
      const sl = e.target;
      if (!sl.classList || !sl.classList.contains("slider-container")) return;
      const badge = sl.parentElement.querySelector(".pic-count");
      if (!badge) return;
      const n = sl.children.length;
      badge.textContent = Math.min(n, Math.round(sl.scrollLeft / sl.clientWidth) + 1) + "/" + n;
    }, true);

    // 读取作者的会员资料（只读还没读过的）
    async function loadProfiles(uids) {
      const need = [...new Set(uids.filter(u => u && !(u in profiles)))];
      await Promise.all(need.map(async u => {
        try { const s = await getDoc(doc(db, "memberFeed", u)); profiles[u] = s.exists() ? s.data() : null; }
        catch (e) { profiles[u] = null; }
      }));
    }

    // ---------- 判断身份 ----------
    async function loadMe(user) {
      me.user = user;
      const cfgSnap = await getDoc(doc(db, "feedConfig", "main")).catch(() => null);
      cfg = cfgSnap && cfgSnap.exists() ? cfgSnap.data() : {};
      if (!user) return;
      const [mSnap, club, adm, ttl] = await Promise.all([
        getDoc(doc(db, "members", user.uid)).catch(() => null),
        getDoc(doc(db, "settings", "club")).catch(() => null),
        getDoc(doc(db, "admins", user.uid)).catch(() => null),
        getDoc(doc(db, "feedTitles", user.uid)).catch(() => null),
      ]);
      me.admin = !!(adm && adm.exists());
      const open = club && club.exists() && club.data().open === true;
      if (!mSnap || !mSnap.exists() || (!open && !me.admin)) return;   // 不是会员，或俱乐部维修中：当访客
      me.member = mSnap.data();
      me.rank = RANK[me.member.tier || "mochii"] ?? 0;
      me.internal = isInternalMember(me.member);
      me.title = ttl && ttl.exists() ? (ttl.data().title || "") : "";
      me.perm = me.title ? (((cfg.titles || {})[me.title] || {}).perm || "none") : "none";
      if (!me.internal) me.bound = await ensurePass(user.uid);
      await syncMyFeed();
    }

    // 绑定通行证：记下一个自己的绑定账号，让规则确认「已绑定订单」（别人看不到）
    async function ensurePass(uid) {
      try {
        const pass = await getDoc(doc(db, "feedPass", uid));
        if (pass.exists()) {
          const b = await getDoc(doc(db, "bindings", pass.data().bindId)).catch(() => null);
          if (b && b.exists() && b.data().uid === uid) return true;
        }
        const mine = await getDocs(query(collection(db, "bindings"), where("uid", "==", uid), limit(1)));
        if (mine.empty) { if (pass.exists()) await deleteDoc(doc(db, "feedPass", uid)); return false; }
        await setDoc(doc(db, "feedPass", uid), { bindId: mine.docs[0].id, at: serverTimestamp() });
        return true;
      } catch (e) { console.warn("feedPass", e); return false; }
    }

    // 我的会员 Feed 资料：名字、等级、头衔跟着会员资料走（头像、简介保留）
    async function syncMyFeed(patch) {
      const ref = doc(db, "memberFeed", me.user.uid);
      try {
        if (!me.feed) { const s = await getDoc(ref); me.feed = s.exists() ? s.data() : null; }
        const cur = me.feed || {};
        const next = {
          name: me.member.name || "", tier: me.member.tier || "mochii", title: me.title,
          avatar: cur.avatar || "", bio: cur.bio || "", code: me.user.uid.slice(0, 8), best: me.member.bestTier || "", ...(patch || {}),
        };
        const same = me.feed && ["name", "tier", "title", "avatar", "bio", "code", "best"].every(k => cur[k] === next[k]);
        if (!same) {
          await setDoc(ref, { ...next, updatedAt: serverTimestamp() });
          me.feed = next;
        }
        profiles[me.user.uid] = me.feed;
      } catch (e) {
        console.warn("memberFeed", e);
        if (patch) throw e;
      }
    }

    // ---------- 顶部 ----------
    function renderTop() {
      if (me.member) { renderNav(location.hash === "#me" ? "myfeed" : "feed"); initBell(me.user, me.member); return; }
      applyI18n();
      $("topbar").className = "topbar";
      $("topbar").innerHTML = `
        <div class="topbar-inner">
          <a class="brand" href="index.html"><img class="brand-logo" src="img/member.jpg" alt=""><span>Mochii <b>Club</b></span></a>
          <div class="topbar-tools">${langSwitchHTML()}</div>
        </div>`;
      bindLangSwitch($("topbar"));
    }

    function renderHint() {
      let h = "";
      if (view.mode === "all") {
        if (!me.member) h = `<span>${esc(ft("hintGuest"))}</span><a class="btn btn-primary" href="index.html">${esc(ft("hintGuestBtn"))}</a>`;
        else if (!me.member.name) h = `<span>${esc(ft("hintName"))}</span><a class="btn btn-ghost" href="profile.html">${esc(ft("hintNameBtn"))}</a>`;
        else if (!me.bound && !me.internal && me.perm === "none") h = `<span>${esc(ft("hintBind"))}</span><a class="btn btn-primary" href="profile.html#bind">${esc(ft("hintBindBtn"))}</a>`;
        else if (!canPost()) h = `<span>${esc(ft("hintPost", { tier: tierName(cfg.postRank ?? 1) }))}</span><a class="btn btn-ghost" href="account.html#tiers">${esc(t("tier.explain"))}</a>`;
      }
      $("hint").innerHTML = h ? `<div class="feed-hint">${h}</div>` : "";
      $("fab").classList.toggle("hidden", !canPost());
      $("myPosts").classList.toggle("hidden", view.mode !== "all");
    }

    // ---------- 我的投稿（审核中、未通过） ----------
    async function loadMyPosts() {
      if (!me.member) return;
      try {
        const snap = await getDocs(query(collection(db, "feedPosts"), where("authorUid", "==", me.user.uid)));
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.status !== "published")
          .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
        if (!list.length) { $("myPosts").innerHTML = ""; return; }
        const np = list.filter(p => p.status === "pending").length, nr = list.length - np;
        const texts = await Promise.all(list.map(p => getDoc(doc(db, "feedPosts", p.id, "content", "main")).then(s => s.exists() ? s.data().text : "").catch(() => "")));
        $("myPosts").innerHTML = `<details class="my-posts"><summary>📝 ${esc(ft("myPosts"))} · ${[np ? ft("nPending", { n: np }) : "", nr ? ft("nRejected", { n: nr }) : ""].filter(Boolean).join(" · ")}</summary>
          ${list.map((p, i) => `<div class="my-post"><div>
              <span class="tag ${p.status === "pending" ? "tag-pending" : "tag-bad"}">${esc(ft(p.status === "pending" ? "stPending" : "stRejected"))}</span>
              <span class="muted" style="font-size:.74rem">${fmtTime(p.createdAt)}</span>
              <div class="txt">${esc(texts[i] || "🖼")}</div>
              ${p.rejectReason ? `<div class="muted" style="font-size:.76rem">${esc(ft("reason", { r: p.rejectReason }))}</div>` : ""}
            </div><button class="del-link" data-delmine="${esc(p.id)}">${esc(ft("delete"))}</button></div>`).join("")}
        </details>`;
        $("myPosts").querySelectorAll("[data-delmine]").forEach(b => b.onclick = async () => {
          if (!confirm(ft("delPost"))) return;
          try { await deletePost(b.dataset.delmine); loadMyPosts(); } catch (e) { toast(ft("fail") + e.message); }
        });
      } catch (e) { console.warn("myPosts", e); }
    }

    // ---------- 看哪里：全部 / 某会员的主页 / 店铺主页 ----------
    let view = { mode: "all" };
    function viewFromHash() {
      const h = location.hash;
      let m;
      if ((m = h.match(/^#c-([\w-]+)$/)) && codeUid[m[1]]) return { mode: "user", uid: codeUid[m[1]] };
      if ((m = h.match(/^#u-([\w-]+)$/))) return { mode: "user", uid: m[1] };
      if (h === "#shop") return { mode: "shop" };
      if (h === "#me" && me.member) return { mode: "user", uid: me.user.uid };
      if (/^#p-/.test(h)) return view;   // 打开帖子：留在目前的列表
      return { mode: "all" };
    }
    // 短链接 themochiishop.com/u/代码 → feed.html#c-代码：用代码找出是哪位会员
    const codeUid = {};
    async function resolveCode() {
      const m = location.hash.match(/^#c-([\w-]+)$/);
      if (!m || codeUid[m[1]]) return;
      try {
        const s = await getDocs(query(collection(db, "memberFeed"), where("code", "==", m[1]), limit(1)));
        if (!s.empty) { codeUid[m[1]] = s.docs[0].id; profiles[s.docs[0].id] = s.docs[0].data(); }
      } catch (e) { console.warn("code", e); }
    }

    async function route() {
      if (location.hash === "#me" && !me.member) { location.href = "index.html"; return; }
      await resolveCode();
      const next = viewFromHash();
      const changed = next.mode !== view.mode || next.uid !== view.uid;
      view = next;
      if (changed || !shown.length) {
        cursors.length = 1;
        closeModal("detail", true, true);
        renderHint();
        await renderProfileHead();
        await loadPage(1);
        window.scrollTo({ top: 0 });
      }
      openFromHash();
    }
    window.addEventListener("hashchange", route);

    function goAuthor(key) {
      if (location.hash === "#" + key) return;
      location.hash = key;
    }

    const COVERS = ["mochii", "silver", "gold", "diamond", "black", "shop"];
    const coverOf = (key, mobile) => `img/covers/${COVERS.includes(key) ? key : "mochii"}${mobile ? "-m" : ""}.webp`;
    let profW = null;   // 目前主页的人（分享卡用）

    async function renderProfileHead() {
      const box = $("profileHead");
      $("fHead").classList.toggle("hidden", view.mode !== "all");
      if (view.mode === "all") { box.innerHTML = ""; profW = null; return; }
      let w, mine = false, likeKey;
      if (view.mode === "shop") {
        w = { name: cfg.shopName || "The Mochii Shop", tier: "", title: cfg.shopTitle ?? "owner", avatar: cfg.shopAvatar || "", shop: true };
        likeKey = "shop";
      } else {
        await loadProfiles([view.uid]);
        const f = profiles[view.uid] || {};
        w = { name: f.name || "", tier: f.tier || "mochii", title: f.title || "", avatar: f.avatar || "", bio: f.bio || "", code: f.code || view.uid.slice(0, 8), best: f.best || "" };
        mine = !!me.user && view.uid === me.user.uid;
        likeKey = view.uid;
      }
      profW = w;
      const key = w.shop ? "shop" : w.tier;
      const tierName = w.shop ? "Official" : w.tier === "black" ? "Black Elite" : t("tier." + w.tier);
      const tierIcon = w.shop ? "🏪" : (TIER_MARK[w.tier] || "🎀");
      document.title = (mine ? ft("myPage") : ft("pageOf", { name: w.name })) + " · Mochii Club";
      const bio = w.bio ? `<div class="prof-bio"><span class="bio-lbl">${esc(ft("bioLbl"))}</span>${esc(w.bio)}</div>`
        : mine ? `<div class="prof-bio empty" id="profBioEmpty">${esc(ft("bioEmpty"))}</div>` : "";
      box.innerHTML = `${mine && location.hash === "#me" ? "" : `<button class="prof-back" id="profBack">${esc(ft("back"))}</button>`}
        <div class="prof t-${esc(key)}">
          <div class="prof-cover" style="--cover:url('${coverOf(key)}');--cover-m:url('${coverOf(key, true)}')"><span class="prof-tier">${esc(tierName)}</span></div>
          <div class="prof-main">
            <div class="prof-icons">
              ${mine ? `<button id="profEditI" title="${esc(ft("editProfile"))}" aria-label="${esc(ft("editProfile"))}">✏️</button>` : ""}
              <button id="profShareI" title="${esc(ft("share"))}" aria-label="${esc(ft("share"))}">↗</button>
            </div>
            <div class="prof-av">${avatarOf(w)}</div>
            <div class="prof-info">
              <div class="prof-name">${esc(w.name)} ${titleTag(w.title)}</div>
              <div class="prof-line">
                <span class="tier-pill">${tierIcon} ${esc(tierName)}</span>
                ${w.best && (RANK[w.best] ?? 0) > (RANK[w.tier] ?? 0) ? `<span class="tier-pill best">${esc(t("tier.best", { label: t("tier." + w.best) }))}</span>` : ""}
              </div>
              ${bio}
            </div>
            <div class="prof-side">
              <div class="prof-stats">
                <div><b id="statPosts">–</b><span>${esc(ft("statPosts"))}</span></div>
                <div><b id="statLikes">–</b><span>${esc(ft("statLikes"))}</span></div>
                <div><b>${tierIcon}</b><span>${esc(ft("statTier"))}</span></div>
              </div>
              <div class="prof-acts">
                ${mine ? `<button class="btn btn-primary" id="profEdit">${esc(ft("editProfile"))}</button>` : ""}
                <button class="btn btn-ghost" id="profShare">${esc(ft("share"))}</button>
              </div>
            </div>
          </div>
        </div>
        <div class="posts-head">${esc(ft("allPosts"))} · <span id="statPosts2">–</span></div>`;
      const back = $("profBack");
      if (back) back.onclick = () => { history.pushState(null, "", location.pathname + location.search); route(); };
      const ed = $("profEdit"); if (ed) ed.onclick = openEditor;
      const edi = $("profEditI"); if (edi) edi.onclick = openEditor;
      $("profShareI").onclick = openSharer;
      const be = $("profBioEmpty"); if (be) be.onclick = openEditor;
      $("profShare").onclick = openSharer;
      // 获赞：数一下这个人（或店铺）收到的所有赞
      getCountFromServer(query(collectionGroup(db, "likes"), where("postAuthorUid", "==", likeKey)))
        .then(c => { const el = $("statLikes"); if (el) el.textContent = c.data().count.toLocaleString(); })
        .catch(e => console.warn("likes count", e));
    }

    // ---------- 分享卡：头像 + 短链接 ----------
    function openSharer() {
      const w = profW;
      if (!w) return;
      const key = w.shop ? "shop" : w.tier;
      const url = "https://www.themochiishop.com/u/" + (w.shop ? "shop" : w.code);
      const tierName = w.shop ? "Official" : w.tier === "black" ? "Black Elite" : t("tier." + w.tier);
      const RING = { mochii: "#ff6fae", silver: "#e2e8f0", gold: "#f5c542", diamond: "#67e8f9", black: "#d4af37", shop: "#fff" };
      $("shareCard").style.setProperty("--ring", RING[key] || "#ff6fae");
      $("shareInner").innerHTML = `
        <div class="sc-cover" style="background-image:url('${coverOf(key, true)}')"></div>
        <div class="sc-av">${avatarOf(w)}</div>
        <div class="sc-body">
          <div class="sc-name">${esc(w.name)} ${titleTag(w.title)}</div>
          <div class="prof-line"><span class="tier-pill">${w.shop ? "🏪" : (TIER_MARK[w.tier] || "🎀")} ${esc(tierName)}</span></div>
          <div class="sc-link" id="scLink">${esc(url.replace(/^https:\/\//, ""))}</div>
          <div class="sc-acts">
            <button class="btn btn-ghost" id="scCopy">${esc(ft("copyLink"))}</button>
            ${navigator.share ? `<button class="btn btn-primary" id="scShare">${esc(ft("shareVia"))}</button>` : ""}
          </div>
        </div>`;
      $("scCopy").onclick = async () => {
        try { await navigator.clipboard.writeText(url); toast(ft("copied")); }
        catch (e) { prompt("", url); }
      };
      const sh = $("scShare");
      if (sh) sh.onclick = async () => {
        try { await navigator.share({ title: w.name + " · Mochii Club", url }); } catch (e) {}
      };
      $("sharer").classList.remove("hidden"); document.body.style.overflow = "hidden";
    }

    // ---------- 帖子列表（分页） ----------
    let page = 1, totalPages = 1;
    const cursors = [null];   // 每一页开始前的最后一篇
    function filters() {
      const f = [where("status", "==", "published")];
      if (view.mode === "user") f.unshift(where("authorUid", "==", view.uid));
      if (view.mode === "shop") f.unshift(where("authorTier", "==", ""));
      return f;
    }
    const base = () => view.mode === "all"
      ? query(collection(db, "feedPosts"), ...filters(), orderBy("pinned", "desc"), orderBy("createdAt", "desc"))
      : query(collection(db, "feedPosts"), ...filters(), orderBy("createdAt", "desc"));
    let shown = [];           // 这一页的帖子

    async function withExtras(p) {
      const visible = canSee(p);
      const [c, nc, nl, ml] = await Promise.all([
        visible ? getDoc(doc(db, "feedPosts", p.id, "content", "main")).catch(() => null) : null,
        visible ? getCountFromServer(collection(db, "feedPosts", p.id, "comments")).catch(() => null) : null,
        visible ? getCountFromServer(collection(db, "feedPosts", p.id, "likes")).catch(() => null) : null,
        visible && me.member ? getDoc(doc(db, "feedPosts", p.id, "likes", me.user.uid)).catch(() => null) : null,
      ]);
      p.visible = visible;
      p.content = c && c.exists() ? c.data() : { text: "", images: [] };
      p.nCmt = nc ? nc.data().count : 0;
      p.nLike = nl ? nl.data().count : 0;
      p.liked = !!(ml && ml.exists());
      return p;
    }

    async function loadPage(n) {
      const box = $("social-feed");
      try {
        if (n === 1) {
          const c = await getCountFromServer(query(collection(db, "feedPosts"), ...filters()));
          const total = c.data().count;
          totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
          ["statPosts", "statPosts2"].forEach(id => { const el = $(id); if (el) el.textContent = total.toLocaleString(); });
        }
        const q = cursors[n - 1] ? query(base(), startAfter(cursors[n - 1]), limit(PAGE_SIZE)) : query(base(), limit(PAGE_SIZE));
        const snap = await getDocs(q);
        if (snap.docs.length) cursors[n] = snap.docs[snap.docs.length - 1];
        page = n;
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await loadProfiles(list.filter(p => !isShop(p)).map(p => p.authorUid));
        shown = await Promise.all(list.map(withExtras));
        render();
      } catch (e) {
        console.error(e);
        box.innerHTML = `<div style="column-span:all;color:var(--bad);text-align:center;padding:30px;overflow-wrap:anywhere;word-break:break-word">${esc(t("common.loadFail") + e.message)}</div>`;
      }
    }

    function cardHTML(p) {
      const w = who(p);
      const top = p.visible
        ? sliderHTML(p.content.images)
        : `<div class="lock-box">${safeImg(p.thumb) ? `<img src="${esc(p.thumb)}" alt="">` : ""}
             <div class="lock-on"><span class="ic">🔒</span><b>${esc(ft("rank" + Math.max(0, p.minRank)))}</b>
             <span>${esc(ft(me.member ? "lockUp" : "lockGuest"))}</span></div></div>`;
      const text = p.visible && p.content.text ? `<div class="xhs-content">${esc(p.content.text)}</div>` : "";
      const right = p.visible ? `<div class="xhs-right">
          ${p.nCmt ? `<span class="xhs-cmt">💬 ${p.nCmt}</span>` : ""}
          <button class="xhs-like-btn${p.liked ? " liked" : ""}" data-like="${esc(p.id)}">${p.liked ? "❤️" : "🤍"} <span>${p.nLike}</span></button>
        </div>` : "";
      return `<div class="xhs-card" data-id="${esc(p.id)}">
          ${top}${text}
          <div class="xhs-footer">
            <div class="xhs-author" data-author="${esc(authorKey(p))}">${avatarOf(w)}
              <div class="xhs-author-info">
                <div class="name-row"><span class="xhs-name">${esc(w.name)}</span>${tierMark(w)}</div>
                <div class="sub-row">${titleTag(w.title)}<span class="xhs-time">${p.pinned && view.mode === "all" ? "📌 " : ""}${fmtTime(p.createdAt)}</span></div>
              </div>
            </div>${right}
          </div>
        </div>`;
    }

    function render() {
      const box = $("social-feed");
      if (!shown.length) {
        box.innerHTML = `<div style="column-span:all;color:var(--muted);text-align:center;padding:30px">${esc(ft(view.mode === "all" ? "empty" : "noPosts"))}</div>`;
        $("paginationControls").style.display = "none";
        return;
      }
      box.innerHTML = shown.map(cardHTML).join("");
      $("paginationControls").style.display = totalPages > 1 ? "flex" : "none";
      $("pageIndicator").textContent = ft("pageInfo", { c: page, t: totalPages });
      $("prevPageBtn").disabled = page === 1;
      $("nextPageBtn").disabled = page >= totalPages;
    }

    $("social-feed").addEventListener("click", e => {
      const like = e.target.closest("[data-like]");
      if (like) { e.stopPropagation(); toggleLike(like.dataset.like); return; }
      const card = e.target.closest(".xhs-card");
      if (!card) return;
      const p = shown.find(x => x.id === card.dataset.id);
      if (!p) return;
      const au = e.target.closest("[data-author]");
      if (au && view.mode === "all") { goAuthor(au.dataset.author); return; }
      if (!p.visible) { if (!me.member) location.href = "index.html"; return; }
      openDetail(p);
    });
    $("prevPageBtn").onclick = () => { if (page > 1) { loadPage(page - 1); window.scrollTo({ top: 0, behavior: "smooth" }); } };
    $("nextPageBtn").onclick = () => { if (page < totalPages) { loadPage(page + 1); window.scrollTo({ top: 0, behavior: "smooth" }); } };

    // ---------- 点赞（每人一次，再按取消） ----------
    const liking = new Set();
    async function toggleLike(id) {
      if (!me.member) { toast(ft("needLogin")); return; }
      const p = shown.find(x => x.id === id) || (openPost && openPost.id === id ? openPost : null);
      if (!p || liking.has(id)) return;
      liking.add(id);
      const ref = doc(db, "feedPosts", id, "likes", me.user.uid);
      const was = p.liked;
      p.liked = !was; p.nLike += was ? -1 : 1;
      render(); if (openId === id) drawDetail(p);
      try {
        if (was) await deleteDoc(ref);
        else await setDoc(ref, { at: serverTimestamp(), postAuthorUid: isShop(p) ? "shop" : p.authorUid });
      } catch (e) {
        p.liked = was; p.nLike += was ? 1 : -1; render(); if (openId === id) drawDetail(p);
        toast(ft("fail") + e.message);
      } finally { liking.delete(id); }
    }

    // ---------- 帖子详情 + 回复 ----------
    let openId = null, openPost = null, comments = [], replyTo = null, focusCid = null;
    let editing = null;   // 正在编辑：「post」或「c:回复ID」
    let replyOpen = false;          // 留言框有没有展开
    const drafts = {};              // 每篇帖子写到一半的留言（收起后不会不见）

    // ⋯ 选单：作者本人可以编辑；作者、管理员、版主可以删除
    const canEdit = p => !!me.user && (me.admin || p.authorUid === me.user.uid);
    const canEditCmt = c => !!me.user && !c.hidden && (me.admin || c.authorUid === me.user.uid);
    const canReport = authorUid => !!me.member && !!me.user && authorUid !== me.user.uid;
    function moreHTML(kind, id, edit, del, rep) {
      if (!edit && !del && !rep) return "";
      return `<span class="more-wrap"><button class="more-btn" data-more="${kind}:${esc(id)}" aria-label="${esc(ft("more"))}" title="${esc(ft("more"))}">⋯</button>
        <span class="more-menu hidden" data-menu="${kind}:${esc(id)}">
          ${edit ? `<button data-mact="edit">✏️ ${esc(ft("editText"))}</button>` : ""}
          ${del ? `<button data-mact="del" class="danger">🗑 ${esc(ft("delete"))}</button>` : ""}
          ${rep ? `<button data-mact="report">🚩 ${esc(ft("report"))}</button>` : ""}
        </span></span>`;
    }
    function editBoxHTML(text) {
      return `<div class="edit-box"><textarea id="editText" maxlength="${editing === "post" ? 2000 : 500}">${esc(text)}</textarea>
        <div class="edit-row"><button class="btn btn-ghost" data-ecancel>${esc(ft("cancel"))}</button>
        <button class="btn btn-primary" data-esave>${esc(ft("save"))}</button></div></div>`;
    }
    document.addEventListener("click", e => {   // 点外面就收起选单
      if (!e.target.closest(".more-wrap")) document.querySelectorAll(".more-menu").forEach(m => m.classList.add("hidden"));
    });

    // ---------- 📱 底部面板：按手机「返回」只关窗口，不离开 Feed；往下拉可以收起 ----------
    const SHEETS = ["detail", "composer", "editor"];
    let sheetPushed = false;   // 打开时有没有多记一步浏览记录
    let afterBack = null;      // 关掉面板后要做的事（例如去作者主页）
    function sheetOpened() {
      if (sheetPushed) return;
      // 铃铛点进来的 #p-帖子：先换回列表网址，「返回」才会回到列表
      if (/^#p-/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + (view.mode === "user" ? "#u-" + view.uid : view.mode === "shop" ? "#shop" : ""));
      history.pushState({ sheet: 1 }, "", location.href);
      sheetPushed = true;
    }
    window.addEventListener("popstate", () => {
      if (afterBack) { const f = afterBack; afterBack = null; f(); return; }
      if (!sheetPushed) return;
      sheetPushed = false;
      SHEETS.forEach(s => { if (!$(s).classList.contains("hidden")) closeModal(s, true, true); });
      $("reporter").classList.add("hidden");
    });
    // 往下拉收起：从小横杠开始拉，或内容已经在最上面时往下拉
    const sheetMq = matchMedia("(max-width: 600px)");
    SHEETS.forEach(id => {
      const card = $(id).querySelector(".modal-card");
      let y0 = null, x0 = 0, dy = 0, dragging = false;
      card.addEventListener("touchstart", e => {
        if (!sheetMq.matches || e.touches.length > 1) return;
        const tp = e.touches[0], inGrip = tp.clientY - card.getBoundingClientRect().top < 44;
        if (!inGrip && (card.scrollTop > 0 || e.target.closest("textarea, input, .slider-container"))) return;
        y0 = tp.clientY; x0 = tp.clientX; dy = 0; dragging = false;
      }, { passive: true });
      card.addEventListener("touchmove", e => {
        if (y0 === null) return;
        const tp = e.touches[0];
        dy = tp.clientY - y0;
        if (!dragging) {
          if (dy < -6 || Math.abs(tp.clientX - x0) > 10) { y0 = null; return; }   // 往上滑或左右滑：照常
          if (dy < 8) return;
          dragging = true;
          card.style.transition = "none";
        }
        e.preventDefault();
        card.style.transform = `translateY(${Math.max(0, dy)}px)`;
      }, { passive: false });
      card.addEventListener("touchend", () => {
        if (y0 === null) return;
        y0 = null;
        if (!dragging) return;
        dragging = false;
        card.style.transition = "transform .2s ease";
        if (dy > 90) {
          card.style.transform = "translateY(100%)";
          setTimeout(() => { closeModal(id); card.style.transform = ""; card.style.transition = ""; }, 180);
        } else {
          card.style.transform = "";
          setTimeout(() => { card.style.transition = ""; }, 200);
        }
      });
    });

    // keepHash：不要改网址（换页时用）；noBack：不要退回浏览记录（已经按了「返回」或要去别的地方）
    function closeModal(id, keepHash, noBack) {
      $(id).classList.add("hidden"); document.body.style.overflow = "";
      if (id === "detail") {
        openId = null; openPost = null; focusCid = null; editing = null;
        if (!keepHash && /^#p-/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + (view.mode === "user" ? "#u-" + view.uid : view.mode === "shop" ? "#shop" : ""));
      }
      // 📱 面板都关了：把打开时多记的那一步拿掉
      if (SHEETS.includes(id) && sheetPushed && !SHEETS.some(s => !$(s).classList.contains("hidden"))) {
        sheetPushed = false;
        if (!noBack) history.back();
      }
    }
    ["detail", "composer", "editor", "sharer", "reporter"].forEach(id => $(id).addEventListener("click", e => {
      if (e.target === $(id) || e.target.closest("[data-close]")) closeModal(id);
    }));

    async function openDetail(p) {
      openId = p.id; openPost = p; replyTo = null; comments = []; editing = null; replyOpen = false;
      $("detail").classList.remove("hidden"); document.body.style.overflow = "hidden";
      $("detail").querySelector(".modal-card").scrollTop = 0;
      sheetOpened();
      drawDetail(p, true);
      try {
        const snap = await getDocs(query(collection(db, "feedPosts", p.id, "comments"), orderBy("createdAt", "asc")));
        comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await loadProfiles(comments.filter(c => c.authorTier).map(c => c.authorUid));
      } catch (e) { console.warn("comments", e); }
      if (openId === p.id) { drawDetail(p); scrollToFocus(); }
    }
    // 铃铛「有人回复你」点进来：捲到那条回复并标出来
    function scrollToFocus() {
      if (!focusCid) return;
      const el = $("detailInner").querySelector(`.cmt[data-cid="${CSS.escape(focusCid)}"]`);
      if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 80);
    }

    function drawDetail(p, loading = false) {
      const w = who(p);
      const mine = me.user && p.authorUid === me.user.uid;

      $("detailInner").innerHTML = `
        ${sliderHTML(p.content.images, "detail-slider")}
        <div class="detail-body">
          <div class="detail-meta">
            <div class="who" data-author="${esc(authorKey(p))}">${avatarOf(w)}<div>
              <div class="nm">${esc(w.name)} ${tierMark(w)}</div>
              <div class="tm">${titleTag(w.title)}<span>${p.pinned ? esc(ft("pinned")) + " · " : ""}${fmtTime(p.createdAt)}${p.editedAt ? ` · <span class="edited-tag">${esc(ft("edited"))}</span>` : ""}</span></div></div></div>
            <div style="display:flex;align-items:center;gap:4px">
              <button class="xhs-like-btn${p.liked ? " liked" : ""}" data-dlike>${p.liked ? "❤️" : "🤍"} <span>${p.nLike}</span></button>
              ${moreHTML("post", "", canEdit(p), mine || isMod(), !isShop(p) && canReport(p.authorUid))}
            </div>
          </div>
          ${editing === "post" ? editBoxHTML(p.content.text || "")
            : p.content.text ? `<div class="detail-text">${esc(p.content.text)}</div>` : ""}
          <div class="cmt-head">💬 ${esc(ft("replies"))}${comments.length ? ` (${comments.length})` : ""}</div>
          <div>${loading ? `<p class="muted" style="font-size:.85rem">${esc(ft("loading"))}</p>` : comments.length ? comments.map(c => {
            const cw = who(c);
            return `
            <div class="cmt${c.id === focusCid ? " cmt-focus" : ""}" data-cid="${esc(c.id)}"><span data-author="${esc(authorKey(c))}">${avatarOf(cw)}</span>
              <div class="cmt-main">
                <div class="cmt-name"><span class="cmt-who" data-author="${esc(authorKey(c))}">${esc(cw.name)} ${tierMark(cw)}</span> ${titleTag(cw.title)}</div>
                ${editing === "c:" + c.id ? editBoxHTML(c.text || "")
                  : c.hidden ? `<div class="cmt-hidden">*** ${esc(ft("hiddenCmt"))}</div>`
                  : `<div class="cmt-text">${c.replyTo && c.replyTo.name ? `<span class="at">@${esc(c.replyTo.name)}</span> ` : ""}${esc(c.text)}</div>`}
                <div class="cmt-foot"><span>${fmtTime(c.createdAt)}${c.editedAt ? ` · ${esc(ft("edited"))}` : ""}</span>
                  ${canReply() ? `<button data-rto="${esc(c.id)}">${esc(ft("reply"))}</button>` : ""}
                  ${moreHTML("cmt", c.id, canEditCmt(c), (me.user && c.authorUid === me.user.uid) || isMod(), !c.hidden && canReport(c.authorUid))}
                </div>
              </div>
            </div>`; }).join("") : `<p class="muted" style="font-size:.85rem">${esc(ft("noReplies"))}</p>`}</div>
          <div class="reply-box">${replyBoxHTML()}</div>
        </div>`;
      if ($("rText")) {
        $("rText").value = drafts[p.id] || "";
        $("rText").oninput = () => { drafts[p.id] = $("rText").value; };
      }
      bindDetail(p);
    }

    function replyBoxHTML() {
      if (!me.member) return `<div class="cant"><a href="index.html">${esc(ft("hintGuestBtn"))}</a></div>`;
      if (!me.member.name) return `<div class="cant"><a href="profile.html">${esc(ft("hintName"))}</a></div>`;
      if (!me.bound && !me.internal && me.perm === "none") return `<div class="cant"><a href="profile.html#bind">${esc(ft("cantBind"))}</a></div>`;
      if (!canReply()) return `<div class="cant">${esc(ft("cantTier", { tier: tierName(cfg.replyRank ?? 0) }))}</div>`;
      if (!replyOpen) {
        const d = openId && drafts[openId];
        return `<button class="reply-pill" data-ropen>💬 ${d ? `<span class="dr">${esc(d)}</span>` : esc(ft("replyPh"))}</button>`;
      }
      return `<div class="reply-to">${replyTo ? `${esc(ft("replyTo", { name: replyTo.name }))}<button data-rcancel>${esc(ft("cancel"))}</button>` : ""}
          <button class="reply-close" data-rclose>${esc(ft("collapse"))} ▾</button></div>
        <div class="reply-row"><textarea id="rText" rows="1" maxlength="500" placeholder="${esc(ft("replyPh"))}"></textarea>
        <button class="btn btn-primary" id="rSend">${esc(ft("send"))}</button></div>`;
    }

    function bindDetail(p) {
      const inner = $("detailInner");
      // 点作者：先关掉帖子（拿掉多记的那一步），再去作者主页
      inner.querySelectorAll("[data-author]").forEach(el => el.onclick = () => {
        const key = el.dataset.author;
        const pushed = sheetPushed;
        closeModal("detail", true, true);
        if (pushed) { afterBack = () => goAuthor(key); history.back(); }
        else goAuthor(key);
      });
      const dl = inner.querySelector("[data-dlike]");
      if (dl) dl.onclick = () => toggleLike(p.id);
      // ⋯ 选单
      inner.querySelectorAll("[data-more]").forEach(b => b.onclick = e => {
        e.stopPropagation();
        const menu = inner.querySelector(`[data-menu="${CSS.escape(b.dataset.more)}"]`);
        const was = menu.classList.contains("hidden");
        inner.querySelectorAll(".more-menu").forEach(m => m.classList.add("hidden"));
        if (was) menu.classList.remove("hidden");
      });
      inner.querySelectorAll("[data-menu]").forEach(menu => {
        const [kind, cid] = menu.dataset.menu.split(":");
        menu.querySelectorAll("[data-mact]").forEach(b => b.onclick = async e => {
          e.stopPropagation();
          menu.classList.add("hidden");
          if (b.dataset.mact === "report") { openReport(p, kind === "post" ? null : comments.find(x => x.id === cid)); return; }
          if (b.dataset.mact === "edit") {
            editing = kind === "post" ? "post" : "c:" + cid;
            drawDetail(p);
            const ta = $("editText"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
            return;
          }
          if (kind === "post") {
            if (!confirm(ft("delPost"))) return;
            try { await deletePost(p.id); closeModal("detail"); cursors.length = 1; loadPage(1); }
            catch (err) { toast(ft("fail") + err.message); }
          } else {
            if (!confirm(ft("delCmt"))) return;
            try {
              await deleteDoc(doc(db, "feedPosts", p.id, "comments", cid));
              comments = comments.filter(x => x.id !== cid);
              p.nCmt = comments.length; drawDetail(p); render();
            } catch (err) { toast(ft("fail") + err.message); }
          }
        });
      });
      // 编辑：取消 / 保存
      const ec = inner.querySelector("[data-ecancel]");
      if (ec) ec.onclick = () => { editing = null; drawDetail(p); };
      const es = inner.querySelector("[data-esave]");
      if (es) es.onclick = async () => {
        const text = $("editText").value.trim();
        es.disabled = true;
        try {
          if (editing === "post") {
            if (!text && !(p.content.images || []).length) { toast(ft("editEmpty")); es.disabled = false; return; }
            // 需要审核的会员改了已公开（或被退回）的帖子 → 回到待审核
            const mineNow = p.authorUid === me.user.uid;
            const back = mineNow && !autoPublish() && p.status !== "pending";
            const batch = writeBatch(db);
            batch.update(doc(db, "feedPosts", p.id), back ? { editedAt: serverTimestamp(), status: "pending" } : { editedAt: serverTimestamp() });
            batch.update(doc(db, "feedPosts", p.id, "content", "main"), { text: text.slice(0, 2000) });
            await batch.commit();
            p.content.text = text; p.editedAt = new Date(); editing = null;
            if (back) {
              p.status = "pending";
              toast(ft("editReview"));
              closeModal("detail"); cursors.length = 1; loadPage(1); loadMyPosts();
              return;
            }
            toast(ft("editSaved"));
            drawDetail(p); render();
          } else {
            if (!text) { toast(ft("editEmpty")); es.disabled = false; return; }
            const cid = editing.slice(2);
            await updateDoc(doc(db, "feedPosts", p.id, "comments", cid), { text: text.slice(0, 500), editedAt: serverTimestamp() });
            const c = comments.find(x => x.id === cid);
            if (c) { c.text = text; c.editedAt = new Date(); }
            editing = null;
            toast(ft("editSaved"));
            drawDetail(p);
          }
        } catch (err) { toast(ft("fail") + err.message); es.disabled = false; }
      };
      inner.querySelectorAll("[data-rto]").forEach(b => b.onclick = () => {
        const c = comments.find(x => x.id === b.dataset.rto);
        replyTo = c ? { uid: c.authorUid, name: who(c).name } : null;
        replyOpen = true;
        drawDetail(p); $("rText") && $("rText").focus();
      });
      const ro = inner.querySelector("[data-ropen]");
      if (ro) ro.onclick = () => {
        replyOpen = true; drawDetail(p);
        const ta = $("rText"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      };
      const rx = inner.querySelector("[data-rclose]");
      if (rx) rx.onclick = () => { replyOpen = false; replyTo = null; drawDetail(p); };
      const rc = inner.querySelector("[data-rcancel]");
      if (rc) rc.onclick = () => { replyTo = null; drawDetail(p); };
      const send = $("rSend");
      if (send) send.onclick = async () => {
        const text = $("rText").value.trim();
        if (!text) return;
        send.disabled = true;
        const data = {
          authorUid: me.user.uid, authorName: me.member.name || "", authorTier: me.member.tier || "mochii",
          authorTitle: me.title, text, postAuthorUid: p.authorUid, createdAt: serverTimestamp(),
        };
        if (replyTo) { data.replyTo = replyTo; data.replyToUid = replyTo.uid; }
        try {
          const ref = doc(collection(db, "feedPosts", p.id, "comments"));
          await setDoc(ref, data);
          comments.push({ id: ref.id, ...data, createdAt: new Date() });
          p.nCmt = comments.length; replyTo = null; replyOpen = false; drafts[p.id] = "";
          drawDetail(p); render();
          // 捲到刚送出的回复，不被下面的输入框挡住
          const el = $("detailInner").querySelector(`.cmt[data-cid="${CSS.escape(ref.id)}"]`);
          if (el) {
            el.classList.add("cmt-focus");
            setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 60);
            setTimeout(() => el.classList.remove("cmt-focus"), 2500);
          }
        } catch (e) { toast(ft("fail") + e.message); send.disabled = false; }
      };
    }

    // ---------- 🚩 检举（后台审核；通过后留言变成 ***、帖子下架） ----------
    const REASONS = [["spam", "rSpam"], ["abuse", "rAbuse"], ["inappropriate", "rInapp"], ["other", "rOther"]];
    function openReport(p, c) {
      const box = $("reportInner");
      box.innerHTML = `<h2>🚩 ${esc(ft(c ? "reportTitleCmt" : "reportTitlePost"))}</h2>
        <div class="muted" style="font-size:.84rem">${esc(ft("reportWhy"))}</div>
        <div class="report-reasons">${REASONS.map(([v, k]) => `<label><input type="radio" name="rpWhy" value="${v}"> ${esc(ft(k))}</label>`).join("")}</div>
        <textarea id="rpNote" maxlength="200" rows="2" placeholder="${esc(ft("reportNote"))}"></textarea>
        <button class="btn btn-primary" id="rpSend" style="width:100%;margin-top:10px">${esc(ft("reportSend"))}</button>`;
      $("reporter").classList.remove("hidden");
      $("rpSend").onclick = async () => {
        const why = box.querySelector("input[name=rpWhy]:checked");
        if (!why) { toast(ft("reportPick")); return; }
        const key = c ? `c_${p.id}_${c.id}` : `p_${p.id}`;
        const ref = doc(db, "feedReports", key + "_" + me.user.uid);
        $("rpSend").disabled = true;
        try {
          if ((await getDoc(ref)).exists()) { toast(ft("reportDup")); closeReport(); return; }
          await setDoc(ref, {
            kind: c ? "comment" : "post", postId: p.id, commentId: c ? c.id : "", targetKey: key,
            targetUid: (c || p).authorUid || "", reporterUid: me.user.uid, reason: why.value,
            note: $("rpNote").value.trim().slice(0, 200),
            text: String(c ? c.text : (p.content && p.content.text) || "").slice(0, 2000),
            status: "open", createdAt: serverTimestamp(),
          });
          toast(ft("reportThanks"));
          closeReport();
        } catch (e) { toast(ft("fail") + e.message); $("rpSend").disabled = false; }
      };
    }
    function closeReport() {
      $("reporter").classList.add("hidden");
      if (!$("detail").classList.contains("hidden")) document.body.style.overflow = "hidden";   // 帖子还开着
    }
    $("reporter").addEventListener("click", e => {
      if (e.target === $("reporter") || e.target.closest("[data-close]")) closeReport();
    });

    // 从铃铛点进来（feed.html#p-帖子ID）：直接打开那篇
    async function openFromHash() {
      const m = location.hash.match(/^#p-([\w-]+?)(?:~([\w-]+))?$/);
      if (!m) return;
      focusCid = m[2] || null;
      if (openId === m[1]) { drawDetail(openPost); scrollToFocus(); return; }
      let p = shown.find(x => x.id === m[1]);
      if (!p) {
        try {
          const s = await getDoc(doc(db, "feedPosts", m[1]));
          if (!s.exists()) return;
          p = { id: s.id, ...s.data() };
          if (!isShop(p)) await loadProfiles([p.authorUid]);
          await withExtras(p);
        } catch (e) { console.warn("openFromHash", e); return; }
      }
      if (p.visible) openDetail(p);
    }

    async function deletePost(id) {
      const batch = writeBatch(db);
      batch.delete(doc(db, "feedPosts", id, "content", "main"));
      batch.delete(doc(db, "feedPosts", id));
      await batch.commit();
    }

    // ---------- 发帖 ----------
    let pics = [];
    function drawPics() {
      $("cPics").innerHTML = pics.map((p, i) => `<div class="post-pic"><img src="${p.full}" alt=""><button type="button" data-rm="${i}">✕</button></div>`).join("")
        + (pics.length < MAX_PICS ? `<button type="button" class="post-add" id="cAdd">${esc(ft("addPic"))}</button>` : "");
      const add = $("cAdd"); if (add) add.onclick = () => $("cFile").click();
      $("cPics").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { pics.splice(+b.dataset.rm, 1); drawPics(); });
    }
    $("cFile").onchange = async e => {
      const files = [...e.target.files].slice(0, MAX_PICS - pics.length);
      e.target.value = "";
      for (const f of files) { try { pics.push({ full: await compressImage(f, 960), file: f }); } catch (err) {} }
      drawPics();
    };
    $("fab").onclick = () => {
      $("cNote").textContent = ft(autoPublish() ? "postDirect" : "postReview");
      $("cMsg").textContent = "";
      drawPics();
      $("composer").classList.remove("hidden"); document.body.style.overflow = "hidden";
      sheetOpened();
      $("cText").focus();
    };
    $("cSend").onclick = async () => {
      const text = $("cText").value.trim();
      const setMsg = (s, type) => { $("cMsg").textContent = s; $("cMsg").className = "msg " + (type || ""); };
      if (!text && !pics.length) { setMsg(ft("needText"), "err"); return; }
      $("cSend").disabled = true;
      const direct = autoPublish();
      try {
        const ref = doc(collection(db, "feedPosts"));
        const batch = writeBatch(db);
        batch.set(ref, {
          type: "normal", status: direct ? "published" : "pending", minRank: 0,
          authorUid: me.user.uid, authorName: me.member.name || "", authorTier: me.member.tier || "mochii",
          authorTitle: me.title, thumb: pics.length ? await compressImage(pics[0].file, 24) : "",
          imageCount: pics.length, pinned: false, createdAt: serverTimestamp(),
        });
        batch.set(doc(db, "feedPosts", ref.id, "content", "main"), { text, images: pics.map(p => p.full) });
        await batch.commit();
        $("cText").value = ""; pics = [];
        closeModal("composer");
        toast(ft(direct ? "posted" : "sentReview"));
        if (direct) { cursors.length = 1; loadPage(1); } else loadMyPosts();
      } catch (e) {
        setMsg(ft("fail") + e.message + (/size|exceed|too large/i.test(e.message) ? " " + ft("tooBig") : ""), "err");
      } finally { $("cSend").disabled = false; }
    };

    // ---------- 我的头像与简介 ----------
    let draftAvatar = "";
    // 上传的照片：裁成正方形中间，缩到 200px
    function squareAvatar(file, size = 200) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(img.width, img.height);
          const c = document.createElement("canvas");
          c.width = c.height = size;
          c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          let url = c.toDataURL("image/webp", 0.82);
          if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", 0.85);
          URL.revokeObjectURL(img.src);
          resolve(url);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    function drawEditor() {
      const w = { name: me.member.name, tier: me.member.tier || "mochii", avatar: draftAvatar };
      $("eNow").innerHTML = avatarOf(w);
      $("ePick").innerHTML = PRESETS.map((_, i) => `<button type="button" data-p="p:${i}" class="${draftAvatar === "p:" + i ? "on" : ""}">${avatarOf({ avatar: "p:" + i })}</button>`).join("");
      $("ePick").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { draftAvatar = b.dataset.p; drawEditor(); });
      $("eUpload").disabled = !canUpload();
      $("eNeedBind").classList.toggle("hidden", canUpload());
      $("eBioCount").textContent = $("eBio").value.length + " / 60";
    }
    function openEditor() {
      if (!me.member) return;
      draftAvatar = (me.feed && me.feed.avatar) || "";
      $("eBio").value = (me.feed && me.feed.bio) || "";
      $("eMsg").textContent = "";
      drawEditor();
      $("editor").classList.remove("hidden"); document.body.style.overflow = "hidden";
      sheetOpened();
    }
    $("eBio").addEventListener("input", () => { $("eBioCount").textContent = $("eBio").value.length + " / 60"; });
    $("eLetter").onclick = () => { draftAvatar = ""; drawEditor(); };
    $("eUpload").onclick = () => $("eFile").click();
    $("eFile").onchange = async e => {
      const f = e.target.files[0]; e.target.value = "";
      if (!f) return;
      try { draftAvatar = await squareAvatar(f); drawEditor(); } catch (err) { toast(ft("fail") + err.message); }
    };
    $("eSave").onclick = async () => {
      $("eSave").disabled = true;
      try {
        await syncMyFeed({ avatar: draftAvatar, bio: $("eBio").value.trim().slice(0, 60) });
        closeModal("editor");
        toast(ft("saved"));
        await renderProfileHead();
        if (view.mode !== "all") { cursors.length = 1; await loadPage(1); } else render();
      } catch (e) {
        $("eMsg").textContent = ft("fail") + e.message; $("eMsg").className = "msg err";
      } finally { $("eSave").disabled = false; }
    };

    // ---------- 开始 ----------
    let started = false;
    onAuthStateChanged(auth, async user => {
      if (started) return;   // 只在第一次判断身份；登入、登出都会换页
      started = true;
      try { await loadMe(user); } catch (e) { console.warn("loadMe", e); }
      renderTop();
      document.body.classList.remove("loading");
      loadMyPosts();
      await route();
    });
  </script>
</body>
</html>
