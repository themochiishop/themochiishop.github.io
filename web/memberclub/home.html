<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="home.pageTitle">Home · Mochii Club</title>
  <link rel="stylesheet" href="css/member.css">
  <script src="js/theme-init.js"></script>
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <p id="pageError" class="msg err hidden"></p>
    <!-- 各区块的顺序、开关、数量由后台「首页设定」决定 -->
    <div id="homeSections"></div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, query, where, getDocs, getDoc, doc, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, tierProgress, tierLabel, tierIconHTML, lockOverlayHTML, lockState, startLockTicker,
      toDate, fmtDate, fmtMoney, esc, platformTag, t, lang, endState, isInternalMember, redeemCode, prizeDeadline, patchMemberCache,
      loadPerks, toast
    } from "./js/common.js";
    import * as NM from "./js/newmember.js";   // 🎉 新会员奖励
    import * as CI from "./js/checkin.js";     // 📅 每日签到

    const $ = id => document.getElementById(id);
    renderNav("home");

    // 和后台 admin-common.js 的 HOME_SECTIONS 一致
    const DEFAULT_SECTIONS = [
      { key: "hero", on: true },
      { key: "banners", on: true },
      { key: "order", on: true },
      { key: "news", on: true, count: 3 },
      { key: "rewards", on: true, count: 4 },
    ];

    const safeLink = u => {
      u = String(u || "").trim();
      if (/^https:\/\//i.test(u) || /^[a-z0-9_-]+\.html(#[\w-]*)?$/i.test(u)) return u;
      return "";
    };
    const loc = x => ((x.i18n && x.i18n[lang]) || {});

    requireMember(async (user, member) => {
      const mine = c => getDocs(query(collection(db, c), where("uid", "==", user.uid)));
      let cfg = {}, bal, oSnap, rSnap, bnSnap, nSnap, pzSnap, nmReward = null, perks = {}, ciState = null;
      try {
        const sSnap = await getDoc(doc(db, "settings", "home")).catch(() => null);
        cfg = sSnap && sSnap.exists() ? sSnap.data() : {};
        [bal, oSnap, rSnap, bnSnap, nSnap, pzSnap] = await Promise.all([
          loadBalance(user.uid),
          mine("orders"),
          getDocs(query(collection(db, "rewards"), where("active", "==", true))),
          getDocs(collection(db, "homeBanners")).catch(() => ({ docs: [] })),
          getDocs(query(collection(db, "homeNews"), orderBy("createdAt", "desc"), limit(30))).catch(() => ({ docs: [] })),
          mine("prizeWins").catch(() => ({ docs: [] })),
          NM.loadSettings(),
        ]);
        // 📅 每日签到：后台有开才读自己的签到状态
        perks = await loadPerks();
        if (CI.settingsOf(perks).active) ciState = await CI.loadState(user.uid);
        // 🎉 新会员奖励：刚注册的会员先确认资格；已兑换的读那一笔的状态
        member = await NM.ensureFresh(user, member);
        if (member.nmr && member.nmr.rid) nmReward = await NM.loadReward(member.nmr.rid);
      } catch (e) {
        $("pageError").textContent = t("common.loadFail") + e.message;
        $("pageError").classList.remove("hidden");
        return;
      }

      const sections = (cfg.sections && cfg.sections.length ? cfg.sections : DEFAULT_SECTIONS);
      const rewards = rSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => !(endState(r) || {}).ended);
      const rewardById = Object.fromEntries(rewards.map(r => [r.id, r]));
      const now = new Date();

      const R = {
        // ---------- 你好 + 积分 + 等级 ----------
        hero() {
          const tp = tierProgress(member);
          // 右边 Feed 框（文字、链接在后台「首页设定」设定）
          const feed = cfg.feed || {};
          const fl = loc(feed);
          const feedHref = feed.link === undefined ? "feed.html" : safeLink(feed.link);   // 后台没设定过：预设导向 Mochii Feed
          const feedBox = feed.on === false ? "" : `
            <${feedHref ? `a href="${esc(feedHref)}"` : "div"} class="home-feed${feedHref ? "" : " no-link"}">
              <div class="feed-title">${esc(fl.title || feed.title || t("home.feedTitle"))}</div>
              <div class="feed-text">${esc(fl.text || feed.text || t("home.feedText"))}</div>
              <span class="feed-go" aria-hidden="true">➔</span>
            </${feedHref ? "a" : "div"}>`;
          return `<div class="home-top${feedBox ? "" : " solo"}">
            <a class="shop-hero home-hero" href="account.html">
              <img src="img/member.jpg" alt="">
              <div style="flex:1;min-width:0">
                <div class="sub">${esc(t("acc.hello", { name: member.name || t("acc.member") }))}</div>
                <div class="pts-big">${esc(t("unit.pts", { n: bal.spendable.toLocaleString() }))}</div>
                <div class="sub">${tp.tier.id !== "mochii" ? tierIconHTML(tp.tier) + " " : ""}${esc(tierLabel(tp.tier))}${bal.pending ? " · " + esc(t("home.pending", { n: bal.pending.toLocaleString() })) : ""}</div>
              </div>
              <span class="home-hero-go">➔</span>
            </a>
            ${feedBox}
          </div>`;
        },

        // ---------- 横幅 ----------
        banners() {
          const list = bnSnap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(b => b.active !== false && b.image)
            .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));
          if (!list.length) return "";
          return `
            <div class="home-banners">
              ${list.map(b => {
                const href = safeLink(b.link);
                const img = `<img src="${esc(b.image)}" alt="${esc(loc(b).title || b.title || "")}" loading="lazy">`;
                return href ? `<a class="home-banner" href="${esc(href)}">${img}</a>` : `<div class="home-banner">${img}</div>`;
              }).join("")}
            </div>`;
        },

        // ---------- 最新一张订单 ----------
        order() {
          const orders = oSnap.docs.map(d => ({ id: d.id, ...d.data() }))
            .map(o => ({ ...o, orderTime: toDate(o.orderTime), availableAt: toDate(o.availableAt) }))
            .sort((a, b) => (b.orderTime || 0) - (a.orderTime || 0));
          const o = orders[0];
          let body;
          if (!o && isInternalMember(member)) {
            body = `<p class="muted" style="font-size:.88rem">${t("home.noOrderInternal")}</p>`;
          } else if (!o) {
            body = `<p class="muted" style="font-size:.88rem">${t("home.noOrder")}</p>
                    <a href="bind.html" class="btn btn-primary btn-inline" style="margin-top:10px">${t("acc.goBind")}</a>`;
          } else {
            let state;
            if (o.status === "refunded") state = `<span class="tag tag-bad">${t("tag.refunded")}</span>`;
            else if (o.availableAt && o.availableAt > now) state = `<span class="tag tag-pending">${t("tag.pending")}</span>`;
            else state = `<span class="tag tag-ok">${t("tag.credited")}</span>`;
            body = `
              <div class="home-order">
                <div style="min-width:0">
                  <div class="title">${platformTag(o.platform)} ${fmtMoney(o.amount)} ${state}</div>
                  <div class="meta">${esc(o.username)} · ${fmtDate(o.orderTime, true)}</div>
                  ${o.status !== "refunded" && o.availableAt && o.availableAt > now
                    ? `<div class="meta">${esc(t("notif.pendingUntil", { d: fmtDate(o.availableAt) }))}</div>` : ""}
                </div>
                <div class="home-order-pts">${o.status === "refunded" ? "0" : "+" + (o.points || 0)}<small>${t("home.ptsEarned")}</small></div>
              </div>`;
          }
          return `
            <div class="card">
              <div class="card-head"><h2>🧾 ${t("home.latestOrder")}</h2><a class="head-go" href="points.html#orders" aria-label="${esc(t("home.viewAll"))}" title="${esc(t("home.viewAll"))}">➔</a></div>
              ${body}
            </div>`;
        },

        // ---------- 俱乐部消息（首页专用） ----------
        news(sec) {
          const list = nSnap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(n => n.active !== false)
            .slice(0, sec.count || 3);
          if (!list.length) return "";
          return `
            <div class="card">
              <div class="card-head"><h2>📣 ${t("home.news")}</h2></div>
              <ul class="home-news">
                ${list.map(n => {
                  const rw = n.rewardId ? rewardById[n.rewardId] : null;
                  const img = n.image || (rw && rw.image) || "";
                  const href = safeLink(n.link) || (n.rewardId ? "shop.html" : "");
                  const title = loc(n).title || n.title || (rw ? rw.name : "");
                  const body = loc(n).body || n.body || "";
                  const inner = `
                    ${img ? `<img class="news-img" src="${esc(img)}" alt="" loading="lazy">`
                          : rw ? `<span class="news-img news-icon">${rw.type === "coupon" ? "🎫" : "🎁"}</span>` : ""}
                    <div class="news-body">
                      <div class="title">${esc(title)}</div>
                      ${body ? `<div class="news-text">${esc(body)}</div>` : ""}
                      ${rw ? `<div class="news-reward">${esc(rw.name)} · <b>${esc(t("unit.pts", { n: Number(rw.cost).toLocaleString() }))}</b></div>` : ""}
                      <div class="meta">${fmtDate(toDate(n.createdAt))}${href ? ` · <span class="news-more">${t("notif.open")}</span>` : ""}</div>
                    </div>`;
                  return `<li>${href ? `<a class="news-item" href="${esc(href)}">${inner}</a>` : `<div class="news-item">${inner}</div>`}</li>`;
                }).join("")}
              </ul>
            </div>`;
        },

        // ---------- 最新上架的兑换商品 ----------
        rewards(sec) {
          // 预设按创建时间（最新在前）；后台「首页设定」可以自订顺序，之后新增的奖品自动排在最上面
          const byNew = (a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0);
          const nr = cfg.newRewards || {};
          let list = rewards.slice().sort(byNew);
          if (nr.mode === "custom" && Array.isArray(nr.order)) {
            const pos = Object.fromEntries(nr.order.map((id, i) => [id, i]));
            list = [...list.filter(r => !(r.id in pos)), ...list.filter(r => r.id in pos).sort((a, b) => pos[a.id] - pos[b.id])];
          }
          list = list.slice(0, sec.count || 4);
          if (!list.length) return "";
          return `
            <div class="card">
              <div class="card-head"><h2>✨ ${t("home.newRewards")}</h2><a class="head-go" href="shop.html" aria-label="${esc(t("home.viewAll"))}" title="${esc(t("home.viewAll"))}">➔</a></div>
              <div class="shop-grid home-new">
                ${list.map(r => `
                  <a class="shop-item${lockState(r) ? " locked" : ""}" href="shop.html#i-${esc(r.id)}" style="color:inherit;text-decoration:none">
                    <div class="ph">${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">` : (r.type === "coupon" ? "🎫" : "🎁")}${lockOverlayHTML(r)}</div>
                    <div class="info">
                      <div class="name">${esc(r.name)}</div>
                      <div class="cost">${t("unit.pts", { n: Number(r.cost).toLocaleString() })}</div>
                    </div>
                  </a>`).join("")}
              </div>
            </div>`;
        },
      };

      // ---------- 🏆 中奖领取：有进行中的奖品才显示，固定在最上面（不受「首页设定」影响） ----------
      function prizeBox() {
        const PZ_TAG = { unclaimed: "tag-pending", claimed: "tag-pending", approved: "tag-ship", shipped: "tag-ship" };
        const list = pzSnap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(p => PZ_TAG[p.status])
          .sort((a, b) => (a.status === "unclaimed" ? 0 : 1) - (b.status === "unclaimed" ? 0 : 1)
            || (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
        if (!list.length) return "";
        const todo = list.some(p => p.status === "unclaimed");
        return `
          <div class="card prize-card home-prize${todo ? " has-todo" : ""}">
            <div class="card-head"><h2>${t("pz.title")}</h2><a class="head-go" href="prizes.html" aria-label="${esc(t("home.viewAll"))}">➔</a></div>
            <ul class="home-pz">
              ${list.map(p => {
                const dlv = p.delivery === "separate" ? "separate" : "withOrder";
                return `<li><a href="prizes.html" class="home-pz-item">
                  ${p.prizeImage ? `<img class="redeem-thumb" src="${esc(p.prizeImage)}" alt="" loading="lazy">` : `<span class="redeem-thumb">🏆</span>`}
                  <div class="redeem-body">
                    <div class="title">${esc(p.prizeName)} <span class="tag ${PZ_TAG[p.status]}">${t("pz.st." + p.status)}</span></div>
                    <div class="meta">${dlv === "separate" ? "🚚" : "📦"} ${t("pz.dlv." + dlv)}${p.drawMonth ? " · " + esc(p.drawMonth) : ""}</div>
                    ${p.status === "unclaimed" && prizeDeadline(p) ? `<div class="meta pz-deadline${prizeDeadline(p) - Date.now() <= 7 * 86400000 ? " soon" : ""}" style="margin-top:2px">⏰ ${esc(t("pz.deadline", { d: fmtDate(prizeDeadline(p)) }))}</div>` : ""}
                  </div>
                  <span class="home-pz-go ${p.status === "unclaimed" ? "btn btn-primary btn-inline btn-xs" : ""}">${p.status === "unclaimed" ? t("pz.claim") : "➔"}</span>
                </a></li>`;
              }).join("")}
            </ul>
          </div>`;
      }

      // 📍 管理员改成单独寄出、等会员填地址的兑换
      function addrBox() {
        const list = (bal.redemptions || []).filter(r => r.addrPending === true && ["approved", "problem"].includes(r.status));
        if (!list.length) return "";
        return `<a class="home-addr" href="rewards.html${list.length === 1 ? "#r-" + esc(list[0].id) : ""}">
          <span>${esc(t("home.needAddr", { n: list.length }))}</span><span class="go">➔</span></a>`;
      }
      // 🎉 新会员奖励：还没兑换显示活动小卡；兑换后显示状态卡（固定在上面，不受「首页设定」影响）
      const nmState = NM.stateOf(member);
      const nmBound = oSnap.docs.length > 0 || (bal.ledger || []).some(x => x.reason === "新会员欢迎礼");
      const nmBox = () => NM.homeCardHTML(nmState, { bound: nmBound, reward: nmReward });
      // 📅 每日签到卡片：放在「你好 + 积分」下面（首页设定关掉那一区时，放在最上面）
      const ciSet = CI.settingsOf(perks);
      const ciBox = () => CI.cardHTML(ciSet, ciState, { bound: nmBound || isInternalMember(member), preview: !!user.isPreview });
      const draw = () => {
        const shown = sections.filter(s => s.on !== false && R[s.key]);
        const hasHero = shown.some(s => s.key === "hero");
        $("homeSections").innerHTML = addrBox() + prizeBox() + nmBox() + (hasHero ? "" : ciBox()) + shown
          .map(s => R[s.key](s) + (s.key === "hero" ? ciBox() : ""))
          .join("");
      };
      $("homeSections").addEventListener("click", async e => {
        if (CI.onToggle(e)) return;   // 📱 手机版签到条：展开 / 收起
        const b = e.target.closest("[data-checkin]");
        if (!b || b.disabled) return;
        b.disabled = true;
        try {
          const r = await CI.checkIn();
          ciState = CI.stateAfter(r, ciState);
          if (!r.already && r.pts > 0) bal.spendable += r.pts;   // 积分马上加到上面的总数
          toast(r.already ? "✅ " + CI.ct("done") : r.pts > 0 ? CI.ct("got", { n: r.pts }) : CI.ct("gotZero"));
          if (r.milestone && r.milestone.points > 0) bal.spendable += r.milestone.points;   // 🏅 签到达人积分
          draw();
          if (r.milestone) CI.showMilestone(r);   // 🎉 签到达人弹窗
        } catch (err) { toast(CI.errText(err)); b.disabled = false; }
      });
      // 键盘：在签到条上按 Enter / 空白键也能展开
      $("homeSections").addEventListener("keydown", e => {
        if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-ci-open]")) { e.preventDefault(); e.target.click(); }
      });
      draw();
      startLockTicker(id => rewardById[id], draw);
      if (NM.shouldPopup(user, member, nmState)) {
        NM.showPopup(user, { bound: nmBound,
          onPatch: p => patchMemberCache(user.uid, { nmr: { ...(member.nmr || {}), ...p } }) });
      }   // 🔒 未开放的倒数，时间到自动开放
    });
  </script>
</body>
</html>
