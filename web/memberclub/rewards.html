<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="rw.pageTitle">Rewards · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
  <script src="js/theme-init.js"></script>
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 data-i18n="rw.title"></h1>
    <p class="muted" data-i18n="rw.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <div class="stats">
      <div class="stat main">
        <div class="label" data-i18n="acc.available"></div>
        <div class="value" id="spendable">-</div>
        <div class="sub" id="reservedNote">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="label" data-i18n="acc.pending"></div>
        <div class="value" id="pending">-</div>
        <div class="sub" data-i18n="rw.pendingSub"></div>
      </div>
    </div>

    <a href="shop.html" class="btn btn-primary" style="margin-bottom:16px" data-i18n="rw.goShop"></a>

    <!-- 🏆 有中奖奖品待领取时的小提示（领取在「中奖记录」页） -->
    <a id="pzBanner" class="pz-banner hidden" href="prizes.html"><span id="pzBannerText"></span><b data-i18n="rw.prizeBannerGo"></b></a>

    <div class="card">
      <h2 class="dash-head" data-i18n="rw.mine"></h2>
      <ul id="myList" class="list"><li class="empty" data-i18n="common.loading"></li></ul>
    </div>
  </main>

  <!-- ✅ 确认收货 -->
  <div id="rcvModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 data-i18n="gift.confirmTitle"></h2>
      <p class="muted" style="font-size:.85rem;margin-bottom:12px" data-i18n="gift.confirmSub"></p>
      <label><span data-i18n="gift.photo"></span>
        <input type="file" id="rcvFile" accept="image/*">
      </label>
      <div id="rcvPrevBox" class="hidden" style="margin:-6px 0 12px"><img id="rcvPrev" class="rcv-prev" alt=""></div>
      <label><span data-i18n="gift.comment"></span>
        <textarea id="rcvComment" rows="2" maxlength="200"></textarea>
      </label>
      <p id="rcvMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="rcvSubmit" data-i18n="gift.confirmBtn"></button>
    </div>
  </div>

  <!-- 📍 修改这笔兑换的收货地址 -->
  <div id="eaModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 id="eaTitle"></h2>
      <div id="eaReward" class="muted" style="font-size:.85rem;margin-bottom:8px"></div>
      <div class="ea-opt-h" id="eaDefH"></div>
      <ul id="eaList" class="addr-list"></ul>
      <button type="button" class="btn btn-ghost ea-new" id="eaNew"></button>
      <div id="eaForm" class="hidden">
        <div id="eaFields"></div>
        <label class="inline" id="eaSaveRow"><input type="checkbox" id="eaSave" checked> <span data-i18n="addr.saveToBook"></span></label>
      </div>
      <p id="eaMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="eaSubmit" style="width:100%" data-i18n="gift.confirmAddr"></button>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      doc, updateDoc, collection, getDocs, serverTimestamp, query, where, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, esc, fmtDate, t, tn, toDate,
      giftStep, GIFT_STEPS, addressHTML, AUTO_COMPLETE_DAYS, compressImage, redeemCode, DETAIL_COLLAPSE_DAYS,
      deliveryOf, MAX_ADDRESSES, invalidateMemberCache
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, addressCardHTML, saveAddresses } from "./js/address.js";
    import * as NM from "./js/newmember.js";   // 🎉 新会员奖励

    const $ = id => document.getElementById(id);
    renderNav("rewards");

    const STATUS_CLASS = { pending: "tag-pending", approved: "tag-ok", rejected: "tag-bad", cancelled: "",
      shipped: "tag-ship", problem: "tag-pending", completed: "tag-ok" };
    const statusTag = r => {
      let key = "rw.st." + r.status;
      if (r.kind === "gift" && r.status === "approved") key = "gift.st.toShip";
      if (r.status === "shipped" || r.status === "problem" || r.status === "completed") key = "gift.st." + r.status;
      if (r.status === "cancelled" && r.adminCancelled) key = "gift.st.adminCancelled";
      return `<span class="tag ${STATUS_CLASS[r.status] || ""}">${t(key)}</span>`;
    };

    document.querySelectorAll(".modal").forEach(m => {
      m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.classList.add("hidden"); });
    });

    requireMember((user, member) => {
      let bal = null;
      const rewardInfo = {};   // 奖品 ID → 图片 / 类型（下架的也读得到）

      async function load() {
        try {
          const [b, rSnap] = await Promise.all([loadBalance(user.uid), getDocs(collection(db, "rewards")), NM.loadSettings()]);
          bal = b;
          rSnap.docs.forEach(d => { rewardInfo[d.id] = d.data(); });
          render();
        } catch (e) {
          $("pageError").textContent = t("common.loadFail") + e.message;
          $("pageError").classList.remove("hidden");
        }
      }

      // 💡 优惠码使用提示：奖品资料的 couponFormat 记着是哪个平台的券（自订格式 / 找不到 → 两个平台都写）
      function codeHint(r) {
        const p = { shopee: "Shopee", tiktok: "TikTok" }[(rewardInfo[r.rewardId] || {}).couponFormat];
        return p ? t("rw.codeHint", { p }) : t("rw.codeHintAny");
      }

      // 商品图片：没有图片就显示类型图标
      function thumb(r) {
        // 🎉 迎新礼：图片在活动设定里
        if (NM.isNmRedemption(r)) {
          const s = NM.peekSettings() || {};
          const img = s.gift && s.gift.image;
          return img ? `<img class="redeem-thumb" src="${esc(img)}" alt="" loading="lazy">` : `<span class="redeem-thumb">🎁</span>`;
        }
        const info = rewardInfo[r.rewardId] || {};
        return info.image
          ? `<img class="redeem-thumb" src="${esc(info.image)}" alt="" loading="lazy">`
          : `<span class="redeem-thumb">${info.type === "coupon" || r.kind === "coupon" ? "🎫" : "🎁"}</span>`;
      }

      // ---------- 📦 实体奖品：进度条 + 物流 ----------
      function giftBlock(r) {
        if (r.kind !== "gift" || r.status === "rejected" || r.status === "cancelled") {
          return r.kind === "gift" && r.address ? `<div class="gift-addr muted">📍 ${addressHTML(r.address)}</div>` : "";
        }
        // 单独寄出：「已通过」后面多一步「填写地址」
        const sep = deliveryOf(r) === "separate";
        const waitAddr = r.addrPending === true && ["approved", "problem"].includes(r.status);
        const keys = sep ? ["pending", "approved", "address", "shipped", "received", "completed"] : GIFT_STEPS;
        let step = giftStep(r);
        if (sep && step >= 1) step += 1;   // 已通过 → 停在「填写地址」那一步；之后每一步往后推一格
        const dates = sep
          ? [r.createdAt, r.decidedAt, waitAddr ? null : (toDate(r.addressUpdatedAt) || r.decidedAt), toDate(r.shippedAt), toDate(r.receivedAt) || toDate(r.completedAt), toDate(r.completedAt)]
          : [r.createdAt, r.decidedAt, toDate(r.shippedAt), toDate(r.receivedAt) || toDate(r.completedAt), toDate(r.completedAt)];
        const bar = `
          <div class="gift-steps${sep ? " six" : ""}">
            ${keys.map((k, i) => `
              <div class="gstep${i < step || (i === step && !(waitAddr && k === "address")) ? " done" : ""}${i === step ? " now" : ""}${waitAddr && k === "address" ? " ask" : ""}">
                <span class="dot"></span>
                <span class="lbl">${t("gift.step." + k)}</span>
                <span class="dt">${i <= step && dates[i] ? fmtDate(dates[i]).slice(0, 5) : ""}</span>
              </div>`).join("")}
          </div>`;
        const sh = r.shipping || {};
        const doneAt = toDate(r.receivedAt) || toDate(r.completedAt);
        const old = r.status === "completed" && doneAt && (Date.now() - doneAt) > DETAIL_COLLAPSE_DAYS * 86400000;
        const url = /^https:\/\//i.test(sh.trackingUrl || "") ? sh.trackingUrl : "";
        const ship = r.shippedAt && sh.withOrder ? `
          <div class="gift-ship">
            <div class="ship-line">${esc(t("gift.withOrderDone"))}${sh.orderNo ? ` <span class="mono small-break">${esc(sh.orderNo)}</span>` : ""}</div>
            ${(sh.photos || []).length ? `<div class="gift-photos">${sh.photos.map(p => `<img src="${esc(p)}" alt="" loading="lazy" data-zoom>`).join("")}</div>` : ""}
            ${sh.note ? `<div class="small">💬 ${esc(tn(sh.note, sh.noteI18n))}</div>` : ""}
          </div>` : r.shippedAt ? `
          <div class="gift-ship">
            <div class="ship-line">🚚 <b>${esc(sh.carrierName || "")}</b>
              ${sh.trackingNo ? `<span class="mono small-break">${esc(sh.trackingNo)}</span>
              <button class="btn btn-ghost btn-inline btn-xs" data-copy="${esc(sh.trackingNo)}">${t("rw.copy")}</button>` : ""}</div>
            ${url ? (old
              ? `<div class="track-link disabled">🔗 ${t("gift.track")}</div>`
              : `<a class="track-link" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${t("gift.track")} <span class="url">${esc(url)}</span></a>`) : ""}
            ${sh.weightKg || (sh.dims && sh.dims.l) ? `<div class="muted small">📦 ${sh.weightKg ? esc(sh.weightKg) + " kg" : ""}${sh.dims && sh.dims.l ? ` · ${esc(sh.dims.l)}×${esc(sh.dims.w)}×${esc(sh.dims.h)} cm` : ""}</div>` : ""}
            ${(sh.photos || []).length ? `<div class="gift-photos">${sh.photos.map(p => `<img src="${esc(p)}" alt="" loading="lazy" data-zoom>`).join("")}</div>` : ""}
            ${sh.note ? `<div class="small">💬 ${esc(tn(sh.note, sh.noteI18n))}</div>` : ""}
          </div>` : "";
        const problem = r.status === "problem" ? `<div class="gift-problem">⚠️ ${esc(t("gift.problem"))}${r.problemNote ? "：" + esc(r.problemNote) : ""}</div>` : "";
        const auto = r.status === "shipped" && r.shippedAt
          ? `<div class="muted gift-auto">${esc(t("gift.autoNote", { d: fmtDate(new Date(toDate(r.shippedAt).getTime() + AUTO_COMPLETE_DAYS * 86400000)) }))}</div>` : "";
        const rc = r.receipt || {};
        const receipt = r.status === "completed" ? `
          <div class="gift-receipt">${r.autoCompleted ? "✅ " + esc(t("gift.autoDone")) : "✅ " + esc(t("gift.received", { d: fmtDate(doneAt) }))}
            ${rc.photo ? `<div class="gift-photos"><img src="${esc(rc.photo)}" alt="" data-zoom></div>` : ""}
            ${rc.comment ? `<div class="muted">「${esc(rc.comment)}」</div>` : ""}</div>` : "";
        const canEdit = sep && ["pending", "approved", "problem"].includes(r.status);
        const addrPart = waitAddr
          ? `<div class="gift-ask"><div>📍 ${esc(t("gift.needAddr"))}</div>
               <button class="btn btn-primary" data-editaddr="${esc(r.id)}">${esc(t("gift.fillAddr"))}</button></div>`
          : sep && r.address
          ? `<div class="gift-addr">📍 ${addressHTML(r.address)}
              ${canEdit ? `<div><button class="btn btn-ghost btn-inline btn-xs" data-editaddr="${esc(r.id)}">${t("addr.edit")}</button></div>` : ""}</div>`
          : !sep && !r.shippedAt ? `<div class="gift-addr muted">${esc(t("dlv.withOrderNote"))}</div>` : "";
        const details = `
          <div class="dlv-line">${esc(t(sep ? "dlv.separate" : "dlv.withOrder"))}</div>
          ${problem}${ship}${addrPart}
          ${receipt}${auto}`;
        return `
          ${bar}
          ${r.status === "completed"   // 收货后马上收起；查询链接要 3 天后才变灰
            ? `<details class="gift-more"><summary>${t("gift.showDetails")}</summary>${details}</details>`
            : details}
          ${r.status === "shipped" ? `<button class="btn btn-primary gift-confirm" data-receive="${esc(r.id)}">✅ ${t("gift.confirmBtn")}</button>` : ""}`;
      }

      function render() {
        $("spendable").textContent = bal.spendable.toLocaleString();
        $("pending").textContent = bal.pending.toLocaleString();
        $("reservedNote").textContent = bal.reserved > 0 ? t("acc.reserved", { n: bal.reserved }) : " ";

        // 我的兑换
        $("myList").innerHTML = bal.redemptions.length ? bal.redemptions.map(r => `
          <li id="r-${esc(r.id)}" class="redeem-li${r.kind === "gift" ? " gift-item" : ""}">
            <div class="redeem-row">
              ${thumb(r)}
              <div class="redeem-body">
                <div class="redeem-top">
                  <div class="title">${esc(r.rewardName)}${r.variantName ? ` <span class="tag">🎨 ${esc(r.variantName)}</span>` : ""} ${statusTag(r)}</div>
                  <span class="redeem-no">${redeemCode(r.id)}</span>
                </div>
                <div class="meta">${r.gift ? "🎁 " + esc(t("rw.perkGift", { why: r.giftReason || "" })) : t("unit.pts", { n: r.cost })} · ${t("rw.appliedOn", { d: fmtDate(r.createdAt) })}${r.decidedAt && r.kind !== "gift" ? " · " + t("rw.decidedOn", { d: fmtDate(r.decidedAt) }) : ""}</div>
                ${r.couponCode ? `<div class="code"><span class="code-txt">${t("rw.code")} <b>${esc(r.couponCode)}</b></span> <button class="btn btn-ghost btn-inline" data-copy="${esc(r.couponCode)}">${t("rw.copy")}</button></div>
                <div class="code-hint">💡 ${esc(codeHint(r))}</div>` : ""}
                ${r.note ? `<div class="meta">${t("rw.note")}${esc(tn(r.note, r.noteI18n))}</div>` : ""}
                ${r.adminCancelled && r.cancelNote ? `<div class="meta">${esc(r.cancelNote)}</div>` : ""}
              </div>
            </div>
            ${NM.rewardsNote(r, member)}
            ${giftBlock(r)}
            ${r.status === "pending" ? `<div class="redeem-actions"><button class="btn btn-ghost btn-inline btn-xs" data-cancel="${esc(r.id)}">${t("rw.cancel")}</button></div>` : ""}
          </li>`).join("") : `<li class="empty">${t("rw.noneMine")}</li>`;

        // 刚兑换完跳过来：捲到那一笔并闪一下
        const hash = location.hash.slice(1);
        if (hash) {
          const el = document.getElementById(hash);
          if (el) { el.classList.add("flash"); setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 200); }
          history.replaceState(null, "", location.pathname);
        }
      }

      // 取消、复制券码 / 单号、改地址、确认收货
      $("myList").addEventListener("click", async e => {
        const b = e.target.closest("button");
        if (!b) return;
        const { cancel: cancelId, copy: code, editaddr, receive } = b.dataset;
        if (cancelId) {
          if (!confirm(t("rw.cancelConfirm"))) return;
          b.disabled = true;
          const nmR = bal.redemptions.find(x => x.id === cancelId && NM.isNmRedemption(x));
          try {
            if (nmR) { await NM.cancelPending(nmR.nmrId); invalidateMemberCache(); }   // 🎉 迎新礼由后端取消
            else await updateDoc(doc(db, "redemptions", cancelId), { status: "cancelled" });
            await load();
          } catch (err) {
            alert(nmR ? NM.errText(err) : t("rw.cancelFail") + err.message);
            b.disabled = false;
          }
        }
        if (code) {
          try {
            await navigator.clipboard.writeText(code);
            b.textContent = t("rw.copied");
            setTimeout(() => b.textContent = t("rw.copy"), 1500);
          } catch { prompt(t("rw.copyPrompt"), code); }
        }
        if (editaddr) openEditAddr(editaddr);
        if (receive) openReceive(receive);
      });

      // ---------- 📍 修改收货地址 ----------
      // ① 用已存的地址（默认在最上面）② 用新地址（可以顺便存到地址簿）
      let eaId = null, eaPick = -1;
      let book = Array.isArray(member.addresses) ? member.addresses.slice() : [];
      $("eaFields").innerHTML = addressFormHTML();
      bindAddressForm($("eaFields"));
      const eaMsg = (x, ty) => { $("eaMsg").textContent = x; $("eaMsg").className = "msg" + (ty ? " " + ty : ""); };
      function renderEa() {
        const usingNew = eaPick === -1;
        $("eaDefH").textContent = book.length ? t("gift.useDefault") : t("gift.noBook");
        $("eaDefH").classList.toggle("muted", !book.length);
        $("eaList").innerHTML = book.map((a, i) => (i === 1 ? `<li class="ea-sub">${esc(t("gift.useSaved"))}</li>` : "")
          + addressCardHTML(a, i, { radio: true, selected: i === eaPick })).join("");
        $("eaList").classList.toggle("hidden", !book.length);
        $("eaNew").textContent = t("gift.useNew");
        $("eaNew").classList.toggle("on", usingNew);
        $("eaForm").classList.toggle("hidden", !usingNew);
        $("eaSaveRow").classList.toggle("hidden", book.length >= MAX_ADDRESSES);
      }
      function openEditAddr(id) {
        const r = bal.redemptions.find(x => x.id === id);
        if (!r) return;
        eaId = id;
        eaPick = book.length ? 0 : -1;
        $("eaTitle").textContent = r.addrPending ? t("gift.fillTitle") : t("gift.editAddr");
        $("eaReward").textContent = r.rewardName + " · " + t("dlv.separate");
        fillAddressForm($("eaFields"), r.address || { name: member.name || "", phone: member.phone || "" });
        $("eaSave").checked = true;
        eaMsg("");
        renderEa();
        $("eaModal").classList.remove("hidden");
      }
      $("eaList").addEventListener("click", e => {
        const li = e.target.closest(".addr-item");
        if (li) { eaPick = +li.dataset.i; renderEa(); }
      });
      $("eaNew").addEventListener("click", () => { eaPick = -1; renderEa(); });
      $("eaSubmit").addEventListener("click", async () => {
        const r = bal.redemptions.find(x => x.id === eaId);
        let address;
        if (eaPick === -1) {
          const v = validateAddressForm($("eaFields"));
          if (v.error) { eaMsg(v.error, "err"); return; }
          address = v.address;
        } else address = book[eaPick];
        $("eaSubmit").disabled = true;
        try {
          if (eaPick === -1 && $("eaSave").checked && book.length < MAX_ADDRESSES) {
            const next = [...book, address];
            await saveAddresses(user.uid, next);
            book = next;
          }
          const upd = { address, addressUpdatedAt: serverTimestamp() };
          if (r && r.addrPending) upd.addrPending = false;
          await updateDoc(doc(db, "redemptions", eaId), upd);
          $("eaModal").classList.add("hidden");
          await load();
        } catch (err) { eaMsg(t("idx.saveFail") + err.message, "err"); }
        finally { $("eaSubmit").disabled = false; }
      });

      // ---------- ✅ 确认收货（照片、留言都是选填） ----------
      let rcvId = null, rcvPhoto = null;
      function openReceive(id) {
        rcvId = id; rcvPhoto = null;
        $("rcvFile").value = ""; $("rcvComment").value = "";
        $("rcvPrevBox").classList.add("hidden");
        $("rcvMsg").textContent = "";
        $("rcvModal").classList.remove("hidden");
      }
      $("rcvFile").addEventListener("change", async () => {
        const f = $("rcvFile").files[0];
        if (!f) return;
        let url = await compressImage(f, 720);
        if (url.length > 300000) url = await compressImage(f, 480);
        rcvPhoto = url;
        $("rcvPrev").src = url;
        $("rcvPrevBox").classList.remove("hidden");
      });
      $("rcvSubmit").addEventListener("click", async () => {
        const comment = $("rcvComment").value.trim();
        const data = { status: "completed", receivedAt: serverTimestamp(), completedAt: serverTimestamp() };
        if (rcvPhoto || comment) data.receipt = { photo: rcvPhoto || "", comment };
        $("rcvSubmit").disabled = true;
        try {
          await updateDoc(doc(db, "redemptions", rcvId), data);
          $("rcvModal").classList.add("hidden");
          await load();
        } catch (err) {
          $("rcvMsg").textContent = t("idx.saveFail") + err.message;
          $("rcvMsg").className = "msg err";
        } finally { $("rcvSubmit").disabled = false; }
      });

      // ---------- 🏆 待领取的中奖奖品 → 小提示 ----------
      onSnapshot(query(collection(db, "prizeWins"), where("uid", "==", user.uid)), snap => {
        const n = snap.docs.filter(d => d.data().status === "unclaimed").length;
        $("pzBannerText").textContent = t("rw.prizeBanner", { n });
        $("pzBanner").classList.toggle("hidden", !n);
      }, e => console.warn("prizeWins", e));

      load();
    });
  </script>
  <!-- 🔍 看大图（照片是存在资料库里的 data 网址，不能开新分页，否则手机浏览器会当掉） -->
  <div id="zoomBox" class="zoom-box hidden" role="dialog" aria-modal="true">
    <button type="button" class="zoom-close" aria-label="close">✕</button>
    <img id="zoomImg" alt="">
  </div>
  <script>
    (() => {
      const box = document.getElementById("zoomBox"), img = document.getElementById("zoomImg");
      const close = () => { box.classList.add("hidden"); img.removeAttribute("src"); document.body.style.overflow = ""; };
      document.addEventListener("click", e => {
        const z = e.target.closest("img[data-zoom]");
        if (z) {
          e.preventDefault();
          img.src = z.currentSrc || z.src;
          box.classList.remove("hidden");
          document.body.style.overflow = "hidden";
        } else if (!box.classList.contains("hidden") && box.contains(e.target)) close();
      });
      document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.classList.contains("hidden")) close(); });
    })();
  </script>
</body>
</html>
