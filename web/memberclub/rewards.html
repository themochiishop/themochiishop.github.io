<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="rw.pageTitle">Rewards · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 data-i18n="rw.title"></h1>
    <p class="muted" data-i18n="rw.sub"></p>
    <p id="pageError" class="msg err hidden"></p>

    <div class="stats">
      <div class="stat main">
        <div class="label" data-i18n="acc.available"></div>
        <div class="value" id="spendable">-</div>
        <div class="sub" id="reservedNote">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="label" data-i18n="acc.pending"></div>
        <div class="value" id="pending">-</div>
        <div class="sub" data-i18n="rw.pendingSub"></div>
      </div>
    </div>

    <a href="shop.html" class="btn btn-primary" style="margin-bottom:16px" data-i18n="rw.goShop"></a>

    <!-- 🏆 中奖领取（后台「中奖奖品」添加后才出现） -->
    <div class="card prize-card hidden" id="prizes">
      <h2 class="dash-head" data-i18n="pz.title"></h2>
      <p class="muted pz-sub" data-i18n="pz.sub"></p>
      <ul id="prizeList" class="list"></ul>
      <details id="prizePast" class="pz-past hidden"><summary></summary><ul class="list"></ul></details>
    </div>

    <div class="card">
      <h2 class="dash-head" data-i18n="rw.mine"></h2>
      <ul id="myList" class="list"><li class="empty" data-i18n="common.loading"></li></ul>
    </div>
  </main>

  <!-- ✅ 确认收货 -->
  <div id="rcvModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 data-i18n="gift.confirmTitle"></h2>
      <p class="muted" style="font-size:.85rem;margin-bottom:12px" data-i18n="gift.confirmSub"></p>
      <label><span data-i18n="gift.photo"></span>
        <input type="file" id="rcvFile" accept="image/*">
      </label>
      <div id="rcvPrevBox" class="hidden" style="margin:-6px 0 12px"><img id="rcvPrev" class="rcv-prev" alt=""></div>
      <label><span data-i18n="gift.comment"></span>
        <textarea id="rcvComment" rows="2" maxlength="200"></textarea>
      </label>
      <p id="rcvMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="rcvSubmit" data-i18n="gift.confirmBtn"></button>
    </div>
  </div>

  <!-- 🎁 领取中奖奖品 -->
  <div id="pzModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 data-i18n="pz.claimTitle"></h2>
      <div id="pzInfo"></div>
      <div id="pzAddr" class="hidden">
        <p class="muted" style="font-size:.85rem;margin:10px 0" data-i18n="pz.claimSeparate"></p>
        <ul id="pzBook" class="addr-list"></ul>
        <div id="pzFields"></div>
      </div>
      <p id="pzWithOrder" class="muted hidden" style="font-size:.85rem;margin:10px 0 14px" data-i18n="pz.claimWithOrder"></p>
      <p id="pzMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="pzSubmit" data-i18n="pz.claimBtn"></button>
    </div>
  </div>

  <!-- 📍 修改这笔兑换的收货地址 -->
  <div id="eaModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-x" data-close aria-label="close">✕</button>
      <h2 data-i18n="gift.editAddr"></h2>
      <ul id="eaList" class="addr-list"></ul>
      <div id="eaFields"></div>
      <p id="eaMsg" class="msg"></p>
      <button type="button" class="btn btn-primary" id="eaSubmit" data-i18n="prof.save"></button>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      doc, updateDoc, collection, getDocs, serverTimestamp, query, where, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, esc, fmtDate, t, toDate,
      giftStep, GIFT_STEPS, addressHTML, AUTO_COMPLETE_DAYS, compressImage, redeemCode, DETAIL_COLLAPSE_DAYS, toast
    } from "./js/common.js";
    import { addressFormHTML, bindAddressForm, fillAddressForm, validateAddressForm, addressCardHTML } from "./js/address.js";

    const $ = id => document.getElementById(id);
    renderNav("rewards");

    const STATUS_CLASS = { pending: "tag-pending", approved: "tag-ok", rejected: "tag-bad", cancelled: "",
      shipped: "tag-ship", problem: "tag-pending", completed: "tag-ok" };
    const statusTag = r => {
      let key = "rw.st." + r.status;
      if (r.kind === "gift" && r.status === "approved") key = "gift.st.toShip";
      if (r.status === "shipped" || r.status === "problem" || r.status === "completed") key = "gift.st." + r.status;
      if (r.status === "cancelled" && r.adminCancelled) key = "gift.st.adminCancelled";
      return `<span class="tag ${STATUS_CLASS[r.status] || ""}">${t(key)}</span>`;
    };

    document.querySelectorAll(".modal").forEach(m => {
      m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.classList.add("hidden"); });
    });

    requireMember((user, member) => {
      let bal = null;
      const rewardInfo = {};   // 奖品 ID → 图片 / 类型（下架的也读得到）

      async function load() {
        try {
          const [b, rSnap] = await Promise.all([loadBalance(user.uid), getDocs(collection(db, "rewards"))]);
          bal = b;
          rSnap.docs.forEach(d => { rewardInfo[d.id] = d.data(); });
          render();
        } catch (e) {
          $("pageError").textContent = t("common.loadFail") + e.message;
          $("pageError").classList.remove("hidden");
        }
      }

      // 商品图片：没有图片就显示类型图标
      function thumb(r) {
        const info = rewardInfo[r.rewardId] || {};
        return info.image
          ? `<img class="redeem-thumb" src="${esc(info.image)}" alt="" loading="lazy">`
          : `<span class="redeem-thumb">${info.type === "coupon" || r.kind === "coupon" ? "🎫" : "🎁"}</span>`;
      }

      // ---------- 📦 实体奖品：进度条 + 物流 ----------
      function giftBlock(r) {
        if (r.kind !== "gift" || r.status === "rejected" || r.status === "cancelled") {
          return r.kind === "gift" && r.address ? `<div class="gift-addr muted">📍 ${addressHTML(r.address)}</div>` : "";
        }
        const step = giftStep(r);
        const dates = [r.createdAt, r.decidedAt, toDate(r.shippedAt), toDate(r.receivedAt) || toDate(r.completedAt), toDate(r.completedAt)];
        const bar = `
          <div class="gift-steps">
            ${GIFT_STEPS.map((k, i) => `
              <div class="gstep${i <= step ? " done" : ""}${i === step ? " now" : ""}">
                <span class="dot"></span>
                <span class="lbl">${t("gift.step." + k)}</span>
                <span class="dt">${i <= step && dates[i] ? fmtDate(dates[i]).slice(0, 5) : ""}</span>
              </div>`).join("")}
          </div>`;
        const sh = r.shipping || {};
        const doneAt = toDate(r.receivedAt) || toDate(r.completedAt);
        const old = r.status === "completed" && doneAt && (Date.now() - doneAt) > DETAIL_COLLAPSE_DAYS * 86400000;
        const url = /^https:\/\//i.test(sh.trackingUrl || "") ? sh.trackingUrl : "";
        const ship = r.shippedAt ? `
          <div class="gift-ship">
            <div class="ship-line">🚚 <b>${esc(sh.carrierName || "")}</b>
              ${sh.trackingNo ? `<span class="mono small-break">${esc(sh.trackingNo)}</span>
              <button class="btn btn-ghost btn-inline btn-xs" data-copy="${esc(sh.trackingNo)}">${t("rw.copy")}</button>` : ""}</div>
            ${url ? (old
              ? `<div class="track-link disabled">🔗 ${t("gift.track")}</div>`
              : `<a class="track-link" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${t("gift.track")} <span class="url">${esc(url)}</span></a>`) : ""}
            ${sh.weightKg || (sh.dims && sh.dims.l) ? `<div class="muted small">📦 ${sh.weightKg ? esc(sh.weightKg) + " kg" : ""}${sh.dims && sh.dims.l ? ` · ${esc(sh.dims.l)}×${esc(sh.dims.w)}×${esc(sh.dims.h)} cm` : ""}</div>` : ""}
            ${(sh.photos || []).length ? `<div class="gift-photos">${sh.photos.map(p => `<img src="${esc(p)}" alt="" loading="lazy" data-zoom>`).join("")}</div>` : ""}
            ${sh.note ? `<div class="small">💬 ${esc(sh.note)}</div>` : ""}
          </div>` : "";
        const problem = r.status === "problem" ? `<div class="gift-problem">⚠️ ${esc(t("gift.problem"))}${r.problemNote ? "：" + esc(r.problemNote) : ""}</div>` : "";
        const auto = r.status === "shipped" && r.shippedAt
          ? `<div class="muted gift-auto">${esc(t("gift.autoNote", { d: fmtDate(new Date(toDate(r.shippedAt).getTime() + AUTO_COMPLETE_DAYS * 86400000)) }))}</div>` : "";
        const rc = r.receipt || {};
        const receipt = r.status === "completed" ? `
          <div class="gift-receipt">${r.autoCompleted ? "✅ " + esc(t("gift.autoDone")) : "✅ " + esc(t("gift.received", { d: fmtDate(doneAt) }))}
            ${rc.photo ? `<div class="gift-photos"><img src="${esc(rc.photo)}" alt="" data-zoom></div>` : ""}
            ${rc.comment ? `<div class="muted">「${esc(rc.comment)}」</div>` : ""}</div>` : "";
        const canEdit = ["pending", "approved", "problem"].includes(r.status);
        const details = `
          ${problem}${ship}
          <div class="gift-addr">📍 ${addressHTML(r.address)}
            ${canEdit ? `<div><button class="btn btn-ghost btn-inline btn-xs" data-editaddr="${esc(r.id)}">${t("addr.edit")}</button></div>` : ""}</div>
          ${receipt}${auto}`;
        return `
          ${bar}
          ${r.status === "completed"   // 收货后马上收起；查询链接要 3 天后才变灰
            ? `<details class="gift-more"><summary>${t("gift.showDetails")}</summary>${details}</details>`
            : details}
          ${r.status === "shipped" ? `<button class="btn btn-primary gift-confirm" data-receive="${esc(r.id)}">✅ ${t("gift.confirmBtn")}</button>` : ""}`;
      }

      function render() {
        $("spendable").textContent = bal.spendable.toLocaleString();
        $("pending").textContent = bal.pending.toLocaleString();
        $("reservedNote").textContent = bal.reserved > 0 ? t("acc.reserved", { n: bal.reserved }) : " ";

        // 我的兑换
        $("myList").innerHTML = bal.redemptions.length ? bal.redemptions.map(r => `
          <li id="r-${esc(r.id)}" class="redeem-li${r.kind === "gift" ? " gift-item" : ""}">
            <div class="redeem-row">
              ${thumb(r)}
              <div class="redeem-body">
                <div class="redeem-top">
                  <div class="title">${esc(r.rewardName)} ${statusTag(r)}</div>
                  <span class="redeem-no">${redeemCode(r.id)}</span>
                </div>
                <div class="meta">${t("unit.pts", { n: r.cost })} · ${t("rw.appliedOn", { d: fmtDate(r.createdAt) })}${r.decidedAt && r.kind !== "gift" ? " · " + t("rw.decidedOn", { d: fmtDate(r.decidedAt) }) : ""}</div>
                ${r.couponCode ? `<div class="code"><span class="code-txt">${t("rw.code")} <b>${esc(r.couponCode)}</b></span> <button class="btn btn-ghost btn-inline" data-copy="${esc(r.couponCode)}">${t("rw.copy")}</button></div>` : ""}
                ${r.note ? `<div class="meta">${t("rw.note")}${esc(r.note)}</div>` : ""}
                ${r.adminCancelled && r.cancelNote ? `<div class="meta">${esc(r.cancelNote)}</div>` : ""}
              </div>
            </div>
            ${giftBlock(r)}
            ${r.status === "pending" ? `<div class="redeem-actions"><button class="btn btn-ghost btn-inline btn-xs" data-cancel="${esc(r.id)}">${t("rw.cancel")}</button></div>` : ""}
          </li>`).join("") : `<li class="empty">${t("rw.noneMine")}</li>`;

        // 刚兑换完跳过来：捲到那一笔并闪一下
        const hash = location.hash.slice(1);
        if (hash) {
          const el = document.getElementById(hash);
          if (el) { el.classList.add("flash"); setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 200); }
          history.replaceState(null, "", location.pathname);
        }
      }

      // 取消、复制券码 / 单号、改地址、确认收货
      $("myList").addEventListener("click", async e => {
        const b = e.target.closest("button");
        if (!b) return;
        const { cancel: cancelId, copy: code, editaddr, receive } = b.dataset;
        if (cancelId) {
          if (!confirm(t("rw.cancelConfirm"))) return;
          b.disabled = true;
          try {
            await updateDoc(doc(db, "redemptions", cancelId), { status: "cancelled" });
            await load();
          } catch (err) {
            alert(t("rw.cancelFail") + err.message);
            b.disabled = false;
          }
        }
        if (code) {
          try {
            await navigator.clipboard.writeText(code);
            b.textContent = t("rw.copied");
            setTimeout(() => b.textContent = t("rw.copy"), 1500);
          } catch { prompt(t("rw.copyPrompt"), code); }
        }
        if (editaddr) openEditAddr(editaddr);
        if (receive) openReceive(receive);
      });

      // ---------- 📍 修改收货地址 ----------
      let eaId = null, eaPick = -1;
      const book = Array.isArray(member.addresses) ? member.addresses : [];
      $("eaFields").innerHTML = addressFormHTML();
      bindAddressForm($("eaFields"));
      const eaMsg = (x, ty) => { $("eaMsg").textContent = x; $("eaMsg").className = "msg" + (ty ? " " + ty : ""); };
      function openEditAddr(id) {
        const r = bal.redemptions.find(x => x.id === id);
        if (!r) return;
        eaId = id; eaPick = -1;
        fillAddressForm($("eaFields"), r.address || {});
        $("eaList").innerHTML = book.map((a, i) => addressCardHTML(a, i, {})).join("");
        $("eaList").classList.toggle("hidden", !book.length);
        eaMsg(book.length ? t("gift.pickFromBook") : "");
        $("eaModal").classList.remove("hidden");
      }
      $("eaList").addEventListener("click", e => {
        const li = e.target.closest(".addr-item");
        if (!li) return;
        fillAddressForm($("eaFields"), book[+li.dataset.i]);
      });
      $("eaSubmit").addEventListener("click", async () => {
        const v = validateAddressForm($("eaFields"));
        if (v.error) { eaMsg(v.error, "err"); return; }
        $("eaSubmit").disabled = true;
        try {
          await updateDoc(doc(db, "redemptions", eaId), { address: v.address, addressUpdatedAt: serverTimestamp() });
          $("eaModal").classList.add("hidden");
          await load();
        } catch (err) { eaMsg(t("idx.saveFail") + err.message, "err"); }
        finally { $("eaSubmit").disabled = false; }
      });

      // ---------- ✅ 确认收货（照片、留言都是选填） ----------
      let rcvId = null, rcvPhoto = null;
      function openReceive(id) {
        rcvId = id; rcvPhoto = null;
        $("rcvFile").value = ""; $("rcvComment").value = "";
        $("rcvPrevBox").classList.add("hidden");
        $("rcvMsg").textContent = "";
        $("rcvModal").classList.remove("hidden");
      }
      $("rcvFile").addEventListener("change", async () => {
        const f = $("rcvFile").files[0];
        if (!f) return;
        let url = await compressImage(f, 720);
        if (url.length > 300000) url = await compressImage(f, 480);
        rcvPhoto = url;
        $("rcvPrev").src = url;
        $("rcvPrevBox").classList.remove("hidden");
      });
      $("rcvSubmit").addEventListener("click", async () => {
        const comment = $("rcvComment").value.trim();
        const data = { status: "completed", receivedAt: serverTimestamp(), completedAt: serverTimestamp() };
        if (rcvPhoto || comment) data.receipt = { photo: rcvPhoto || "", comment };
        $("rcvSubmit").disabled = true;
        try {
          await updateDoc(doc(db, "redemptions", rcvId), data);
          $("rcvModal").classList.add("hidden");
          await load();
        } catch (err) {
          $("rcvMsg").textContent = t("idx.saveFail") + err.message;
          $("rcvMsg").className = "msg err";
        } finally { $("rcvSubmit").disabled = false; }
      });

      // ---------- 🏆 中奖领取 ----------
      const PZ_STEPS = ["won", "claimed", "approved", "shipped", "received"];
      const PZ_STEP = { unclaimed: 0, claimed: 1, approved: 2, shipped: 3, completed: 4 };
      const PZ_TAG = { unclaimed: "tag-pending", claimed: "tag-pending", approved: "tag-ship", shipped: "tag-ship", completed: "tag-ok", cancelled: "" };
      let prizes = [];

      // 即时更新：后台审核、发货后，这一页不用重新整理就会变
      let prizeSub = null;
      function loadPrizes() {
        if (prizeSub) return;
        prizeSub = onSnapshot(query(collection(db, "prizeWins"), where("uid", "==", user.uid)), s => {
          prizes = s.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
          renderPrizes();
        }, e => { console.warn("prizeWins", e); prizes = []; renderPrizes(); });
      }
      // 已经在这一页时点铃铛通知（只改了 #prizes）：捲到中奖框
      window.addEventListener("hashchange", () => {
        if (location.hash !== "#prizes") return;
        if (prizes.length) $("prizes").scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", location.pathname);
      });

      function prizeLi(p) {
        const step = PZ_STEP[p.status] ?? 0;
        const sh = p.shipping || {};
        const url = /^https:\/\//i.test(sh.trackingUrl || "") ? sh.trackingUrl : "";
        const dates = [p.createdAt, p.claimedAt, p.approvedAt, p.shippedAt, p.completedAt].map(toDate);
        const bar = p.status !== "unclaimed" && p.status !== "cancelled" ? `
          <div class="gift-steps">
            ${PZ_STEPS.map((k, i) => `
              <div class="gstep${i <= step ? " done" : ""}${i === step ? " now" : ""}">
                <span class="dot"></span>
                <span class="lbl">${t("pz.step." + k)}</span>
                <span class="dt">${i <= step && dates[i] ? fmtDate(dates[i]).slice(0, 5) : ""}</span>
              </div>`).join("")}
          </div>` : "";
        const dlv = p.delivery === "separate" ? "separate" : "withOrder";
        return `
          <li id="p-${esc(p.id)}" class="redeem-li gift-item pz-item pz-${esc(p.status)}">
            <div class="redeem-row">
              ${p.prizeImage ? `<img class="redeem-thumb" src="${esc(p.prizeImage)}" alt="" loading="lazy" data-zoom>` : `<span class="redeem-thumb">🏆</span>`}
              <div class="redeem-body">
                <div class="redeem-top">
                  <div class="title">${esc(p.prizeName)} <span class="tag ${PZ_TAG[p.status] || ""}">${t("pz.st." + p.status)}</span></div>
                  <span class="redeem-no">${redeemCode(p.id)}</span>
                </div>
                <div class="meta">${p.drawMonth ? esc(t("pz.from", { m: p.drawMonth })) + " · " : ""}${fmtDate(toDate(p.createdAt))}</div>
                ${p.note ? `<div class="meta">💬 ${esc(p.note)}</div>` : ""}
              </div>
            </div>
            ${bar}
            <div class="pz-dlv">
              <span class="pz-dlv-ico">${dlv === "separate" ? "🚚" : "📦"}</span>
              <div><b>${t("pz.dlv." + dlv)}</b><div class="muted">${t("pz.dlv." + dlv + "Sub")}</div></div>
            </div>
            ${(sh.trackingNo || (sh.photos || []).length) && p.status !== "cancelled" ? `
              <div class="gift-ship">
                ${sh.trackingNo ? `<div class="ship-line">🚚 <b>${esc(sh.carrierName || t("pz.tracking"))}</b>
                  <span class="mono small-break">${esc(sh.trackingNo)}</span>
                  <button class="btn btn-ghost btn-inline btn-xs" data-copy="${esc(sh.trackingNo)}">${t("rw.copy")}</button></div>` : ""}
                ${url && p.status !== "completed" ? `<a class="track-link" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${t("gift.track")}</a>` : ""}
                ${(sh.photos || []).length ? `<div class="gift-photos">${sh.photos.map(x => `<img src="${esc(x)}" alt="" loading="lazy" data-zoom>`).join("")}</div>` : ""}
              </div>` : ""}
            ${p.address && p.status !== "cancelled" ? `<div class="gift-addr">📍 ${addressHTML(p.address)}</div>` : ""}
            ${p.status === "cancelled" && p.cancelNote ? `<div class="meta">${esc(p.cancelNote)}</div>` : ""}
            ${p.status === "unclaimed" ? `<button class="btn btn-primary gift-confirm pz-claim" data-claim="${esc(p.id)}">${t("pz.claim")}</button>` : ""}
            ${p.status === "shipped" ? `<button class="btn btn-primary gift-confirm" data-got="${esc(p.id)}">${t("pz.receivedBtn")}</button>` : ""}
          </li>`;
      }

      function renderPrizes() {
        const active = prizes.filter(p => ["unclaimed", "claimed", "approved", "shipped"].includes(p.status));
        const past = prizes.filter(p => p.status === "completed" || p.status === "cancelled");
        $("prizes").classList.toggle("hidden", !prizes.length);
        $("prizes").classList.toggle("has-todo", active.some(p => p.status === "unclaimed"));
        $("prizeList").innerHTML = active.map(prizeLi).join("");
        $("prizeList").classList.toggle("hidden", !active.length);
        $("prizePast").classList.toggle("hidden", !past.length);
        $("prizePast").querySelector("summary").textContent = t("pz.past", { n: past.length });
        $("prizePast").querySelector("ul").innerHTML = past.map(prizeLi).join("");
        if (location.hash === "#prizes" && prizes.length) {
          setTimeout(() => $("prizes").scrollIntoView({ behavior: "smooth", block: "start" }), 200);
          history.replaceState(null, "", location.pathname);
        }
      }

      $("prizes").addEventListener("click", async e => {
        const b = e.target.closest("button");
        if (!b) return;
        const { claim, got, copy: code } = b.dataset;
        if (code) {
          try { await navigator.clipboard.writeText(code); b.textContent = t("rw.copied"); setTimeout(() => b.textContent = t("rw.copy"), 1500); }
          catch { prompt(t("rw.copyPrompt"), code); }
        }
        if (claim) openClaim(claim);
        if (got) {
          const p = prizes.find(x => x.id === got);
          if (!p || !confirm(t("pz.receivedConfirm", { name: p.prizeName }))) return;
          b.disabled = true;
          try {
            await updateDoc(doc(db, "prizeWins", got), { status: "completed", completedAt: serverTimestamp() });
          } catch (err) { alert(t("pz.fail") + err.message); b.disabled = false; }
        }
      });

      // 领取：随单发送直接确认；单独包裹要选收货地址
      let pzId = null;
      $("pzFields").innerHTML = addressFormHTML();
      bindAddressForm($("pzFields"));
      const pzMsg = (x, ty) => { $("pzMsg").textContent = x; $("pzMsg").className = "msg" + (ty ? " " + ty : ""); };
      function openClaim(id) {
        const p = prizes.find(x => x.id === id);
        if (!p) return;
        pzId = id;
        const sep = p.delivery === "separate";
        $("pzInfo").innerHTML = `
          <div class="redeem-row" style="margin-top:6px">
            ${p.prizeImage ? `<img class="redeem-thumb" src="${esc(p.prizeImage)}" alt="">` : `<span class="redeem-thumb">🏆</span>`}
            <div class="redeem-body"><div class="title">${esc(p.prizeName)}</div>
              <div class="meta">${t("pz.dlv." + (sep ? "separate" : "withOrder"))}</div></div>
          </div>`;
        $("pzAddr").classList.toggle("hidden", !sep);
        $("pzWithOrder").classList.toggle("hidden", sep);
        if (sep) {
          fillAddressForm($("pzFields"), book[0] || {});
          $("pzBook").innerHTML = book.map((a, i) => addressCardHTML(a, i, {})).join("");
          $("pzBook").classList.toggle("hidden", !book.length);
        }
        pzMsg("");
        $("pzModal").classList.remove("hidden");
      }
      $("pzBook").addEventListener("click", e => {
        const li = e.target.closest(".addr-item");
        if (li) fillAddressForm($("pzFields"), book[+li.dataset.i]);
      });
      $("pzSubmit").addEventListener("click", async () => {
        const p = prizes.find(x => x.id === pzId);
        if (!p) return;
        const data = { status: "claimed", claimedAt: serverTimestamp() };
        if (p.delivery === "separate") {
          const v = validateAddressForm($("pzFields"));
          if (v.error) { pzMsg(v.error, "err"); return; }
          data.address = v.address;
        }
        $("pzSubmit").disabled = true;
        try {
          await updateDoc(doc(db, "prizeWins", pzId), data);
          $("pzModal").classList.add("hidden");
          toast(t("pz.claimed"));
        } catch (err) { pzMsg(t("pz.fail") + err.message, "err"); }
        finally { $("pzSubmit").disabled = false; }
      });

      load();
      loadPrizes();
    });
  </script>
  <!-- 🔍 看大图（照片是存在资料库里的 data 网址，不能开新分页，否则手机浏览器会当掉） -->
  <div id="zoomBox" class="zoom-box hidden" role="dialog" aria-modal="true">
    <button type="button" class="zoom-close" aria-label="close">✕</button>
    <img id="zoomImg" alt="">
  </div>
  <script>
    (() => {
      const box = document.getElementById("zoomBox"), img = document.getElementById("zoomImg");
      const close = () => { box.classList.add("hidden"); img.removeAttribute("src"); document.body.style.overflow = ""; };
      document.addEventListener("click", e => {
        const z = e.target.closest("img[data-zoom]");
        if (z) {
          e.preventDefault();
          img.src = z.currentSrc || z.src;
          box.classList.remove("hidden");
          document.body.style.overflow = "hidden";
        } else if (!box.classList.contains("hidden") && box.contains(e.target)) close();
      });
      document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.classList.contains("hidden")) close(); });
    })();
  </script>
</body>
