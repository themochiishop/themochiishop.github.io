<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的积分 · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1 id="hello">你好！</h1>
    <p class="muted">积分在下单 14 天后转为可用，期间如退货将自动取消</p>
    <p id="pageError" class="msg err hidden"></p>

    <!-- 尚未绑定时的提示 -->
    <div id="bindCallout" class="callout hidden">
      <p>👋 你还没有绑定 Shopee / TikTok 账号。绑定后，过去和以后的订单都会自动累积积分！</p>
      <a href="bind.html" class="btn btn-primary btn-inline">去绑定账号 ➔</a>
    </div>

    <!-- 会员等级 -->
    <div class="card tier-card" id="tierCard">
      <div class="tier-head">
        <div class="tier-icon" id="tierIcon">🍡</div>
        <div>
          <div class="tier-name" id="tierName">-</div>
          <div class="tier-perk" id="tierPerk"></div>
        </div>
      </div>
      <div class="bar"><div id="tierBar" style="width:0%"></div></div>
      <div class="muted" style="font-size:.85rem" id="tierNext"></div>
      <details>
        <summary>查看等级说明</summary>
        <table class="tier-table" id="tierTable"></table>
        <p class="muted" style="font-size:.78rem;margin-top:8px">等级按最近 365 天的有效消费计算（退货不计），每小时更新。升级后，之后的新订单就享有新的积分加成。</p>
      </details>
    </div>

    <!-- 积分摘要 -->
    <div class="stats">
      <div class="stat main">
        <div class="label">可用积分</div>
        <div class="value" id="spendable">-</div>
        <div class="sub" id="reservedNote"><a href="rewards.html">去兑换奖品 ➔</a></div>
      </div>
      <div class="stat">
        <div class="label">待确认积分</div>
        <div class="value" id="pending">-</div>
        <div class="sub" id="nextUnlock">&nbsp;</div>
      </div>
    </div>

    <!-- 已绑定账号 -->
    <div class="card">
      <h2>已绑定账号</h2>
      <div id="bindings" class="chips"><span class="muted">载入中…</span></div>
    </div>

    <!-- 记录 -->
    <div class="tabs">
      <button data-tab="ledger" class="active">积分记录</button>
      <button data-tab="orders">订单记录</button>
    </div>
    <div class="card">
      <ul id="ledgerList" class="list"><li class="empty">载入中…</li></ul>
      <ul id="ordersList" class="list hidden"></ul>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireMember, renderNav, loadBalance, toDate, fmtDate, fmtMoney, esc, platformTag,
      TIERS, tierProgress
    } from "./js/common.js";

    const $ = id => document.getElementById(id);
    renderNav("account");

    // 分页切换
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
        $("ledgerList").classList.toggle("hidden", btn.dataset.tab !== "ledger");
        $("ordersList").classList.toggle("hidden", btn.dataset.tab !== "orders");
      });
    });

    requireMember(async (user, member) => {
      $("hello").textContent = `你好，${member.name || "会员"} 👋`;

      // ---------- 会员等级 ----------
      const tp = tierProgress(member);
      $("tierCard").classList.add("tier-" + tp.tier.id);
      $("tierIcon").textContent = tp.tier.icon;
      $("tierName").textContent = tp.tier.label;
      $("tierPerk").textContent =
        `购物积分 ×${tp.tier.multiplier} · 生日礼物 ${tp.tier.birthday} 分 · 近一年消费 ${fmtMoney(tp.spend)}`;
      $("tierBar").style.width = tp.pct + "%";
      $("tierNext").textContent = tp.next
        ? `再消费 ${fmtMoney(tp.need)} 升级为 ${tp.next.icon} ${tp.next.label}（积分 ×${tp.next.multiplier}）`
        : "🎉 你已经是最高等级！";
      $("tierTable").innerHTML = `
        <tr><th>等级</th><th>近一年消费</th><th>积分加成</th><th>生日礼物</th></tr>
        ${TIERS.map(t => `
          <tr class="${t.id === tp.tier.id ? "current" : ""}">
            <td>${t.icon} ${t.label}</td>
            <td>${t.minSpend ? "RM " + t.minSpend + " 以上" : "注册即享"}</td>
            <td>×${t.multiplier}</td>
            <td>${t.birthday} 分</td>
          </tr>`).join("")}`;

      const mine = c => getDocs(query(collection(db, c), where("uid", "==", user.uid)));
      let bal, ordersSnap, bindSnap;
      try {
        [bal, ordersSnap, bindSnap] = await Promise.all([
          loadBalance(user.uid), mine("orders"), mine("bindings")
        ]);
      } catch (e) {
        $("pageError").textContent = "载入失败：" + e.message;
        $("pageError").classList.remove("hidden");
        return;
      }

      const now = new Date();

      // ---------- 已绑定账号 ----------
      const bindings = bindSnap.docs.map(d => d.data());
      $("bindCallout").classList.toggle("hidden", bindings.length > 0);
      $("bindings").innerHTML = bindings.length
        ? bindings.map(b => `<span class="chip">${platformTag(b.platform)} ${esc(b.username)}</span>`).join("")
        : `<span class="muted">尚未绑定</span>`;

      // ---------- 积分摘要 ----------
      $("spendable").textContent = bal.spendable.toLocaleString();
      if (bal.reserved > 0) {
        $("reservedNote").innerHTML = `另有 ${bal.reserved} 分兑换审核中 · <a href="rewards.html">查看</a>`;
      }
      $("pending").textContent = bal.pending.toLocaleString();
      $("nextUnlock").textContent = bal.nextUnlock ? `下一笔于 ${fmtDate(bal.nextUnlock)} 可用` : " ";

      // ---------- 积分记录 ----------
      $("ledgerList").innerHTML = bal.ledger.length ? bal.ledger.map(x => {
        const isPending = x.availableAt && x.availableAt > now;
        return `
          <li>
            <div class="main">
              <div class="title">${esc(x.reason)} ${isPending ? '<span class="tag tag-pending">待确认</span>' : ""}</div>
              <div class="meta">${x.orderNo ? "单号 " + esc(x.orderNo) + " · " : ""}${fmtDate(x.createdAt)}</div>
            </div>
            <div class="right">
              <div class="pts ${x.delta >= 0 ? "plus" : "minus"}">${x.delta >= 0 ? "+" : ""}${x.delta}</div>
            </div>
          </li>`;
      }).join("") : `<li class="empty">还没有积分记录</li>`;

      // ---------- 订单记录 ----------
      const orders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .map(o => ({ ...o, orderTime: toDate(o.orderTime), availableAt: toDate(o.availableAt) }))
        .sort((a, b) => (b.orderTime || 0) - (a.orderTime || 0));

      $("ordersList").innerHTML = orders.length ? orders.map(o => {
        let state;
        if (o.status === "refunded") state = '<span class="tag tag-bad">已退货</span>';
        else if (o.availableAt && o.availableAt > now) state = '<span class="tag tag-pending">待确认</span>';
        else state = '<span class="tag tag-ok">已入账</span>';
        return `
          <li>
            <div class="main">
              <div class="title">${platformTag(o.platform)} ${fmtMoney(o.amount)}</div>
              <div class="meta">${esc(o.id)} · ${fmtDate(o.orderTime, true)}</div>
            </div>
            <div class="right">
              <div class="pts">${o.points || 0} 分</div>
              ${state}
            </div>
          </li>`;
      }).join("") : `<li class="empty">还没有订单记录</li>`;
    });
  </script>
</body>
</html>
