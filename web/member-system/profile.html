<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人资料 · The Mochii Shop</title>
  <link rel="stylesheet" href="css/member.css">
</head>
<body class="loading">
  <header id="topbar"></header>

  <main class="page">
    <h1>个人资料</h1>
    <p class="muted">管理你的会员资料</p>
    <p id="pageError" class="msg err hidden"></p>

    <div class="card">
      <h2>基本资料</h2>
      <form id="nameForm">
        <label>电子邮件
          <input id="email" readonly>
        </label>
        <label>称呼
          <input id="name" required maxlength="40">
        </label>
        <button type="submit" class="btn btn-primary" id="nameSubmit">保存</button>
      </form>
      <p id="nameMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>🎂 生日</h2>
      <div id="birthdayLocked" class="hidden">
        <p style="font-size:1.2rem;font-weight:700" id="birthdayText"></p>
        <p class="muted" style="font-size:.85rem;margin-top:6px">生日已设定，不能修改。如需更正请联系我们。</p>
      </div>
      <form id="birthdayForm" class="hidden">
        <label>设定生日
          <input type="date" id="birthday" required>
          <small>⚠️ 生日只能设定一次，生日月份会收到生日礼物</small>
        </label>
        <button type="submit" class="btn btn-primary" id="birthdaySubmit">设定生日</button>
      </form>
      <p id="birthdayMsg" class="msg"></p>
    </div>

    <div class="card">
      <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { requireMember, renderNav, logout } from "./js/common.js";

    const $ = id => document.getElementById(id);
    renderNav("profile");
    $("logoutBtn").addEventListener("click", logout);

    function setMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg" + (type ? " " + type : "");
    }

    function showBirthday(b) {
      if (b) {
        const [y, m, d] = b.split("-");
        $("birthdayText").textContent = `${d}/${m}/${y}`;
        $("birthdayLocked").classList.remove("hidden");
        $("birthdayForm").classList.add("hidden");
      } else {
        $("birthdayLocked").classList.add("hidden");
        $("birthdayForm").classList.remove("hidden");
      }
    }

    requireMember((user, member) => {
      const ref = doc(db, "members", user.uid);
      $("email").value = member.email || user.email || "";
      $("name").value = member.name || "";
      showBirthday(member.birthday);

      $("nameForm").addEventListener("submit", async e => {
        e.preventDefault();
        $("nameSubmit").disabled = true;
        try {
          await updateDoc(ref, { name: $("name").value.trim() });
          setMsg($("nameMsg"), "已保存 ✅", "ok");
        } catch (err) {
          setMsg($("nameMsg"), "保存失败：" + err.message, "err");
        } finally {
          $("nameSubmit").disabled = false;
        }
      });

      $("birthdayForm").addEventListener("submit", async e => {
        e.preventDefault();
        const b = $("birthday").value;
        if (!b) return;
        if (!confirm(`生日设为 ${b}，设定后不能修改，确定吗？`)) return;
        $("birthdaySubmit").disabled = true;
        try {
          await updateDoc(ref, { birthday: b });
          showBirthday(b);
          setMsg($("birthdayMsg"), "生日已设定 🎂", "ok");
        } catch (err) {
          setMsg($("birthdayMsg"), "设定失败：" + err.message, "err");
          $("birthdaySubmit").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
