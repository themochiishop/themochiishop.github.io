<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbe7ec">
  <meta name="robots" content="noindex">
  <title>Offline · Mochii Club</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #fbe7ec; color: #5a2a3d; text-align: center;
      font-family: Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }
    .box { max-width: 340px; }
    img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 8px 24px rgba(212, 83, 126, .18); }
    h1 { font-size: 1.25rem; margin: 22px 0 6px; }
    p { margin: 0 0 4px; font-size: .92rem; line-height: 1.55; color: #8a4a63; }
    button {
      margin-top: 22px; padding: 12px 30px; border: 0; border-radius: 999px; cursor: pointer;
      background: #ff6fae; color: #fff; font-size: 1rem; font-weight: 700;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="Mochii Member Club">
    <h1 id="t">You're offline</h1>
    <p id="d">Please check your internet connection and try again.</p>
    <button id="b" type="button">Try again</button>
  </div>
  <script>
    (function () {
      var T = {
        en: ["You're offline", "Please check your internet connection and try again.", "Try again"],
        ms: ["Tiada sambungan internet", "Sila semak sambungan internet anda dan cuba lagi.", "Cuba lagi"],
        zh: ["网络好像断了", "请检查网络连接，再试一次。", "重新载入"]
      };
      var l = "en";
      try { l = localStorage.getItem("mochii_lang") || ""; } catch (e) {}
      if (!T[l]) l = /^zh/i.test(navigator.language) ? "zh" : /^(ms|id)/i.test(navigator.language) ? "ms" : "en";
      document.documentElement.lang = l === "zh" ? "zh-CN" : l;
      document.getElementById("t").textContent = T[l][0];
      document.getElementById("d").textContent = T[l][1];
      document.getElementById("b").textContent = T[l][2];
      document.getElementById("b").onclick = function () { location.reload(); };
      window.addEventListener("online", function () { location.reload(); });
    })();
  </script>
</body>
</html>
